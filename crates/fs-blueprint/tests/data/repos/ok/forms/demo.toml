# the forms description of the demo program: the head of the exchange form, the contract it needs and the title in both languages
schema = 3
kind = "frontend"
id = "board"
extends = "net.freesynergy.Demo"
exec = "fs-forms-run"
title = "demo-title"

[[requires]]
elem = "requires:1"
contract = "people >=0.1 <0.2"

[[message]]
elem = "message:demo-title/en"
key = "demo-title"
lang = "en"
text = "Demo"

[[message]]
elem = "message:demo-title/de"
key = "demo-title"
lang = "de"
text = "Demo"
