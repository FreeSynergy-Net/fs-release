name: gates
description: Run scripts/gates.sh (fmt, clippy pedantic, test, coding rules ADR 0043) from this repo, at the same ref as the action. The toolchain is the one in RUST_VERSION.
inputs:
  working-directory: { description: "Cargo workspace root", default: "." }
  diff-base: { description: "Git revision to diff against (e.g. origin/main): the TEST gate then runs only the crates changed since it and their dependants (fmt, clippy, rules, lock, files stay full); empty = the whole workspace", default: "" }
  profile: { description: "nextest profile for the TEST gate (name from .config/nextest.toml of the caller, e.g. quick or release); empty = default profile. A profile the caller does not define is said in the log and the default profile runs", default: "" }
runs:
  using: composite
  steps:
    # cargo-nextest for the gate `test` (scripts/test-gate.sh): the version of scripts/nextest.pin, installed prebuilt and checked against the sha256 of the manifest of this pinned action (no compile, seconds)
    - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
      with:
        tool: cargo-nextest@0.9.151
    - shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        FS_GATES_DIFF_BASE: ${{ inputs.diff-base }}
        FS_GATES_PROFILE: ${{ inputs.profile }}
      run: '"$GITHUB_ACTION_PATH/../../scripts/gates.sh" "$PWD"'
