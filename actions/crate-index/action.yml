name: crate-index
description: "Put ONE crate version of a tag run into the git index registry `freesynergy` (repo fs-crates): cargo package, index line, checksum, .crate file, one commit, push. Tag run only; docs/crate-index.md."
inputs:
  package: { description: "Cargo package (-p) to publish", required: true }
  working-directory: { description: "Directory of the Cargo workspace", default: "." }
  index-repo: { description: "Registry repo (owner/name)", default: "FreeSynergy-Net/fs-crates" }
  index-url: { description: "URL consumers use as `index` (must be the same string in every .cargo/config.toml)", default: "https://github.com/FreeSynergy-Net/fs-crates" }
  token: { description: "Token with contents write on the registry repo ONLY", required: true }
runs:
  using: composite
  steps:
    # the tool is built from the checkout this action itself comes from, so workflow and tool always have the same ref (pin-refs.sh pins the ref)
    - shell: bash
      env:
        PACKAGE: ${{ inputs.package }}
        WORKDIR: ${{ inputs.working-directory }}
        INDEX_REPO: ${{ inputs.index-repo }}
        INDEX_URL: ${{ inputs.index-url }}
        TOKEN: ${{ inputs.token }}
      run: |
        set -euo pipefail
        [ "$GITHUB_REF_TYPE" = tag ] || { echo "::error::crate-index: not a tag run (ref_type=${GITHUB_REF_TYPE:-none}); the registry is written only from a tag"; exit 1; }
        echo "::add-mask::$TOKEN"
        auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
        echo "::add-mask::${auth##* }"
        cargo build --locked --release --manifest-path "$GITHUB_ACTION_PATH/../../Cargo.toml" -p fs-crate-index --target-dir "$RUNNER_TEMP/ci-target"
        reg="$RUNNER_TEMP/registry"
        git -c "http.extraheader=$auth" clone --quiet "https://github.com/$INDEX_REPO.git" "$reg"
        git -C "$reg" config user.name FreeSynergy
        git -C "$reg" config user.email support@freesynergy.net
        "$RUNNER_TEMP/ci-target/release/fs-crate-index" publish --git-ref "$GITHUB_REF" --package "$PACKAGE" --workspace "$WORKDIR" \
          --registry-dir "$reg" --index-url "$INDEX_URL" --target-dir "$RUNNER_TEMP/ci-package"
        # two tag runs of different crates may push at the same time: one rebase and push again (the commits touch different files); never force
        git -c "http.extraheader=$auth" -C "$reg" push --quiet origin HEAD:main || { git -c "http.extraheader=$auth" -C "$reg" pull --quiet --rebase origin main && git -c "http.extraheader=$auth" -C "$reg" push --quiet origin HEAD:main; }
