name: setup-rust
description: Rust toolchain (default "pinned" = the one version in fs-release/RUST_VERSION, used by gates AND release builds; the only other allowed value is an MSRV for the msrv check) plus Swatinem/rust-cache.
inputs:
  toolchain: { description: "Toolchain: pinned (the central version file RUST_VERSION of fs-release) or, only for the msrv check, an MSRV like 1.85", default: pinned }
  targets: { description: "Comma separated extra targets", default: "" }
  components: { description: "Comma separated components", default: "" }
  working-directory: { description: "Cargo workspace directory", default: "." }
  cache-key: { description: "Extra rust-cache key", default: "" }
  cache: { description: "Use the Rust cache (true) or not (false: a cold run, the evidence for a tag)", default: "true" }
runs:
  using: composite
  steps:
    - name: Resolve toolchain
      id: tc
      shell: bash
      env:
        WANTED: ${{ inputs.toolchain }}
      run: |
        if [ "$WANTED" = pinned ]; then WANTED=$(tr -d '[:space:]' < "$GITHUB_ACTION_PATH/../../RUST_VERSION"); fi
        echo "toolchain=$WANTED" >> "$GITHUB_OUTPUT"
    - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
      with:
        toolchain: ${{ steps.tc.outputs.toolchain }}
        targets: ${{ inputs.targets }}
        components: ${{ inputs.components }}
    # N1d: from here on the toolchain is the ONE chosen above, by the environment, which beats a rust-toolchain.toml of the caller (also one with `path = ...`, a toolchain that runs arbitrary code):
    # rust-cache runs `rustc -vV` and `cargo metadata` without `+toolchain`. scripts/test_check_job_identity.sh checks that this step stands before rust-cache.
    - name: Fix the toolchain (RUSTUP_TOOLCHAIN)
      shell: bash
      env:
        TOOLCHAIN: ${{ steps.tc.outputs.toolchain }}
      run: echo "RUSTUP_TOOLCHAIN=$TOOLCHAIN" >> "$GITHUB_ENV"
    - if: inputs.cache != 'false'
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        workspaces: ${{ inputs.working-directory }}
        key: ${{ inputs.cache-key }}
