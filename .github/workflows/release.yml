# Reusable release pipeline: plan -> platform jobs -> signed, attested draft -> Pre-release (fs-catalog pulls it from there). Usage: docs/usage.md
# LIBRARY MODE: with `kind: library` and an empty `binaries` (pure library, no packages; an empty `binaries` WITHOUT `kind: library` is still an error) the plan carries `library: true`, every platform job, `finalize` (SBOM,
# signatures, checksums, provenance) and `publish` are skipped, and the job `library` creates the Pre-release whose notes are the CHANGELOG section
# of the tag version. The plan fails unless tag = Cargo workspace version = non-empty CHANGELOG section. No artefacts, so no binary packages and no
# signature; the job `library` sees no secret (only its own GITHUB_TOKEN with contents: write). The actions used here exist only from the pin
# round after the merge (scripts/pin-refs.sh): until then the SHA below does not contain library mode.
name: release
on:
  workflow_call:
    inputs:
      binaries: { type: string, default: "", description: "Comma separated binary names; empty only together with kind library" }
      app-id: { type: string, default: "", description: "Reverse-DNS id, e.g. net.freesynergy.CapnpCompiler (AppImage, Flatpak, macOS bundle)" }
      app-name: { type: string, default: "", description: "Human readable name (default - project name)" }
      description: { type: string, default: "", description: "One line (default - Cargo description)" }
      kind: { type: string, default: cli, description: "cli, daemon or app - selects the default formats; library = pure library (library mode, binaries must be empty)" }
      name: { type: string, default: "", description: "Artefact base name (default - Cargo package)" }
      ignore-binaries: { type: string, default: "", description: "Binaries under crates/ that are deliberately not packaged (* = all)" }
      cargo-package: { type: string, default: "", description: "Cargo package (-p) in a workspace" }
      working-directory: { type: string, default: ".", description: "Directory of the Cargo workspace" }
      features: { type: string, default: "", description: "Cargo features for release builds" }
      tag: { type: string, default: "", description: "Tag to release (default - the pushed tag)" }
      linux-targets: { type: string, default: "x86_64,aarch64", description: "Subset of x86_64,aarch64; empty disables Linux" }
      windows-targets: { type: string, default: "x86_64", description: "x86_64 and/or aarch64 (zip only); empty disables Windows" }
      macos: { type: boolean, default: true, description: "Universal macOS build" }
      linux-formats: { type: string, default: "", description: "Override: tar.gz,deb,rpm,appimage,arch" }
      windows-formats: { type: string, default: "", description: "Override: zip,msi,exe" }
      macos-formats: { type: string, default: "", description: "Override: tar.gz,dmg" }
      apt-packages: { type: string, default: "", description: "System packages needed to build on Linux" }
      flatpak: { type: boolean, default: false, description: "Build a Flatpak bundle (needs the manifest)" }
      flatpak-manifest: { type: string, default: "", description: "Path of the Flatpak manifest" }
      container: { type: boolean, default: false, description: "Build an OCI image from the Linux binaries" }
      containerfile: { type: string, default: Containerfile, description: "Containerfile (build context holds amd64/ and arm64/)" }
      container-image: { type: string, default: "", description: "Image name for pushing, e.g. ghcr.io/freesynergy/fs-registry" }
      container-push: { type: boolean, default: false, description: "Push the image (public!) - default only exports an OCI archive" }
      android: { type: boolean, default: false, description: "TODO - Android build (arrives with the first Blinc app)" }
      ios: { type: boolean, default: false, description: "TODO - iOS build (build only)" }
      smoke: { type: boolean, default: true, description: "Install each package on its system (Debian 13, Ubuntu 24.04, Windows) and start every binary; a failure stops the release" }
      smoke-args: { type: string, default: "--version", description: "Arguments for that start test; the binary must exit 0" }
      attest: { type: boolean, default: true, description: "SLSA provenance (private repos need GitHub Enterprise)" }
      dry-run: { type: boolean, default: false, description: "Check what publish would do (guards) but change nothing" }
    secrets:
      GPG_PRIVATE_KEY: { required: false, description: "ASCII-armoured OpenPGP secret key; unsigned without it" }
      GPG_PASSPHRASE: { required: false, description: "Passphrase of that key" }

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: plan
        uses: FreeSynergy/fs-release/actions/plan@f1211066d0072c6319678659e845c19ae4384bd0
        with:
          tag: ${{ inputs.tag }}
          name: ${{ inputs.name }}
          binaries: ${{ inputs.binaries }}
          cargo-package: ${{ inputs.cargo-package }}
          ignore-binaries: ${{ inputs.ignore-binaries }}
          working-directory: ${{ inputs.working-directory }}
          features: ${{ inputs.features }}
          kind: ${{ inputs.kind }}
          app-id: ${{ inputs.app-id }}
          app-name: ${{ inputs.app-name }}
          description: ${{ inputs.description }}
          linux-targets: ${{ inputs.linux-targets }}
          windows-targets: ${{ inputs.windows-targets }}
          macos: ${{ inputs.macos }}
          linux-formats: ${{ inputs.linux-formats }}
          windows-formats: ${{ inputs.windows-formats }}
          macos-formats: ${{ inputs.macos-formats }}

  linux:
    needs: plan
    if: fromJSON(needs.plan.outputs.plan).has_linux
    uses: FreeSynergy/fs-release/.github/workflows/_release-linux.yml@f1211066d0072c6319678659e845c19ae4384bd0
    with:
      plan: ${{ needs.plan.outputs.plan }}
      apt-packages: ${{ inputs.apt-packages }}
      smoke: ${{ inputs.smoke }}
      smoke-args: ${{ inputs.smoke-args }}

  windows:
    needs: plan
    if: fromJSON(needs.plan.outputs.plan).has_windows
    uses: FreeSynergy/fs-release/.github/workflows/_release-windows.yml@f1211066d0072c6319678659e845c19ae4384bd0
    with:
      plan: ${{ needs.plan.outputs.plan }}
      smoke: ${{ inputs.smoke }}
      smoke-args: ${{ inputs.smoke-args }}

  macos:
    needs: plan
    if: fromJSON(needs.plan.outputs.plan).has_macos
    uses: FreeSynergy/fs-release/.github/workflows/_release-macos.yml@f1211066d0072c6319678659e845c19ae4384bd0
    with:
      plan: ${{ needs.plan.outputs.plan }}

  flatpak:
    needs: plan
    if: inputs.flatpak && !fromJSON(needs.plan.outputs.plan).library
    uses: FreeSynergy/fs-release/.github/workflows/_release-flatpak.yml@f1211066d0072c6319678659e845c19ae4384bd0
    with:
      plan: ${{ needs.plan.outputs.plan }}
      manifest: ${{ inputs.flatpak-manifest }}

  container:
    needs: [plan, linux]
    if: inputs.container && !fromJSON(needs.plan.outputs.plan).library
    uses: FreeSynergy/fs-release/.github/workflows/_release-container.yml@f1211066d0072c6319678659e845c19ae4384bd0
    permissions:
      contents: read
      packages: write
    with:
      plan: ${{ needs.plan.outputs.plan }}
      containerfile: ${{ inputs.containerfile }}
      image: ${{ inputs.container-image }}
      push: ${{ inputs.container-push }}

  mobile:
    needs: plan
    if: (inputs.android || inputs.ios) && !fromJSON(needs.plan.outputs.plan).library
    uses: FreeSynergy/fs-release/.github/workflows/_release-mobile.yml@f1211066d0072c6319678659e845c19ae4384bd0
    with:
      plan: ${{ needs.plan.outputs.plan }}
      android: ${{ inputs.android }}
      ios: ${{ inputs.ios }}

  finalize:
    needs: [plan, linux, windows, macos, flatpak, container, mobile]
    if: ${{ !cancelled() && needs.plan.result == 'success' && !fromJSON(needs.plan.outputs.plan).library && !contains(needs.*.result, 'failure') }}
    uses: FreeSynergy/fs-release/.github/workflows/_release-finalize.yml@f1211066d0072c6319678659e845c19ae4384bd0
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      plan: ${{ needs.plan.outputs.plan }}
      attest: ${{ inputs.attest }}
    secrets:
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

  # Library mode: no artefacts, no signature, no secret; draft with the notes of the CHANGELOG section, then Pre-release.
  library:
    needs: plan
    if: fromJSON(needs.plan.outputs.plan).library
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the tag commit must be an ancestor of origin/main (release.sh)
      - uses: FreeSynergy/fs-release/actions/library-release@f1211066d0072c6319678659e845c19ae4384bd0
        with:
          tag: ${{ fromJSON(needs.plan.outputs.plan).tag }}
          name: ${{ inputs.name }}
          working-directory: ${{ inputs.working-directory }}
          dry-run: ${{ inputs.dry-run }}
          token: ${{ github.token }}

  # After the draft: publish as Pre-release, only when every file and signature is there.
  publish:
    needs: [plan, finalize]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.finalize.result == 'success' }}
    uses: FreeSynergy/fs-release/.github/workflows/_release-publish.yml@f1211066d0072c6319678659e845c19ae4384bd0
    permissions:
      contents: write
    with:
      tag: ${{ fromJSON(needs.plan.outputs.plan).tag }}
      dry-run: ${{ inputs.dry-run }}
