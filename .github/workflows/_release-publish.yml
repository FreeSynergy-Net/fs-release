# Internal: after a successful finalize - publish the draft as Pre-release (own GITHUB_TOKEN, no secret).
# The catalog is NOT touched from here: fs-catalog pulls published Pre-releases itself (see DESIGN.md "Release to catalog").
name: _release-publish
on:
  workflow_call:
    inputs:
      tag: { type: string, required: true }
      dry-run: { type: boolean, default: false }
      attest: { type: boolean, default: true }

permissions:
  contents: write
  attestations: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: FreeSynergy/fs-release/actions/publish-release@eb353790cf603a0ef119996012e01049b5d7545d
        with:
          tag: ${{ inputs.tag }}
          repo: ${{ github.repository }}
          token: ${{ github.token }}
          dry-run: ${{ inputs.dry-run }}
          attest: ${{ inputs.attest }}
