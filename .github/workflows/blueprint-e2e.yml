# End to end for fs-blueprint on a Linux AND a Windows runner (rule: a program must build and start on both, proven by a real run, not by a Unix test alone).
# Job 1: the whole crate's tests on the platform (paths, links/junctions, line endings). Job 2: ONE blueprint becomes a data package (no Cargo.toml, no Rust source),
# its files are there and `check --drift` on it is clean; nothing of it is built (crates/fs-blueprint/tests/e2e.rs, `#[ignore]` in the normal gates).
# On a push to `unreviewed/**` (next to branch-ci) and by hand. No secrets.
name: blueprint-e2e
on:
  push:
    branches: ['unreviewed/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blueprint-e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: FreeSynergy-Net/fs-release/actions/setup-rust@da557ba317f87252f53f808d06b76a0db5dfaecd
        with:
          toolchain: pinned
          cache-key: blueprint-e2e-${{ matrix.os }}
      - name: fs-blueprint tests on this platform
        run: cargo test -p fs-blueprint --locked --no-fail-fast
      - name: one blueprint becomes a data package that checks without drift
        run: cargo test -p fs-blueprint --locked --test e2e -- --ignored --nocapture
      - name: the command `fs-blueprint check` on the fixtures (a good repo is ok, a bad one gives exit code 1 and its codes)
        shell: bash
        run: |
          cargo build -p fs-blueprint --locked --bin fs-blueprint
          suffix=""
          if [ "$RUNNER_OS" = Windows ]; then suffix=".exe"; fi
          bin="target/debug/fs-blueprint$suffix"
          "$bin" --version
          "$bin" check --repo crates/fs-blueprint/tests/data/repos/ok
          rc=0
          "$bin" check --repo crates/fs-blueprint/tests/data/repos/bad > bad.out || rc=$?
          cat bad.out
          test "$rc" = 1
          grep -q 'layout-outside-forms' bad.out
          grep -q 'talk-not-found' bad.out
          grep -q 'module-unknown' bad.out
          # the one command: a good blueprint becomes a data package (CI, contract text, tables, packaging; no Cargo.toml, no .rs), a bad one writes nothing
          "$bin" new crates/fs-blueprint/tests/data/repos/ok/scaffold.toml --out "$RUNNER_TEMP/made"
          test -f "$RUNNER_TEMP/made/.github/workflows/check.yml"
          test -f "$RUNNER_TEMP/made/schema/demo.capnp"
          test -f "$RUNNER_TEMP/made/schema/demo.sql"
          test -f "$RUNNER_TEMP/made/packaging/net.freesynergy.Demo.desktop"
          test ! -e "$RUNNER_TEMP/made/Cargo.toml"
          test ! -e "$RUNNER_TEMP/made/crates"
          rc=0
          "$bin" new crates/fs-blueprint/tests/data/repos/bad/scaffold.toml --out "$RUNNER_TEMP/not-made" > /dev/null || rc=$?
          test "$rc" = 1
          test ! -e "$RUNNER_TEMP/not-made"
          # the example of the README (examples/leer) with the binary of THIS branch (the README itself runs the installed tag)
          "$bin" new examples/leer/scaffold.toml --out "$RUNNER_TEMP/leer"
          "$bin" check --repo "$RUNNER_TEMP/leer"
          # the check on the package that was made: clean; then a hand change to a generated file is red (the data package has no crates/ to look at)
          made="$RUNNER_TEMP/made"
          "$bin" check --repo "$made" --drift
          printf '# hand\n' >> "$made/.github/workflows/check.yml"
          rc=0
          "$bin" check --repo "$made" --drift > "$RUNNER_TEMP/drift.out" || rc=$?
          cat "$RUNNER_TEMP/drift.out"
          test "$rc" = 1
          grep -q 'generated-changed{path=.github/workflows/check.yml}' "$RUNNER_TEMP/drift.out"
          # rule `code-in-program`: a hand-written .rs in the data package is red (the finding is the proof, exit code 1)
          mkdir -p "$made/crates/x/src"
          printf 'fn main() {}\n' > "$made/crates/x/src/lib.rs"
          rc=0
          "$bin" check --repo "$made" > "$RUNNER_TEMP/code.out" || rc=$?
          cat "$RUNNER_TEMP/code.out"
          test "$rc" = 1
          grep -q 'code-in-program{path=crates/x/src/lib.rs}' "$RUNNER_TEMP/code.out"
          rm -r "$made/crates"
          # the example folder brings NO forms description: the file in the made package is the seed that `new` writes
          test ! -e examples/leer/forms/simple.toml
          test -f "$RUNNER_TEMP/leer/forms/simple.toml"
          # fs-starter (the host that opens the description) is NOT a part of this repo and is not installed here: no call, no stand-in. The window proof
          # (`fs-starter --check` over the output of `new`) belongs to the starter's own CI against this output; a fake call here would prove nothing.
          echo "$bin" > .fs-blueprint-bin
      # Acceptance on the two real blueprints (informational: the branches may move; the expected red reasons are in the CHANGELOG and the report of the step S4).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        continue-on-error: true
        with:
          repository: FreeSynergy-Net/fs-tasks
          ref: unreviewed/bauplan-schema2-2
          path: acceptance/tasks
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        continue-on-error: true
        with:
          repository: FreeSynergy-Net/fs-people
          ref: unreviewed/bauplan-schema2-2
          path: acceptance/people
          persist-credentials: false
      - name: fs-blueprint check on the blueprints of tasks and people (shows the findings; does not fail the job)
        shell: bash
        continue-on-error: true
        run: |
          bin=$(cat .fs-blueprint-bin)
          for p in tasks people; do
            echo "== $p"
            "$bin" check --repo "acceptance/$p" | sed -e 's/  .*//' -e 's/{.*//' | sort | uniq -c | sort -rn || true
          done
  # The commands of the README run WORD FOR WORD (scripts/readme-run.sh reads the block after `<!-- readme-run -->`): install from the tag into a work
  # folder, copy examples/leer, `new` with the catalog that comes with the command (no --catalog), `check --repo`. A wrong README line or an invalid example is red.
  readme:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: FreeSynergy-Net/fs-release/actions/setup-rust@da557ba317f87252f53f808d06b76a0db5dfaecd
        with:
          toolchain: pinned
          cache-key: blueprint-readme-${{ matrix.os }}
      - name: the README commands, word for word
        shell: bash
        run: bash scripts/readme-run.sh README.md

  # The step of the reusable check.yml (input `blueprint`): the command is built from the pinned commit with `cargo install --git ... --rev`; this job proves that
  # the very same install line works and that the installed command checks a good repo (Linux; the reusable workflow runs on ubuntu by default).
  install:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: FreeSynergy-Net/fs-release/actions/setup-rust@da557ba317f87252f53f808d06b76a0db5dfaecd
        with:
          toolchain: pinned
          cache-key: blueprint-install
      - name: the install line of check.yml, with its default revision
        run: |
          # the default of `blueprint-rev` is empty = the commit of the called workflow; for a caller pinned to a tag that is the tag commit, here it is this commit
          grep -q 'blueprint-rev: { type: string, default: ""' .github/workflows/check.yml
          rev="$GITHUB_SHA"
          [[ "$rev" =~ ^[0-9a-f]{40}$ ]]
          cargo install --git https://github.com/FreeSynergy-Net/fs-release --rev "$rev" --locked --root "$RUNNER_TEMP/fsbp" fs-blueprint
          "$RUNNER_TEMP/fsbp/bin/fs-blueprint" --version
          "$RUNNER_TEMP/fsbp/bin/fs-blueprint" check --repo crates/fs-blueprint/tests/data/repos/ok
