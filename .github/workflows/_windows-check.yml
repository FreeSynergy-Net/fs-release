# Reusable Windows gate: fmt, clippy (pedantic) and tests on an explicit Windows runner. The pure-Rust crate is linted and tested
# here, never cross-built. One definition for every repo (a caller is a few lines: examples/callers/windows.yml). No secrets.
# Same flags as check.yml (with --locked); the toolchain comes from RUST_VERSION through setup-rust, pinned like every internal reference.
name: _windows-check
on:
  workflow_call:
    inputs:
      runner: { type: string, default: windows-2022, description: "Runner label, always an explicit version" }
      packages: { type: string, default: "", description: "Space separated crate names (-p each); empty = the whole workspace" }
      features: { type: string, default: "--all-features", description: "Feature flags for clippy and test, e.g. --all-features or --features a,b; empty = defaults" }
      clippy-extra: { type: string, default: "-W clippy::pedantic", description: "Extra clippy lint flags after -D warnings; empty = none" }
      timeout-minutes: { type: number, default: 90, description: "Job timeout in minutes (a hanging clippy or test must not run for hours)" }
      cache: { type: boolean, default: true, description: "Rust cache on (default); false = cold run (evidence for a tag, start by workflow_dispatch)" }
      no-fail-fast: { type: boolean, default: true, description: "cargo test --no-fail-fast (run every test, report all failures)" }

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  windows:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    defaults:
      run:
        shell: bash
    env:
      RUNNER: ${{ inputs.runner }}
      PACKAGES: ${{ inputs.packages }}
      FEATURES: ${{ inputs.features }}
      CLIPPY_EXTRA: ${{ inputs.clippy-extra }}
      NO_FAIL_FAST: ${{ inputs.no-fail-fast }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: FreeSynergy-Net/fs-release/actions/setup-rust@4e736ba873b7875add722b850d49f329f40e1b88
        with:
          toolchain: pinned
          components: rustfmt,clippy
          cache-key: windows
          cache: ${{ inputs.cache }}
      - name: Inputs are plain words (they end up on a command line)
        run: |
          set -euo pipefail
          [[ $RUNNER =~ ^windows-[0-9]+$ ]] || { echo "::error::runner must be windows-<number> only: $RUNNER"; exit 1; }
          for v in "$PACKAGES" "$FEATURES" "$CLIPPY_EXTRA"; do
            [[ $v =~ ^[A-Za-z0-9_\ ,/=.:-]*$ ]] || { echo "::error::input with a character that is not allowed: $v"; exit 1; }
          done
      - name: fmt
        id: fmt
        continue-on-error: true
        run: cargo fmt --check
      - name: clippy
        id: clippy
        continue-on-error: true
        run: |
          set -euo pipefail
          sel=(--workspace)
          if [ -n "$PACKAGES" ]; then sel=(); for p in $PACKAGES; do sel+=(-p "$p"); done; fi
          # shellcheck disable=SC2086
          cargo clippy "${sel[@]}" --all-targets $FEATURES --locked -- -D warnings $CLIPPY_EXTRA
      - name: test
        id: test
        continue-on-error: true
        run: |
          set -euo pipefail
          sel=(--workspace)
          if [ -n "$PACKAGES" ]; then sel=(); for p in $PACKAGES; do sel+=(-p "$p"); done; fi
          extra=()
          if [ "$NO_FAIL_FAST" = "true" ]; then extra+=(--no-fail-fast); fi
          # shellcheck disable=SC2086
          cargo test "${sel[@]}" $FEATURES --locked "${extra[@]}"
      - name: Collect the results (every step above ran; the job is red when one was)
        if: always()
        env:
          RESULTS: |
            fmt ${{ steps.fmt.outcome }}
            clippy ${{ steps.clippy.outcome }}
            test ${{ steps.test.outcome }}
        run: |
          red=0
          list="$(mktemp)"
          {
            echo "### Results of this job (one line per step, none stops the others)"
            while read -r label outcome; do
              [ -n "$label" ] || continue
              echo "- $label: $outcome"
              case "$outcome" in failure|cancelled) red=1 ;; esac
            done <<< "$RESULTS"
          } > "$list"
          cat "$list"
          cat "$list" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          exit "$red"
