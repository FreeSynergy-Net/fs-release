# Branch CI of fs-release itself (CI before a tag, rule [ZWEIG-CI]): on a push to `unreviewed/**` the Rust gates of THIS branch run
# (scripts/gates.sh: fmt, clippy pedantic, all tests incl. the workflows* tests, check_rust_rules, lock/yaml checks) next to the `lint` run.
# Not a reusable workflow: the callable ci.yml / check.yml (the @v0.0.x contracts of other repos) are unchanged. No pull-request trigger (no double run).
name: branch-ci
on:
  push:
    branches: ['unreviewed/**']

permissions:
  contents: read

concurrency:
  group: branch-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # full history AND tags: released_changelog_sections_equal_their_tags (scripts/test_changelog_released.sh) reads every tag
      - uses: FreeSynergy-Net/fs-release/actions/setup-rust@a509bb16828cdeac9aba107553b39cf6d97d33b9
        with:
          toolchain: pinned
          components: rustfmt,clippy
          cache-key: branch-ci
      # cargo-nextest for the gate `test` (scripts/test-gate.sh), the same version and install action as actions/gates (scripts/nextest.pin)
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-nextest@0.9.151
      - name: tools of the package tests (rpm and cpio, the rpm tests must run and a missing tool is red)
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends rpm cpio
      - name: gates of this branch (scripts/gates.sh, one rc per gate)
        id: gates-of-this
        continue-on-error: true
        run: scripts/gates.sh "$PWD"
      - name: configs/nextest.toml is accepted by the real cargo-nextest (scripts/test_nextest_config.sh; needs nextest, so here and not in lint)
        id: nextest-config
        continue-on-error: true
        run: bash scripts/test_nextest_config.sh
      - name: Collect the results (every step above ran; the job is red when one was)
        if: always()
        env:
          RESULTS: |
            gates-of-this ${{ steps.gates-of-this.outcome }}
            nextest-config ${{ steps.nextest-config.outcome }}
        run: |
          red=0
          list="$(mktemp)"
          {
            echo "### Results of this job (one line per step, none stops the others)"
            while read -r label outcome; do
              [ -n "$label" ] || continue
              echo "- $label: $outcome"
              case "$outcome" in failure|cancelled) red=1 ;; esac
            done <<< "$RESULTS"
          } > "$list"
          cat "$list"
          cat "$list" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          exit "$red"
