# Branch CI of fs-release itself (CI before a tag, rule [ZWEIG-CI]): on a push to `unreviewed/**` the Rust gates of THIS branch run
# (scripts/gates.sh: fmt, clippy pedantic, all tests incl. the workflows* tests, check_rust_rules, lock/yaml checks) next to the `lint` run.
# Not a reusable workflow: the callable ci.yml / check.yml (the @v0.0.x contracts of other repos) are unchanged. No pull-request trigger (no double run).
name: branch-ci
on:
  push:
    branches: ['unreviewed/**']

permissions:
  contents: read

concurrency:
  group: branch-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # full history AND tags: released_changelog_sections_equal_their_tags (scripts/test_changelog_released.sh) reads every tag
      - uses: FreeSynergy/fs-release/actions/setup-rust@1bf6c81a13edb7a176e55d95cce82cdb1f67dd63
        with:
          toolchain: pinned
          components: rustfmt,clippy
          cache-key: branch-ci
      - name: gates of this branch (scripts/gates.sh, one rc per gate)
        id: gates-of-this
        continue-on-error: true
        run: scripts/gates.sh "$PWD"
      - name: Collect the results (every step above ran; the job is red when one was)
        if: always()
        env:
          RESULTS: |
            gates-of-this ${{ steps.gates-of-this.outcome }}
        run: |
          red=0
          list="$(mktemp)"
          {
            echo "### Results of this job (one line per step, none stops the others)"
            while read -r label outcome; do
              [ -n "$label" ] || continue
              echo "- $label: $outcome"
              case "$outcome" in failure|cancelled) red=1 ;; esac
            done <<< "$RESULTS"
          } > "$list"
          cat "$list"
          cat "$list" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          exit "$red"
