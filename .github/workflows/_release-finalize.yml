# Internal: SBOM, signatures, checksums, provenance, DRAFT release. The only job that sees secrets.
name: _release-finalize
on:
  workflow_call:
    inputs:
      plan: { type: string, required: true }
      attest: { type: boolean, default: true }
    secrets:
      GPG_PRIVATE_KEY: { required: false }
      GPG_PASSPHRASE: { required: false }

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    # The ONLY job with the signing key: it waits for the required reviewer of this GitHub environment (the owner's account, never an agent account;
    # set up by the owner: docs/usage.md "Approval for the signing job"). Secrets belong to the environment, not to the repository.
    environment: release-signing
    steps:
      - name: only the commit of a tag is signed
        run: |
          set -euo pipefail
          [ "$GITHUB_REF_TYPE" = tag ] || { echo "::error::signing runs only for a tag (ref_type=$GITHUB_REF_TYPE)"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the next step needs origin/main
      - name: the commit of the tag is on main
        uses: FreeSynergy-Net/fs-release/actions/tag-on-main@2baf06fe5a273ee03795c76a590054bf0f4d5d04
        env:
          TAG: ${{ fromJSON(inputs.plan).tag }}
      - name: the checkout is the commit of the tag
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD)" = "$GITHUB_SHA" ] || { echo "::error::HEAD is not github.sha - not the commit of the tag"; exit 1; }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      # SBOM per kind (README "SBOM per kind"): decided by the plan (the plan job printed the notice before the approval). data and module = no SBOM for now, said in the log and in the release notes;
      # cli, daemon, app: cargo sbom of the workdir (a superset: all platforms and features, see the README).
      - name: no SBOM for kind data or module
        if: fromJSON(inputs.plan).kind == 'data' || fromJSON(inputs.plan).kind == 'module'
        run: echo "::notice::kind ${{ fromJSON(inputs.plan).kind }} - no SBOM for now, on purpose (no exact package-level SBOM yet)"
      - if: fromJSON(inputs.plan).kind != 'data' && fromJSON(inputs.plan).kind != 'module'
        uses: FreeSynergy-Net/fs-release/actions/sbom@2baf06fe5a273ee03795c76a590054bf0f4d5d04
        with:
          name: ${{ fromJSON(inputs.plan).name }}
          version: ${{ fromJSON(inputs.plan).version }}
          working-directory: ${{ fromJSON(inputs.plan).workdir }}
      # Order matters: package signatures change the files, so they come before the checksums.
      - uses: FreeSynergy-Net/fs-release/actions/sign-files@2baf06fe5a273ee03795c76a590054bf0f4d5d04
        with:
          mode: packages
          private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
      - uses: FreeSynergy-Net/fs-release/actions/checksums@2baf06fe5a273ee03795c76a590054bf0f4d5d04
      - uses: FreeSynergy-Net/fs-release/actions/sign-files@2baf06fe5a273ee03795c76a590054bf0f4d5d04
        with:
          mode: detached
          private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
      - if: inputs.attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - uses: FreeSynergy-Net/fs-release/actions/draft-release@2baf06fe5a273ee03795c76a590054bf0f4d5d04
        with:
          tag: ${{ fromJSON(inputs.plan).tag }}
          name: ${{ fromJSON(inputs.plan).name }}
          prerelease: ${{ fromJSON(inputs.plan).prerelease }}
          kind: ${{ fromJSON(inputs.plan).kind }}
          token: ${{ github.token }}
