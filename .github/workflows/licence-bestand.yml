# Licence inventory (one-off survey, task licence-bestand): runs `cargo deny check licenses` with the ONE policy configs/deny.toml and the cargo-deny of scripts/cargo-deny.pin
# (same sha256 check and --version check as scripts/licence-gate.sh) over every repo of the org FreeSynergy-Net that has a Cargo.toml. Nothing here changes the gate.
# Repo list: the repos of the org FreeSynergy-Net whose root holds a Cargo.toml (`gh repo list FreeSynergy-Net` + contents/Cargo.toml, state 2026-11-24, 33 repos).
# Every repo is its own job (fail-fast false): a red repo never hides the others. The table is in the step summary of the job `table`. No secrets, read access only.
name: licence-bestand
on:
  push:
    branches: ['unreviewed/licence-bestand']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deny:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        repo:
          - fs-access
          - fs-activities
          - fs-ballot
          - fs-broadcast
          - fs-calendars
          - fs-capnpc
          - fs-capture
          - fs-components
          - fs-decisions
          - fs-document
          - fs-draw
          - fs-files
          - fs-forms
          - fs-groups
          - fs-identity
          - fs-interfaces
          - fs-jscalendar
          - fs-maps
          - fs-messages
          - fs-modules-planning
          - fs-objects
          - fs-packages
          - fs-people
          - fs-registry
          - fs-release
          - fs-resources
          - fs-rpc
          - fs-settings
          - fs-starter
          - fs-tally
          - fs-tasks
          - fs-texts
          - fs-types
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: fsr
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: FreeSynergy-Net/${{ matrix.repo }}
          persist-credentials: false
          path: target
      - name: cargo-deny check licenses (pinned binary)
        env:
          REPO: ${{ matrix.repo }}
        run: |
          set -uo pipefail
          pin() { sed -n "s/^$1=//p" fsr/scripts/cargo-deny.pin | head -n 1; }
          version="$(pin CARGO_DENY_VERSION)"; sha="$(pin CARGO_DENY_SHA256)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ && "$sha" =~ ^[0-9a-f]{64}$ ]] || { echo "NOT RUN: bad pin"; exit 64; }
          asset="cargo-deny-$version-x86_64-unknown-linux-musl"
          dl="$RUNNER_TEMP/deny"; mkdir -p "$dl"
          curl -fsSL --retry 3 -o "$dl/$asset.tar.gz" "https://github.com/EmbarkStudios/cargo-deny/releases/download/$version/$asset.tar.gz" || { echo "NOT RUN: download"; exit 64; }
          echo "$sha  $dl/$asset.tar.gz" | sha256sum -c --status - || { echo "NOT RUN: sha256 differs from the pin"; exit 64; }
          tar -xzf "$dl/$asset.tar.gz" -C "$dl" || exit 64
          bin="$dl/$asset/cargo-deny"
          [ "$("$bin" --version)" = "cargo-deny $version" ] || { echo "NOT RUN: wrong version"; exit 64; }
          locked=(); [ -f target/Cargo.lock ] && locked=(--locked)
          rc=0
          "$bin" --format json --manifest-path target/Cargo.toml --workspace "${locked[@]}" --config fsr/configs/deny.toml check licenses 2> deny.jsonl || rc=$?
          # human readable repeat of the same check for the log
          "$bin" --manifest-path target/Cargo.toml --workspace "${locked[@]}" --config fsr/configs/deny.toml check licenses 2>&1 | tail -n 60
          findings="$(jq -r 'select(.type=="diagnostic" and .fields.severity=="error") | "\(.fields.code): \((.fields.graphs[0].Krate | "\(.name) \(.version)") // .fields.message)"' deny.jsonl 2>/dev/null | sort -u | paste -sd';' -)"
          n="$(jq -r 'select(.type=="diagnostic" and .fields.severity=="error") | 1' deny.jsonl 2>/dev/null | wc -l)"
          mkdir -p result
          printf '| %s | %s | %s | %s |\n' "$REPO" "$rc" "$n" "${findings:-none}" > "result/$REPO.row"
          { echo "### $REPO: rc=$rc, errors=$n"; echo "${findings:-none}"; } >> "$GITHUB_STEP_SUMMARY"
          [ "$rc" -eq 0 ]
      - name: keep the row
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: row-${{ matrix.repo }}
          path: result/${{ matrix.repo }}.row
          if-no-files-found: warn
  table:
    needs: deny
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: row-*
          path: rows
          merge-multiple: true
      - name: table
        run: |
          {
            echo "## Licence inventory (cargo deny check licenses, policy configs/deny.toml)"
            echo "rc 0 = green, 4 = licence finding, 64 = NOT RUN (a repo without a row did not run at all)."
            echo
            echo "| repo | rc | errors | findings |"
            echo "|---|---|---|---|"
            cat rows/*.row 2>/dev/null | sort
          } | tee -a "$GITHUB_STEP_SUMMARY"
