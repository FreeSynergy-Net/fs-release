# Licence inventory (one-off survey, task licence-bestand): runs `cargo deny check licenses` with the ONE policy configs/deny.toml and the cargo-deny of scripts/cargo-deny.pin
# (same sha256 check and --version check as scripts/licence-gate.sh) over every repo of the org FreeSynergy-Net that has a Cargo.toml. Nothing here changes the gate.
# Repo list: the repos of the org FreeSynergy-Net whose root holds a Cargo.toml (`gh repo list FreeSynergy-Net` + contents/Cargo.toml, state 2026-11-24): 41 repos = 33 fs-* + group-nesting (our own Rust code, in the matrix: 34 jobs)
# + 7 forks / third-party code (Blinc, blinc-app-fix, blinc-layout-fix, cargo-generate-rpm, kanidm, tuwunel, zentinel): deliberately NOT checked.
# DEVIATION FROM THE GATE (open): the gate (scripts/licence-gate.sh) always runs with --locked. Here, when the run with --locked fails with an rc other than 0/4 (e.g. lock file out of date), it is repeated ONCE without --locked, so the
# inventory still sees the licences. Such a job gets its own rc 65 and stays RED (the gate would be red there too); the table shows it as such. This repeat exists only in this inventory, never in the gate.
# Every repo is its own job (fail-fast false): a red repo never hides the others. The table is in the step summary of the job `table`. No secrets, read access only.
name: licence-bestand
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deny:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        repo:
          - fs-access
          - fs-activities
          - fs-ballot
          - fs-broadcast
          - fs-calendars
          - fs-capnpc
          - fs-capture
          - fs-components
          - fs-decisions
          - fs-document
          - fs-draw
          - fs-files
          - fs-forms
          - fs-groups
          - group-nesting
          - fs-identity
          - fs-interfaces
          - fs-jscalendar
          - fs-maps
          - fs-messages
          - fs-modules-planning
          - fs-objects
          - fs-packages
          - fs-people
          - fs-registry
          - fs-release
          - fs-resources
          - fs-rpc
          - fs-settings
          - fs-starter
          - fs-tally
          - fs-tasks
          - fs-texts
          - fs-types
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: fsr
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: FreeSynergy-Net/${{ matrix.repo }}
          persist-credentials: false
          path: target
      - name: cargo-deny check licenses (pinned binary)
        env:
          REPO: ${{ matrix.repo }}
        run: |
          set -uo pipefail
          pin() { sed -n "s/^$1=//p" fsr/scripts/cargo-deny.pin | head -n 1; }
          version="$(pin CARGO_DENY_VERSION)"; sha="$(pin CARGO_DENY_SHA256)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ && "$sha" =~ ^[0-9a-f]{64}$ ]] || { echo "NOT RUN: bad pin"; exit 64; }
          asset="cargo-deny-$version-x86_64-unknown-linux-musl"
          dl="$RUNNER_TEMP/deny"; mkdir -p "$dl"
          curl -fsSL --retry 3 -o "$dl/$asset.tar.gz" "https://github.com/EmbarkStudios/cargo-deny/releases/download/$version/$asset.tar.gz" || { echo "NOT RUN: download"; exit 64; }
          echo "$sha  $dl/$asset.tar.gz" | sha256sum -c --status - || { echo "NOT RUN: sha256 differs from the pin"; exit 64; }
          tar -xzf "$dl/$asset.tar.gz" -C "$dl" || exit 64
          bin="$dl/$asset/cargo-deny"
          [ "$("$bin" --version)" = "cargo-deny $version" ] || { echo "NOT RUN: wrong version"; exit 64; }
          locked=(); [ -f target/Cargo.lock ] && locked=(--locked)
          rc=0; note=""
          run() { "$bin" "$@" --manifest-path target/Cargo.toml --workspace "${locked[@]}" --config fsr/configs/deny.toml check licenses; }
          run --format json 2> deny.jsonl || rc=$?
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 4 ] && [ "${#locked[@]}" -gt 0 ]; then
            # not a licence finding (rc 4) but a metadata error with --locked: repeat once without it, the inventory wants the licences (DEVIATION FROM THE GATE, see the head of the file)
            first_rc="$rc"; grep -qiE "needs to be updated|--locked was passed" deny.jsonl && lockout=1 || lockout=0
            locked=(); rc=0; run --format json 2> deny.jsonl || rc=$?
            if [ "$rc" -eq 0 ]; then
              # green only without --locked: the gate would be RED here, so the job stays red with its own rc 65
              rc=65; if [ "$lockout" -eq 1 ]; then note=" (lock out of date: green only without --locked, the gate would be red)"; else note=" (metadata error with --locked, rc $first_rc: green only without --locked, the gate would be red)"; fi
            else
              note=" (repeated without --locked after rc $first_rc)"
            fi
          fi
          run 2>&1 | tail -n 60 || true
          findings="$(jq -r 'select(.type=="diagnostic" and .fields.severity=="error") | "\(.fields.code): \((.fields.graphs[0].Krate | "\(.name) \(.version)") // .fields.message)"' deny.jsonl 2>/dev/null | sort -u | paste -sd';' -)"
          n="$(jq -r 'select(.type=="diagnostic" and .fields.severity=="error") | 1' deny.jsonl 2>/dev/null | wc -l)"
          mkdir -p result
          printf '| %s | %s | %s | %s |\n' "$REPO" "$rc$note" "$n" "${findings:-none}" > "result/$REPO.row"
          { echo "### $REPO: rc=$rc, errors=$n"; echo "${findings:-none}"; } >> "$GITHUB_STEP_SUMMARY"
          [ "$rc" -eq 0 ]
      - name: keep the row
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: row-${{ matrix.repo }}
          path: result/${{ matrix.repo }}.row
          if-no-files-found: warn
  table:
    needs: deny
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: row-*
          path: rows
          merge-multiple: true
      - name: table
        run: |
          {
            echo "## Licence inventory (cargo deny check licenses, policy configs/deny.toml)"
            echo "rc 0 = green, 4 = licence finding, 65 = licences ok only without --locked (the gate would be red), 64 = NOT RUN (a repo without a row did not run at all)."
            echo
            echo "| repo | rc | errors | findings |"
            echo "|---|---|---|---|"
            cat rows/*.row 2>/dev/null | sort
          } | tee -a "$GITHUB_STEP_SUMMARY"
