# Internal: Linux packages (matrix x86_64 + aarch64) and the Arch package.
name: _release-linux
on:
  workflow_call:
    inputs:
      plan: { type: string, required: true }
      apt-packages: { type: string, default: "" }
      smoke: { type: boolean, default: true }
      smoke-args: { type: string, default: "--version" }

permissions:
  contents: read

jobs:
  build:
    name: linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.plan).linux_matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: System packages
        if: inputs.apt-packages != ''
        env:
          PACKAGES: ${{ inputs.apt-packages }}
        run: |
          sudo apt-get update
          # shellcheck disable=SC2086
          sudo apt-get install -y --no-install-recommends $PACKAGES
      - uses: FreeSynergy-Net/fs-release/actions/setup-rust@f29118a47442eddb7e5335d8fe15b764c0db916f
        with:
          toolchain: pinned
          targets: ${{ matrix.triple }}
          working-directory: ${{ fromJSON(inputs.plan).workdir }}
          cache-key: release-${{ matrix.arch }}
          cache: ${{ fromJSON(inputs.plan).kind == 'data' && 'false' || 'true' }} # kind data has no Cargo.toml: nothing for rust-cache to read
      - if: contains(fromJSON(inputs.plan).linux_formats, 'deb')
        uses: FreeSynergy-Net/fs-release/actions/install-tools@f29118a47442eddb7e5335d8fe15b764c0db916f
        with:
          tools: cargo-deb@3.8.0
      - if: contains(fromJSON(inputs.plan).linux_formats, 'rpm') && !contains(fromJSON('["module","data"]'), fromJSON(inputs.plan).kind)
        uses: FreeSynergy-Net/fs-release/actions/install-tools@f29118a47442eddb7e5335d8fe15b764c0db916f
        with:
          tools: cargo-generate-rpm@0.21.1
      # kind module/data (INST-4b): the RPM is made by `fs-blueprint package module|rpm`, built from the commit of THIS workflow file (as check.yml does; a full SHA, never a name)
      - name: fs-blueprint (kind module, data)
        if: contains(fromJSON('["module","data"]'), fromJSON(inputs.plan).kind)
        env:
          JOB: ${{ toJSON(job) }}
        run: |
          REV=$(printf '%s' "$JOB" | jq -r 'if (.workflow_repository | IN("FreeSynergy/fs-release", "FreeSynergy-Net/fs-release")) then (.workflow_sha // "") else "" end')
          if ! [[ "$REV" =~ ^[0-9a-f]{40}$ ]]; then echo "::error::cannot read the fs-release commit of this workflow file"; exit 2; fi
          cargo install --git https://github.com/FreeSynergy-Net/fs-release --rev "$REV" --locked --root "$RUNNER_TEMP/fsbp" fs-blueprint
          echo "$RUNNER_TEMP/fsbp/bin" >> "$GITHUB_PATH"
      - uses: FreeSynergy-Net/fs-release/actions/package-linux@f29118a47442eddb7e5335d8fe15b764c0db916f
        with:
          plan: ${{ inputs.plan }}
          arch: ${{ matrix.arch }}
          triple: ${{ matrix.triple }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 3

  arch:
    name: arch x86_64
    needs: build
    if: fromJSON(inputs.plan).has_arch
    runs-on: ubuntu-24.04
    container: archlinux:latest
    steps:
      - name: Tools
        run: pacman -Syu --noconfirm --needed base-devel jq
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-linux-x86_64
          path: dist
      - uses: FreeSynergy-Net/fs-release/actions/package-arch@f29118a47442eddb7e5335d8fe15b764c0db916f
        with:
          plan: ${{ inputs.plan }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-arch
          path: dist/*.pkg.tar.zst
          if-no-files-found: error
          retention-days: 3

  # Install every .deb on the systems we promise (Debian 13, Ubuntu 24.04), start each binary, remove it again.
  smoke-deb:
    name: deb on ${{ matrix.image }} ${{ matrix.entry.arch }}
    needs: build
    if: inputs.smoke && contains(fromJSON(inputs.plan).linux_formats, 'deb')
    runs-on: ${{ matrix.entry.runner }}
    strategy:
      fail-fast: false
      matrix:
        image: ["debian:13", "ubuntu:24.04"]
        entry: ${{ fromJSON(inputs.plan).linux_matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-linux-${{ matrix.entry.arch }}
          path: dist
      - uses: FreeSynergy-Net/fs-release/actions/smoke@f29118a47442eddb7e5335d8fe15b764c0db916f
        with:
          plan: ${{ inputs.plan }}
          format: deb
          image: ${{ matrix.image }}
          args: ${{ inputs.smoke-args }}
