# Reusable check gate for every FreeSynergy Rust repo, meant to run on every push. No secrets. Usage: docs/usage.md
# Stricter than ci.yml (workspace-wide, clippy::pedantic); ci.yml additionally offers MSRV and cargo-deny.
# The checks and their flags live ONLY in scripts/gates.sh (actions/gates runs it); the toolchain version ONLY in RUST_VERSION.
name: check
on:
  workflow_call:
    inputs:
      working-directory: { type: string, default: ".", description: "Directory of the Cargo workspace (and root for the rules checker)" }
      apt-packages: { type: string, default: "", description: "System packages needed to build/test" }
      runs-on: { type: string, default: ubuntu-24.04, description: "Runner label" }
      software-gpu: { type: boolean, default: false, description: "Repos with window tests: installs lavapipe (software Vulkan adapter) and the fonts the tests need; merged with apt-packages" }
      blueprint: { type: string, default: "off", description: "Blueprint check (ADR 0099, step S5): off = not run; warn = `fs-blueprint check --drift` runs when the repo has a scaffold.toml and shows its findings (the job stays green); block = a finding fails the job" }
      # blueprint-rev default = the commit that completes the blueprint step S5 (7ae4a5cf, it contains `check --drift` showing the drift next to other findings). The tag v0.0.12
      # (20924e553d38fb6d78aa19f1a156b69d874eb4c5) does NOT contain that fix: with it `--drift` is skipped as soon as a hand-written file or a missing talk record is found.
      # After the tag v0.0.13 the default is the peeled commit of that tag.
      blueprint-rev: { type: string, default: "7ae4a5cf64fcc562a95f5ff44574da87c045e8e6", description: "The commit of fs-release the command `fs-blueprint` is built from (a full SHA, never a branch)" }
      test-env: { type: string, default: "", description: "Environment for the test step, one KEY=VALUE per line (for tests that need a tool the runner lacks and say so)" }

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  check:
    runs-on: ${{ inputs.runs-on }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: System packages
        if: inputs.apt-packages != '' || inputs.software-gpu
        env:
          PACKAGES: ${{ inputs.apt-packages }}
          SOFTWARE_GPU: ${{ inputs.software-gpu }}
        run: |
          if [ "$SOFTWARE_GPU" = "true" ]; then
            PACKAGES="$PACKAGES mesa-vulkan-drivers libvulkan1 fonts-dejavu-core fonts-noto-core"
          fi
          # one list, every package once (apt-packages and software-gpu may name the same one)
          # shellcheck disable=SC2086
          PACKAGES=$(printf '%s\n' $PACKAGES | awk '!seen[$0]++' | tr '\n' ' ')
          sudo apt-get update
          # shellcheck disable=SC2086
          sudo apt-get install -y --no-install-recommends $PACKAGES
      - uses: FreeSynergy/fs-release/actions/setup-rust@eb353790cf603a0ef119996012e01049b5d7545d
        with:
          toolchain: pinned
          components: rustfmt,clippy
          working-directory: ${{ inputs.working-directory }}
          cache-key: check
      - name: Test environment
        if: inputs.test-env != ''
        env:
          TEST_ENV: ${{ inputs.test-env }}
        run: printf '%s\n' "$TEST_ENV" >> "$GITHUB_ENV"
      - name: Gates (fmt, clippy pedantic, test, FreeSynergy coding rules - ADR 0043)
        uses: FreeSynergy/fs-release/actions/gates@eb353790cf603a0ef119996012e01049b5d7545d
        with:
          working-directory: ${{ inputs.working-directory }}
      # Blueprint check (S5): only when asked (`blueprint` warn or block) and only when the repo has a scaffold.toml. The talk records of the exceptions are read from a
      # flat checkout of fs-documentation main (ADR 0099 addendum). `--drift` also finds a hand change in a generated file.
      - name: Documentation checkout for the talk records
        if: inputs.blueprint != 'off' && hashFiles(format('{0}/scaffold.toml', inputs.working-directory)) != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: FreeSynergy/fs-documentation
          path: .fs-documentation
          persist-credentials: false
      - name: Blueprint check (fs-blueprint check --drift)
        if: inputs.blueprint != 'off' && hashFiles(format('{0}/scaffold.toml', inputs.working-directory)) != ''
        env:
          MODE: ${{ inputs.blueprint }}
          REV: ${{ inputs.blueprint-rev }}
          DOCS: ${{ github.workspace }}/.fs-documentation
        run: |
          case "$MODE" in warn|block) ;; *) echo "::error::input blueprint must be off, warn or block, not $MODE"; exit 2 ;; esac
          # a full commit SHA, never a branch or a tag name: the install must be the same bytes tomorrow
          if ! [[ "$REV" =~ ^[0-9a-f]{40}$ ]]; then echo "::error::input blueprint-rev must be a full commit SHA (40 lowercase hex digits)"; exit 2; fi
          cargo install --git https://github.com/FreeSynergy/fs-release --rev "$REV" --locked --root "$RUNNER_TEMP/fsbp" fs-blueprint
          rc=0
          "$RUNNER_TEMP/fsbp/bin/fs-blueprint" check --repo "$PWD" --talks "$DOCS" --drift || rc=$?
          if [ "$rc" != 0 ]; then
            if [ "$MODE" = block ]; then exit "$rc"; fi
            echo "::warning::fs-blueprint check found errors (mode warn: the job stays green)"
          fi
