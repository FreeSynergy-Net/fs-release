# Reusable check gate for every FreeSynergy Rust repo, meant to run on every push. No secrets (only github.token, for ls-remote in the job identity). Usage: docs/usage.md
# Stricter than ci.yml (workspace-wide, clippy::pedantic); ci.yml additionally offers MSRV; the licence check (cargo-deny) is the gate `licence` in scripts/gates.sh.
# The checks and their flags live ONLY in scripts/gates.sh (actions/gates runs it); the toolchain version ONLY in RUST_VERSION.
name: check
on:
  workflow_call:
    inputs:
      working-directory: { type: string, default: ".", description: "Directory of the Cargo workspace (and root for the rules checker)" }
      apt-packages: { type: string, default: "", description: "System packages needed to build/test" }
      runs-on: { type: string, default: ubuntu-24.04, description: "Runner label" }
      software-gpu: { type: boolean, default: false, description: "Repos with window tests: installs lavapipe (software Vulkan adapter) and the fonts the tests need; merged with apt-packages" }
      blueprint: { type: string, default: "off", description: "Blueprint check (ADR 0099, step S5): off = not run; warn = `fs-blueprint check --drift` runs when the repo has a scaffold.toml and shows its findings (the job stays green); block = a finding fails the job" }
      # blueprint-rev: empty (the default) = the commit of THIS workflow file (the context `job.workflow_sha` of a reusable workflow is the commit of the called file, read below out of
      # `toJSON(job)`): a caller that pins `check.yml@v0.0.18` builds the command from the tag commit itself, so the command always fits the tag and no SHA has to stand in the file
      # (the tag commit cannot name itself). A full commit SHA given here wins. Never a branch or a tag name.
      blueprint-rev: { type: string, default: "", description: "Commit of fs-release the command `fs-blueprint` is built from: a full SHA, or empty = the commit of this workflow file (for a caller pinned to a tag: the tag commit)" }
      full: { type: boolean, default: false, description: "On branches unreviewed/* the test gate runs only the crates changed against main and their dependants; true forces the whole workspace (main and tags always test everything)" }
      profile: { type: string, default: "", description: "nextest profile of the TEST gate, a name from .config/nextest.toml of the caller. Empty = by ref: tag -> release, every other ref (unreviewed/*, main, workflow_dispatch) -> quick. A profile the caller does not define is said in the log and the default profile (everything) runs, so repos without profiles stay green" }
      test-env: { type: string, default: "", description: "Environment for the test step, one KEY=VALUE per line (for tests that need a tool the runner lacks and say so)" }

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  # N1d: the identity check is its OWN job, before everything of the caller: only the checkout and the check, no input of the caller except runs-on, no setup-rust, no rust-cache, no apt, no cargo,
  # so no code of the caller (build.rs, a rust-toolchain.toml, a package) has run when it looks. The job `check` needs it. Threat model: docs/usage.md "Threat model of the gates".
  # The step cannot call scripts/identity-check (a reusable workflow cannot call a script of fs-release): its run block is a COPY of the body of that script, and
  # scripts/test_check_job_identity.sh fails when the copy differs. The checkout takes the head commit of a pull request (the merge commit of GitHub has the committer GitHub <noreply@github.com>).
  identity:
    runs-on: ${{ inputs.runs-on }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Identity (author and committer of origin/main..HEAD, or of all commits when the remote has no main)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash {0}
        run: |
          set -uo pipefail
          root="${1:-.}"
          default_id=support@freesynergy.net
          # CI case: GITHUB_ACTIONS (protected in Actions) or CI (settable by a caller through test-env) set and not "false", any case
          ci=0; for v in "${CI:-}" "${GITHUB_ACTIONS:-}"; do case "${v,,}" in ""|false|0) ;; *) ci=1 ;; esac; done
          if [ "$ci" = 1 ]; then
            for v in GIT_DIR GIT_WORK_TREE GIT_OBJECT_DIRECTORY GIT_ALTERNATE_OBJECT_DIRECTORIES GIT_INDEX_FILE GIT_COMMON_DIR GIT_NAMESPACE; do
              if [ -n "${!v:-}" ]; then echo "identity FAILED: in CI $v must not be set (it would point git at another repo)" >&2; exit 1; fi
            done
            if { [ -n "${FS_IDENTITY_BASE:-}" ] && [ "$FS_IDENTITY_BASE" != origin/main ]; } || { [ -n "${FS_ALLOWED_IDENTITY:-}" ] && [ "$FS_ALLOWED_IDENTITY" != "$default_id" ]; }; then
              echo "identity FAILED: in CI (CI or GITHUB_ACTIONS set) FS_IDENTITY_BASE and FS_ALLOWED_IDENTITY from the environment must not loosen the gate (only origin/main and the fixed identity count)" >&2
              exit 1
            fi
            allowed="$default_id"
          else
            allowed="${FS_ALLOWED_IDENTITY:-$default_id}"
          fi
          cd "$root" || exit 2
          base="${2:-$(git config --local --get freesynergy.identity-test-base 2>/dev/null)}"
          if [ -z "$base" ]; then
            if [ "$ci" = 1 ]; then base=origin/main; else base="${FS_IDENTITY_BASE:-origin/main}"; fi
          fi
          # --no-replace-objects: a local `git replace` must not show another commit than the real one
          g() { git --no-replace-objects "$@"; }
          range_base="$base.."
          if ! g rev-parse --verify -q "$base^{commit}" >/dev/null; then
            # Decision 9f: ONLY the case "main does not exist on the remote" is a first check. Every other missing base (another ref, a fetch or network error, a main that exists but was not fetched) is red as before, never skipped.
            if [ "$base" != origin/main ]; then echo "identity FAILED: base $base not found (fetch it, never skip)" >&2; exit 2; fi
            # the token goes ONLY to https://github.com/, never to another host (mirror, Codeberg): no header there
            # the header goes through git env config (GIT_CONFIG_*), never through argv (not readable in /proc/<pid>/cmdline); URL-scoped key; subshell: nothing leaks into later git calls
            origin="$(git remote get-url origin 2>/dev/null)"
            (
              case "$origin" in https://github.com/*) if [ -n "${GH_TOKEN:-}" ]; then hdr="AUTHORIZATION: basic $(printf "x-access-token:%s" "$GH_TOKEN" | base64 -w0)"; export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="http.https://github.com/.extraheader" GIT_CONFIG_VALUE_0="$hdr"; fi ;; esac
              GIT_TERMINAL_PROMPT=0 timeout 120 git ls-remote --exit-code origin main >/dev/null 2>&1
            ); lrc=$?
            if [ "$lrc" -ne 2 ]; then echo "identity FAILED: base $base not found and the remote did not say that main does not exist (ls-remote rc $lrc; fetch it, never skip)" >&2; exit 2; fi
            [ "$(g rev-parse --is-shallow-repository)" = false ] || { echo "identity FAILED: no main and the clone is shallow, the root commit is not known (fetch-depth 0, never skip)" >&2; exit 2; }
            [ -n "$(g rev-list --max-parents=0 HEAD)" ] || { echo "identity FAILED: no main and no root commit of the branch found (never skip)" >&2; exit 2; }
            range_base=""
            echo "identity NOTICE: kein main: Erstpruefung (main does not exist on the remote; ALL commits of the branch from its root commit are checked)"
            [ "$ci" = 1 ] && echo "::notice::identity: kein main: Erstpruefung (all commits of the branch are checked)"
          fi
          # Fields are separated by TAB (%x09), never by blank: an address with a blank must not shift the fields. A TAB or line break inside an address changes the line or field count: red as well.
          # pull_request in CI: the checkout may be the merge commit of GitHub (committer GitHub); then (only if HEAD is GITHUB_SHA, the merge commit of GitHub) the tip is the PR head, its 2nd parent, the same range as the job identity
          tip=HEAD; if [ "$ci" = 1 ] && [ "${GITHUB_EVENT_NAME:-}" = pull_request ] && [ "$(g rev-parse HEAD)" = "${GITHUB_SHA:-}" ] && g rev-parse --verify -q 'HEAD^2^{commit}' >/dev/null; then tip='HEAD^2'; fi
          hits="$(g log --format='%h%x09%ae%x09%ce' "${range_base}$tip")" || exit 2
          n="$(g rev-list --count "${range_base}$tip")" || exit 2
          bad="$(awk -F'\t' -v ok="$allowed" 'NF != 3 || $2 != ok || $3 != ok { print $1 }' <<<"$hits")"
          [ "$(grep -c . <<<"$hits")" -eq "$n" ] || bad="$bad count-mismatch"
          if [ -n "$bad" ]; then
            echo "identity FAILED: commits with author or committer other than FS_ALLOWED_IDENTITY: $(tr '\n' ' ' <<<"$bad")" >&2
            echo "rewrite the branch as a NEW branch -rN with an equal tree (workflow branch-neu-schreiben), never main or a public tag" >&2
            exit 1
          fi
          echo "identity ok: $(grep -c . <<<"$hits") commit(s) in ${range_base:-(root of the branch)..}$tip, author and committer = FS_ALLOWED_IDENTITY"
  check:
    runs-on: ${{ inputs.runs-on }}
    needs: identity
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the identity gate (scripts/identity-check) reads origin/main..HEAD
      # N1d, way 2: the words of apt-packages go to `apt-get install` unquoted; ALLOWLIST (package names only, no option, no path, no = or /). The block is a copy of the body of
      # scripts/check-apt-packages; scripts/test_check_apt_packages.sh runs THIS block and fails when the copy differs
      - name: Package names (allowlist)
        if: inputs.apt-packages != ''
        env:
          PACKAGES: ${{ inputs.apt-packages }}
        run: |
          export LC_ALL=C
          set -f
          n=0; bad=""
          for word in $PACKAGES; do
            n=$((n + 1))
            if ! [[ "$word" =~ ^[a-z0-9][a-z0-9+.-]*$ ]]; then bad="$bad $n"; fi
          done
          if [ -n "$bad" ]; then
            echo "::error::apt-packages refused (word(s)$bad): every word must be a package name (lower case letters, digits, + . -, starting with a letter or digit); no options, no paths, no = or /"
            exit 1
          fi
      # CI-Tempo (2): the 9 min of this step in fs-components run 45346575653 were the DOWNLOAD (42 MB at 78 kB/s from the runner mirror); update 31 s, install a few seconds. The .deb files are cached with
      # actions/cache (own directory, `Dir::Cache::archives`), key = runner label + sorted package list + ISO week (a weekly refresh, so cached versions never age far from the mirror). apt still resolves
      # and verifies everything (hashes from the package lists), so a stale cache can only cost a download, never install a wrong file. The package names passed the allowlist step above.
      - name: System packages (list and cache key)
        id: apt-list
        if: inputs.apt-packages != '' || inputs.software-gpu
        env:
          PACKAGES: ${{ inputs.apt-packages }}
          SOFTWARE_GPU: ${{ inputs.software-gpu }}
          RUNS_ON: ${{ inputs.runs-on }}
        run: |
          if [ "$SOFTWARE_GPU" = "true" ]; then
            PACKAGES="$PACKAGES mesa-vulkan-drivers libvulkan1 fonts-dejavu-core fonts-noto-core"
          fi
          # one list, every package once, sorted (apt-packages and software-gpu may name the same one; the order must not change the key)
          # shellcheck disable=SC2086
          PACKAGES=$(printf '%s\n' $PACKAGES | LC_ALL=C sort -u | tr '\n' ' ')
          echo "packages=$PACKAGES" >> "$GITHUB_OUTPUT"
          echo "key=apt-debs-$(printf '%s|%s' "$RUNS_ON" "$PACKAGES" | sha256sum | cut -c1-32)-$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      - name: System packages (cache of the .deb files)
        id: apt-cache
        if: inputs.apt-packages != '' || inputs.software-gpu
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/apt-archives/*.deb
          key: ${{ steps.apt-list.outputs.key }}
      - name: System packages
        if: inputs.apt-packages != '' || inputs.software-gpu
        env:
          PACKAGES: ${{ steps.apt-list.outputs.packages }}
          CACHE_HIT: ${{ steps.apt-cache.outputs.cache-hit }}
          ARCHIVES: ${{ runner.temp }}/apt-archives
        run: |
          mkdir -p "$ARCHIVES"
          # Always update first: the package lists of the runner image are stale (probe run 45531413030: a cache hit WITHOUT update failed with 404 on a mesa file the mirror no longer has). The update is the small
          # part (index files, ~30 s); the cached .deb files of the same versions save the big part, the download.
          echo "System packages: cache of the .deb files hit: $CACHE_HIT"
          sudo apt-get update
          # shellcheck disable=SC2086
          sudo apt-get install -y --no-install-recommends -o "Dir::Cache::archives=$ARCHIVES" $PACKAGES
          # the cache step (a post step as the runner user) must be able to read what apt wrote
          sudo chmod -R a+rX "$ARCHIVES"
      - uses: FreeSynergy-Net/fs-release/actions/setup-rust@f44c348c9dec89e6f3a3026d98d3db66f99ab9df
        with:
          toolchain: pinned
          components: rustfmt,clippy
          working-directory: ${{ inputs.working-directory }}
          cache-key: check
      - name: Test environment
        if: inputs.test-env != ''
        env:
          TEST_ENV: ${{ inputs.test-env }}
        # N1a/N1b: ALLOWLIST. Every line of test-env must be TEST_<NAME>=<value> (bytes, LC_ALL=C); one other line is red and nothing is written. The block below is a copy of the body of
        # scripts/check-test-env (a reusable workflow cannot call a script of fs-release); scripts/test_check_test_env.sh runs THIS block and fails when the copy differs from the script
        run: |
          export LC_ALL=C
          n=0; bad=""
          while IFS= read -r line || [ -n "$line" ]; do
            n=$((n + 1))
            if [ -z "$line" ]; then continue; fi
            if ! [[ "$line" =~ ^[A-Za-z_][A-Za-z0-9_]*= ]] || ! [[ "$line" =~ ^TEST_[A-Za-z0-9_]+= ]]; then bad="$bad $n"; fi
          done <<< "$TEST_ENV"
          if [ -n "$bad" ]; then
            echo "::error::test-env refused (line(s)$bad): every line must be TEST_<NAME>=<value> (letters, digits, underscore; nothing else, no BOM, no blank before the name, no <<); nothing was written"
            exit 1
          fi
          printf '%s\n' "$TEST_ENV" >> "$GITHUB_ENV"
      # CI cost: on a branch `unreviewed/*` the TEST gate runs only the crates that changed against main and their dependants (scripts/affected_crates.py, via the gates input diff-base);
      # fmt, clippy, rules, lock and files stay on the whole workspace. main, tags and every other ref test everything; so does `full: true`. The base is the merge base with origin/main, not the
      # previous push, so a crate whose tests failed earlier is never skipped by a later green push. When main cannot be fetched the gates test everything.
      - name: Fetch main for the changed-crates diff (unreviewed/* branches only)
        if: ${{ !inputs.full && startsWith(github.ref, 'refs/heads/unreviewed/') }}
        run: git fetch --no-tags --unshallow origin '+refs/heads/main:refs/remotes/origin/main' || git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main' || echo "::warning::main could not be fetched, the gates test the whole workspace"
      - name: Gates (fmt, clippy pedantic, test, FreeSynergy coding rules - ADR 0043)
        id: gates-fmt-clippy
        continue-on-error: true
        uses: FreeSynergy-Net/fs-release/actions/gates@f44c348c9dec89e6f3a3026d98d3db66f99ab9df
        with:
          working-directory: ${{ inputs.working-directory }}
          diff-base: ${{ (!inputs.full && startsWith(github.ref, 'refs/heads/unreviewed/')) && 'origin/main' || '' }}
          profile: ${{ inputs.profile != '' && inputs.profile || (startsWith(github.ref, 'refs/tags/') && 'release' || 'quick') }}
          also-profile: ${{ github.ref == 'refs/heads/main' && 'security' || '' }}
          # landing head = push on main: picture and platform once more for what changed since the previous main (github.event.before; `full: true` or no push event = the whole workspace); `time` only on a tag / nightly
          land-profiles: ${{ github.ref == 'refs/heads/main' && 'picture platform' || '' }}
          land-base: ${{ (!inputs.full && github.event_name == 'push' && github.ref == 'refs/heads/main') && github.event.before || '' }}
      # Blueprint check (S5): only when asked (`blueprint` warn or block) and only when the repo has a scaffold.toml. The talk records of the exceptions are read from a
      # flat checkout of fs-documentation main (ADR 0099 addendum). `--drift` also finds a hand change in a generated file.
      - name: Documentation checkout for the talk records
        if: inputs.blueprint != 'off' && hashFiles(format('{0}/scaffold.toml', inputs.working-directory)) != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: FreeSynergy-Net/fs-documentation
          path: .fs-documentation
          persist-credentials: false
      - name: Blueprint check (fs-blueprint check --drift)
        id: blueprint-check-fs
        continue-on-error: true
        if: inputs.blueprint != 'off' && hashFiles(format('{0}/scaffold.toml', inputs.working-directory)) != ''
        env:
          MODE: ${{ inputs.blueprint }}
          INPUT_REV: ${{ inputs.blueprint-rev }}
          JOB: ${{ toJSON(job) }}
          DOCS: ${{ github.workspace }}/.fs-documentation
        run: |
          case "$MODE" in warn|block) ;; *) echo "::error::input blueprint must be off, warn or block, not $MODE"; exit 2 ;; esac
          # the revision: the input, or when it is empty the commit of this workflow file (only when that file comes from fs-release; a copy elsewhere must name the revision)
          # the two known owners of fs-release, exactly (never "any owner"): the old owner stays until part 2 of the address wave is done
          REV="$INPUT_REV"
          if [ -z "$REV" ]; then
            REV=$(printf '%s' "$JOB" | python3 -I -c 'import json, sys; j = json.load(sys.stdin); print(j.get("workflow_sha", "") if j.get("workflow_repository") in ("FreeSynergy/fs-release", "FreeSynergy-Net/fs-release") else "")') || REV=""
          fi
          # a full commit SHA, never a branch or a tag name: the install must be the same bytes tomorrow
          if ! [[ "$REV" =~ ^[0-9a-f]{40}$ ]]; then echo "::error::input blueprint-rev must be a full commit SHA (40 lowercase hex digits), or empty when this workflow runs from fs-release"; exit 2; fi
          cargo install --git https://github.com/FreeSynergy-Net/fs-release --rev "$REV" --locked --root "$RUNNER_TEMP/fsbp" fs-blueprint
          rc=0
          "$RUNNER_TEMP/fsbp/bin/fs-blueprint" check --repo "$PWD" --talks "$DOCS" --drift || rc=$?
          if [ "$rc" != 0 ]; then
            if [ "$MODE" = block ]; then exit "$rc"; fi
            echo "::warning::fs-blueprint check found errors (mode warn: the job stays green)"
          fi
      # Release plan probe: a repo with its own .github/workflows/release.yml (a call of the fs-release release workflow) runs the REAL plan action on the release inputs read from that file,
      # so a new binary crate that is neither in `binaries` nor in `ignore-binaries` (fs-forms v0.0.3: fs-forms-run) is red on the branch, not first at the tag. The tag the plan needs is
      # taken from the Cargo version of the package that owns the binaries. Self test: scripts/test_plan_probe_step.sh (also keeps the defaults below equal to those of release.yml).
      - name: Release plan inputs (read from the caller's release.yml)
        id: release-inputs
        continue-on-error: true
        if: hashFiles('.github/workflows/release.yml') != ''
        env:
          REPO_ROOT: ${{ github.workspace }}
        run: |
          python3 -I - <<'PY'
          import json, os, re, subprocess, sys
          import yaml
          DEFAULTS = {"name": "", "binaries": "", "ignore-binaries": "", "cargo-package": "", "working-directory": ".", "features": "", "kind": "cli", "app-id": "", "app-name": "",
                      "description": "", "linux-targets": "x86_64,aarch64", "windows-targets": "x86_64", "macos": "true", "linux-formats": "", "windows-formats": "", "macos-formats": ""}
          root, out = os.environ["REPO_ROOT"], os.environ["GITHUB_OUTPUT"]
          def put(k, v):
              with open(out, "a", encoding="utf-8") as f:
                  f.write(f"{k}={v}\n")
          doc = yaml.safe_load(open(os.path.join(root, ".github/workflows/release.yml"), encoding="utf-8"))
          # the two known owners of fs-release, exactly (never "any owner"): the old owner stays until part 2 of the address wave is done
          RELEASE_USES = ("FreeSynergy/fs-release/.github/workflows/release.yml@", "FreeSynergy-Net/fs-release/.github/workflows/release.yml@")
          calls = [j for j in (doc.get("jobs") or {}).values() if isinstance(j, dict) and str(j.get("uses", "")).startswith(RELEASE_USES)]
          if not calls:
              print("::notice::release.yml does not call the fs-release release workflow: no plan probe")
              put("probe", "false")
              sys.exit(0)
          if len(calls) > 1:
              print("::warning::release.yml calls the release workflow more than once: only the first call is probed")
          vals = dict(DEFAULTS)
          for k, v in (calls[0].get("with") or {}).items():
              if k not in DEFAULTS:
                  continue
              vals[k] = ("true" if v else "false") if isinstance(v, bool) else str(v)
          bad = [k for k, v in vals.items() if "$" + "{{" in v or "\n" in v or "\r" in v]
          if bad:
              print(f"::warning::release.yml input(s) {', '.join(bad)} are not plain values: no plan probe")
              put("probe", "false")
              sys.exit(0)
          workdir = os.path.join(root, vals["working-directory"])
          pkgs = json.loads(subprocess.run(["cargo", "metadata", "--format-version", "1", "--no-deps"], cwd=workdir, check=True, capture_output=True, text=True).stdout)["packages"]
          bins = set(re.split(r"[,\s]+", vals["binaries"]))
          mine = [p for p in pkgs if not vals["cargo-package"] or p["name"] == vals["cargo-package"]]
          owners = [p for p in mine if any("bin" in t["kind"] and t["name"] in bins for t in p["targets"])] or mine
          put("tag", "v" + owners[0]["version"] if owners else "v0.0.0")
          for k, v in vals.items():
              put(k, v)
          put("probe", "true")
          PY
      - name: Release plan probe (actions/plan on those inputs; a binary crate that is not packaged and not ignored is red now, not at the tag)
        id: release-plan-probe
        continue-on-error: true
        if: steps.release-inputs.outputs.probe == 'true'
        uses: FreeSynergy-Net/fs-release/actions/plan@f44c348c9dec89e6f3a3026d98d3db66f99ab9df
        with:
          tag: ${{ steps.release-inputs.outputs.tag }}
          name: ${{ steps.release-inputs.outputs.name }}
          binaries: ${{ steps.release-inputs.outputs.binaries }}
          ignore-binaries: ${{ steps.release-inputs.outputs.ignore-binaries }}
          cargo-package: ${{ steps.release-inputs.outputs.cargo-package }}
          working-directory: ${{ steps.release-inputs.outputs.working-directory }}
          features: ${{ steps.release-inputs.outputs.features }}
          kind: ${{ steps.release-inputs.outputs.kind }}
          app-id: ${{ steps.release-inputs.outputs.app-id }}
          app-name: ${{ steps.release-inputs.outputs.app-name }}
          description: ${{ steps.release-inputs.outputs.description }}
          linux-targets: ${{ steps.release-inputs.outputs.linux-targets }}
          windows-targets: ${{ steps.release-inputs.outputs.windows-targets }}
          macos: ${{ steps.release-inputs.outputs.macos }}
          linux-formats: ${{ steps.release-inputs.outputs.linux-formats }}
          windows-formats: ${{ steps.release-inputs.outputs.windows-formats }}
          macos-formats: ${{ steps.release-inputs.outputs.macos-formats }}
      - name: Collect the results (every step above ran; the job is red when one was)
        if: always()
        env:
          RESULTS: |
            gates-fmt-clippy ${{ steps.gates-fmt-clippy.outcome }}
            blueprint-check-fs ${{ steps.blueprint-check-fs.outcome }}
            release-inputs ${{ steps.release-inputs.outcome }}
            release-plan-probe ${{ steps.release-plan-probe.outcome }}
        run: |
          red=0
          list="$(mktemp)"
          {
            echo "### Results of this job (one line per step, none stops the others)"
            while read -r label outcome; do
              [ -n "$label" ] || continue
              echo "- $label: $outcome"
              case "$outcome" in failure|cancelled) red=1 ;; esac
            done <<< "$RESULTS"
          } > "$list"
          cat "$list"
          cat "$list" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          exit "$red"
