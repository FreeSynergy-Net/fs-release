# Reusable check gate for every FreeSynergy Rust repo, meant to run on every push. No secrets. Usage: docs/usage.md
# Stricter than ci.yml (workspace-wide, clippy::pedantic); ci.yml additionally offers MSRV and cargo-deny.
# The checks and their flags live ONLY in scripts/gates.sh (actions/gates runs it); the toolchain version ONLY in RUST_VERSION.
name: check
on:
  workflow_call:
    inputs:
      working-directory: { type: string, default: ".", description: "Directory of the Cargo workspace (and root for the rules checker)" }
      apt-packages: { type: string, default: "", description: "System packages needed to build/test" }
      runs-on: { type: string, default: ubuntu-24.04, description: "Runner label" }
      software-gpu: { type: boolean, default: false, description: "Repos with window tests: installs lavapipe (software Vulkan adapter) and the fonts the tests need; merged with apt-packages" }
      blueprint: { type: string, default: "off", description: "Blueprint check (ADR 0099, step S5): off = not run; warn = `fs-blueprint check --drift` runs when the repo has a scaffold.toml and shows its findings (the job stays green); block = a finding fails the job" }
      # blueprint-rev: empty (the default) = the commit of THIS workflow file (the context `job.workflow_sha` of a reusable workflow is the commit of the called file, read below out of
      # `toJSON(job)`): a caller that pins `check.yml@v0.0.17` builds the command from the tag commit itself, so the command always fits the tag and no SHA has to stand in the file
      # (the tag commit cannot name itself). A full commit SHA given here wins. Never a branch or a tag name.
      blueprint-rev: { type: string, default: "", description: "Commit of fs-release the command `fs-blueprint` is built from: a full SHA, or empty = the commit of this workflow file (for a caller pinned to a tag: the tag commit)" }
      full: { type: boolean, default: false, description: "On branches unreviewed/* the test gate runs only the crates changed against main and their dependants; true forces the whole workspace (main and tags always test everything)" }
      test-env: { type: string, default: "", description: "Environment for the test step, one KEY=VALUE per line (for tests that need a tool the runner lacks and say so)" }

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  check:
    runs-on: ${{ inputs.runs-on }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: System packages
        if: inputs.apt-packages != '' || inputs.software-gpu
        env:
          PACKAGES: ${{ inputs.apt-packages }}
          SOFTWARE_GPU: ${{ inputs.software-gpu }}
        run: |
          if [ "$SOFTWARE_GPU" = "true" ]; then
            PACKAGES="$PACKAGES mesa-vulkan-drivers libvulkan1 fonts-dejavu-core fonts-noto-core"
          fi
          # one list, every package once (apt-packages and software-gpu may name the same one)
          # shellcheck disable=SC2086
          PACKAGES=$(printf '%s\n' $PACKAGES | awk '!seen[$0]++' | tr '\n' ' ')
          sudo apt-get update
          # shellcheck disable=SC2086
          sudo apt-get install -y --no-install-recommends $PACKAGES
      - uses: FreeSynergy/fs-release/actions/setup-rust@e596ed65e56e5cdca1a9a453d0f12f7bc4b2edf7
        with:
          toolchain: pinned
          components: rustfmt,clippy
          working-directory: ${{ inputs.working-directory }}
          cache-key: check
      - name: Test environment
        if: inputs.test-env != ''
        env:
          TEST_ENV: ${{ inputs.test-env }}
        run: printf '%s\n' "$TEST_ENV" >> "$GITHUB_ENV"
      # CI cost: on a branch `unreviewed/*` the TEST gate runs only the crates that changed against main and their dependants (scripts/affected_crates.py, via the gates input diff-base);
      # fmt, clippy, rules, lock and files stay on the whole workspace. main, tags and every other ref test everything; so does `full: true`. The base is the merge base with origin/main, not the
      # previous push, so a crate whose tests failed earlier is never skipped by a later green push. When main cannot be fetched the gates test everything.
      - name: Fetch main for the changed-crates diff (unreviewed/* branches only)
        if: ${{ !inputs.full && startsWith(github.ref, 'refs/heads/unreviewed/') }}
        run: git fetch --no-tags --unshallow origin '+refs/heads/main:refs/remotes/origin/main' || git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main' || echo "::warning::main could not be fetched, the gates test the whole workspace"
      - name: Gates (fmt, clippy pedantic, test, FreeSynergy coding rules - ADR 0043)
        id: gates-fmt-clippy
        continue-on-error: true
        uses: FreeSynergy/fs-release/actions/gates@e596ed65e56e5cdca1a9a453d0f12f7bc4b2edf7
        with:
          working-directory: ${{ inputs.working-directory }}
          diff-base: ${{ (!inputs.full && startsWith(github.ref, 'refs/heads/unreviewed/')) && 'origin/main' || '' }}
      # Blueprint check (S5): only when asked (`blueprint` warn or block) and only when the repo has a scaffold.toml. The talk records of the exceptions are read from a
      # flat checkout of fs-documentation main (ADR 0099 addendum). `--drift` also finds a hand change in a generated file.
      - name: Documentation checkout for the talk records
        if: inputs.blueprint != 'off' && hashFiles(format('{0}/scaffold.toml', inputs.working-directory)) != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: FreeSynergy/fs-documentation
          path: .fs-documentation
          persist-credentials: false
      - name: Blueprint check (fs-blueprint check --drift)
        id: blueprint-check-fs
        continue-on-error: true
        if: inputs.blueprint != 'off' && hashFiles(format('{0}/scaffold.toml', inputs.working-directory)) != ''
        env:
          MODE: ${{ inputs.blueprint }}
          INPUT_REV: ${{ inputs.blueprint-rev }}
          JOB: ${{ toJSON(job) }}
          DOCS: ${{ github.workspace }}/.fs-documentation
        run: |
          case "$MODE" in warn|block) ;; *) echo "::error::input blueprint must be off, warn or block, not $MODE"; exit 2 ;; esac
          # the revision: the input, or when it is empty the commit of this workflow file (only when that file comes from fs-release; a copy elsewhere must name the revision)
          # the two known owners of fs-release, exactly (never "any owner"): the old owner stays until part 2 of the address wave is done
          REV="$INPUT_REV"
          if [ -z "$REV" ]; then
            REV=$(printf '%s' "$JOB" | python3 -I -c 'import json, sys; j = json.load(sys.stdin); print(j.get("workflow_sha", "") if j.get("workflow_repository") in ("FreeSynergy/fs-release", "FreeSynergy-Net/fs-release") else "")') || REV=""
          fi
          # a full commit SHA, never a branch or a tag name: the install must be the same bytes tomorrow
          if ! [[ "$REV" =~ ^[0-9a-f]{40}$ ]]; then echo "::error::input blueprint-rev must be a full commit SHA (40 lowercase hex digits), or empty when this workflow runs from fs-release"; exit 2; fi
          cargo install --git https://github.com/FreeSynergy/fs-release --rev "$REV" --locked --root "$RUNNER_TEMP/fsbp" fs-blueprint
          rc=0
          "$RUNNER_TEMP/fsbp/bin/fs-blueprint" check --repo "$PWD" --talks "$DOCS" --drift || rc=$?
          if [ "$rc" != 0 ]; then
            if [ "$MODE" = block ]; then exit "$rc"; fi
            echo "::warning::fs-blueprint check found errors (mode warn: the job stays green)"
          fi
      # Release plan probe: a repo with its own .github/workflows/release.yml (a call of the fs-release release workflow) runs the REAL plan action on the release inputs read from that file,
      # so a new binary crate that is neither in `binaries` nor in `ignore-binaries` (fs-forms v0.0.3: fs-forms-run) is red on the branch, not first at the tag. The tag the plan needs is
      # taken from the Cargo version of the package that owns the binaries. Self test: scripts/test_plan_probe_step.sh (also keeps the defaults below equal to those of release.yml).
      - name: Release plan inputs (read from the caller's release.yml)
        id: release-inputs
        continue-on-error: true
        if: hashFiles('.github/workflows/release.yml') != ''
        env:
          REPO_ROOT: ${{ github.workspace }}
        run: |
          python3 -I - <<'PY'
          import json, os, re, subprocess, sys
          import yaml
          DEFAULTS = {"name": "", "binaries": "", "ignore-binaries": "", "cargo-package": "", "working-directory": ".", "features": "", "kind": "cli", "app-id": "", "app-name": "",
                      "description": "", "linux-targets": "x86_64,aarch64", "windows-targets": "x86_64", "macos": "true", "linux-formats": "", "windows-formats": "", "macos-formats": ""}
          root, out = os.environ["REPO_ROOT"], os.environ["GITHUB_OUTPUT"]
          def put(k, v):
              with open(out, "a", encoding="utf-8") as f:
                  f.write(f"{k}={v}\n")
          doc = yaml.safe_load(open(os.path.join(root, ".github/workflows/release.yml"), encoding="utf-8"))
          # the two known owners of fs-release, exactly (never "any owner"): the old owner stays until part 2 of the address wave is done
          RELEASE_USES = ("FreeSynergy/fs-release/.github/workflows/release.yml@", "FreeSynergy-Net/fs-release/.github/workflows/release.yml@")
          calls = [j for j in (doc.get("jobs") or {}).values() if isinstance(j, dict) and str(j.get("uses", "")).startswith(RELEASE_USES)]
          if not calls:
              print("::notice::release.yml does not call the fs-release release workflow: no plan probe")
              put("probe", "false")
              sys.exit(0)
          if len(calls) > 1:
              print("::warning::release.yml calls the release workflow more than once: only the first call is probed")
          vals = dict(DEFAULTS)
          for k, v in (calls[0].get("with") or {}).items():
              if k not in DEFAULTS:
                  continue
              vals[k] = ("true" if v else "false") if isinstance(v, bool) else str(v)
          bad = [k for k, v in vals.items() if "$" + "{{" in v or "\n" in v or "\r" in v]
          if bad:
              print(f"::warning::release.yml input(s) {', '.join(bad)} are not plain values: no plan probe")
              put("probe", "false")
              sys.exit(0)
          workdir = os.path.join(root, vals["working-directory"])
          pkgs = json.loads(subprocess.run(["cargo", "metadata", "--format-version", "1", "--no-deps"], cwd=workdir, check=True, capture_output=True, text=True).stdout)["packages"]
          bins = set(re.split(r"[,\s]+", vals["binaries"]))
          mine = [p for p in pkgs if not vals["cargo-package"] or p["name"] == vals["cargo-package"]]
          owners = [p for p in mine if any("bin" in t["kind"] and t["name"] in bins for t in p["targets"])] or mine
          put("tag", "v" + owners[0]["version"] if owners else "v0.0.0")
          for k, v in vals.items():
              put(k, v)
          put("probe", "true")
          PY
      - name: Release plan probe (actions/plan on those inputs; a binary crate that is not packaged and not ignored is red now, not at the tag)
        id: release-plan-probe
        continue-on-error: true
        if: steps.release-inputs.outputs.probe == 'true'
        uses: FreeSynergy/fs-release/actions/plan@e596ed65e56e5cdca1a9a453d0f12f7bc4b2edf7
        with:
          tag: ${{ steps.release-inputs.outputs.tag }}
          name: ${{ steps.release-inputs.outputs.name }}
          binaries: ${{ steps.release-inputs.outputs.binaries }}
          ignore-binaries: ${{ steps.release-inputs.outputs.ignore-binaries }}
          cargo-package: ${{ steps.release-inputs.outputs.cargo-package }}
          working-directory: ${{ steps.release-inputs.outputs.working-directory }}
          features: ${{ steps.release-inputs.outputs.features }}
          kind: ${{ steps.release-inputs.outputs.kind }}
          app-id: ${{ steps.release-inputs.outputs.app-id }}
          app-name: ${{ steps.release-inputs.outputs.app-name }}
          description: ${{ steps.release-inputs.outputs.description }}
          linux-targets: ${{ steps.release-inputs.outputs.linux-targets }}
          windows-targets: ${{ steps.release-inputs.outputs.windows-targets }}
          macos: ${{ steps.release-inputs.outputs.macos }}
          linux-formats: ${{ steps.release-inputs.outputs.linux-formats }}
          windows-formats: ${{ steps.release-inputs.outputs.windows-formats }}
          macos-formats: ${{ steps.release-inputs.outputs.macos-formats }}
      - name: Collect the results (every step above ran; the job is red when one was)
        if: always()
        env:
          RESULTS: |
            gates-fmt-clippy ${{ steps.gates-fmt-clippy.outcome }}
            blueprint-check-fs ${{ steps.blueprint-check-fs.outcome }}
            release-inputs ${{ steps.release-inputs.outcome }}
            release-plan-probe ${{ steps.release-plan-probe.outcome }}
        run: |
          red=0
          list="$(mktemp)"
          {
            echo "### Results of this job (one line per step, none stops the others)"
            while read -r label outcome; do
              [ -n "$label" ] || continue
              echo "- $label: $outcome"
              case "$outcome" in failure|cancelled) red=1 ;; esac
            done <<< "$RESULTS"
          } > "$list"
          cat "$list"
          cat "$list" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          exit "$red"
