# An ADR of the strategy session: draft, the user decides, work it in, check, push. FS profile: see README.md.
document:
  dsl: 1.0.3
  namespace: freesynergy.net
  name: adr-write
  version: 0.0.11
  title: From an ADR draft through the user's decision into the docs
  metadata:
    freesynergy.net:states: [offen, wartet-auf-entscheidung, auf-anfrage, in-prüfung, pausiert, abgebrochen, erledigt, archiviert]
    freesynergy.net:transitions:
      offen: [stationen, wartet-auf-entscheidung, auf-anfrage, pausiert, abgebrochen]
      stationen: [stationen, wartet-auf-entscheidung, auf-anfrage, in-prüfung, pausiert, abgebrochen, erledigt]
      wartet-auf-entscheidung: [stationen, in-prüfung, pausiert, abgebrochen, erledigt]
      auf-anfrage: [stationen, in-prüfung, pausiert, abgebrochen, erledigt]
      in-prüfung: [stationen, wartet-auf-entscheidung, auf-anfrage, pausiert, abgebrochen, erledigt]
      pausiert: [offen, stationen, wartet-auf-entscheidung, auf-anfrage, in-prüfung, abgebrochen]
      abgebrochen: [offen, archiviert]
      erledigt: [offen, archiviert]
      archiviert: []
do:
  - draft:
      call: adr-draft:0.0.11@fs
      with:
        topic: ${ .input.topic }
      metadata:
        freesynergy.net:actor: ai
        freesynergy.net:actor-type: Application
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: Writes the draft (context, options, recommendation); what is not proven is marked [nicht belegt].
  - decision:
      run:
        workflow:
          namespace: freesynergy.net
          name: user-decision
          version: 0.0.11
      metadata:
        freesynergy.net:actor: human
        freesynergy.net:actor-type: Person
        freesynergy.net:gate: human
        freesynergy.net:kind: subjective
        freesynergy.net:summary: The user decides on the draft (user-decision.yaml); the decision is taken as it is.
  - work-in:
      call: adr-update:0.0.11@fs
      metadata:
        freesynergy.net:actor: ai
        freesynergy.net:actor-type: Application
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: Works the decision into the ADR; the status follows the decision, nothing is added on the side.
  - check-docs:
      call: check-docs:0.0.11@fs
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "check-docs on the ADR in a FRESH worktree of the branch head or origin/main (never the main checkout, rule [FRISCH] of doku-mitziehen); mkdocs strict WITHOUT the quiet flag, red on rc != 0 or a line starting with WARNING or ERROR; red goes back to work-in."
  - push:
      run:
        workflow:
          namespace: freesynergy.net
          name: publish-doc
          version: 0.0.11
      metadata:
        freesynergy.net:actor: human
        freesynergy.net:actor-type: Person
        freesynergy.net:gate: human
        freesynergy.net:kind: objective
        freesynergy.net:summary: The coordinator pushes - rebase, generator and fast-forward push (publish-doc.yaml); the agent never does.
