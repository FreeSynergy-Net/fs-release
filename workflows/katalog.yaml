# katalog: bring a program into the catalog, raise its tag, or take it out - by hand, as a run of the strategy (the entry is edited in packages.toml).
# Order: `Workflow katalog, parameters modus (neu | heben | entfernen), program, tag, branches, branch, head, delta, scope, tests` (docs/prompt-template.md).
# Relation to `catalog-bump`: that one is the EVENT path after a release (bump, sign, test, started by net.freesynergy.release.published and the
# 15-minute net); `katalog` is the run for entries that nobody raised by event (new, removed, hand-raised) and the proofs; it does NOT call
# `catalog-bump`. Specification (the @fs calls have no script yet). Agents never merge. FS profile: see README.md.
document:
  dsl: 1.0.3
  namespace: freesynergy.net
  name: katalog
  version: 0.0.10
  title: Catalog entry new, raised or removed - asset and release checks, fresh review, signed catalog.xml as proof
do:
  - ketten-plan:
      call: chain-plan:0.0.10@fs
      with:
        repo: FreeSynergy/Catalog
        branches: ${ .input.branches }
        base: main
      export:
        as: '${ $context + { kette: . } }'
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Several catalog branches go one after the other, never in parallel: the order is fixed, the base is the CURRENT remote main (`git ls-remote`). Result `kette` with `aktuell` and `rest`."
  - eintrag:
      call: catalog-entry:0.0.10@fs
      with:
        repo: FreeSynergy/Catalog
        modus: ${ .input.modus }
        program: ${ .input.program }
        tag: ${ .input.tag }
      metadata:
        freesynergy.net:actor: ai
        freesynergy.net:actor-type: Application
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "In an own worktree of fs-catalog, branch `unreviewed/catalog-<program>`: mode `neu` adds the entry in packages.toml, `heben` raises the tag of an existing entry, `entfernen` removes the entry (with its `replaces` or retired-name note if the order says so). Only packages.toml and the docs of the repo change; the CHANGELOG gets one entry."
  - asset-pruefen:
      call: asset-check:0.0.10@fs
      with:
        repo: ${ .input.program }
        tag: ${ .input.tag }
      if: ${ .input.modus != "entfernen" }
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Only for `neu` and `heben` (a removal has no asset): (1) the asset name of the entry answers HTTP 200 (`curl -sIL`, read only); (2) the release of the tag is published AND is a pre-release or a release, NEVER a draft (a draft has no public asset); (3) the tarball holds the binary of the program (`tar -tzf`)."
  - gen-catalog:
      call: gen-catalog-check:0.0.10@fs
      export:
        as: '${ $context + { gen: . } }'
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "`python3 -I scripts/gen_catalog.py --check` (catalog.xml equals what packages.toml says), the `unittest` of the repo and `python3 -m py_compile scripts/*.py`; all three green."
  - gen-rot:
      switch:
        - rot:
            when: '${ $context.gen.red == true }'
            then: eintrag
        - gruen:
            then: continue
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Control flow - red goes back to `eintrag` (the third red round escalates in the caller); green goes on."
  - frische-pruefung:
      run:
        workflow:
          namespace: freesynergy.net
          name: review
          version: 0.0.10
        input:
          repo: FreeSynergy/Catalog
          branch: ${ .input.branch }
          head: ${ .input.head }
          delta: ${ .input.delta }
          scope: ${ .input.scope }
          tests: ${ .input.tests }
      metadata:
        freesynergy.net:actor: ai
        freesynergy.net:actor-type: Application
        freesynergy.net:gate: opus-ja
        freesynergy.net:kind: subjective
        freesynergy.net:summary: "Fresh review by Opus (a new instance, not the author) of exactly this head: sub-workflow `review`, the checks of the steps above attached; a JA is bound to this head, a new head needs a new JA."
  - ff-ueber-strategie:
      call: merge-ff:0.0.10@fs
      with:
        into: main
      metadata:
        freesynergy.net:actor: human
        freesynergy.net:actor-type: Person
        freesynergy.net:gate: human
        freesynergy.net:kind: objective
        freesynergy.net:summary: "The fast-forward into main of fs-catalog goes through the strategy (the person or the coordinator, never forced, no merge commit); agents never merge."
  - sign-abwarten:
      call: sign-run:0.0.10@fs
      with:
        workflow: sign.yml
        repo: FreeSynergy/Catalog
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "The sign run: the path filter of sign.yml starts it ONLY for a change of packages.toml or scripts/*.py; every other change waits for the cron, or the run is started by `workflow_dispatch`. Waits for the end of the run for exactly this main head; red goes to `bugfix` for that run."
  - catalog-beleg:
      call: catalog-proof:0.0.10@fs
      with:
        repo: FreeSynergy/Catalog
        program: ${ .input.program }
        tag: ${ .input.tag }
        modus: ${ .input.modus }
      export:
        as: '${ $context + { beleg: . } }'
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Proof from the signed catalog.xml (read only, like a user): for `neu` and `heben` the entry with its `fs-sha256` is there, for `entfernen` it is gone; the `.asc` was renewed (newer than before the change); the signature verifies against the project key (verify green)."
  - raw-cache:
      switch:
        - veraltet:
            when: '${ ($context.beleg.fehler // "") | contains("does not match the given sha256") }'
            then: sign-neu
        - gleich:
            then: continue
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Control flow - the message `does not match the given sha256` means the raw cache of GitHub still serves the old file: wait 5 minutes (`sign-neu`), never edit the catalog by hand."
  - kette-weiter:
      switch:
        - weiter:
            when: '${ $context.kette.rest > 0 }'
            then: kette-rebase
        - ende:
            then: fertig
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Control flow - the next catalog branch goes on only after the proof of the earlier one."
  - kette-rebase:
      call: chain-rebase:0.0.10@fs
      with:
        repo: FreeSynergy/Catalog
        branch: ${ .input.branches }
        base: main
      then: asset-pruefen
      export:
        as: '${ $context + { kette: . } }'
      metadata:
        freesynergy.net:actor: ai
        freesynergy.net:actor-type: Application
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "The next catalog branch is rebased onto the new main. The top of the CHANGELOG ALWAYS conflicts: keep BOTH `## Unreleased (...)` sections, the new one on top; packages.toml: both entries kept; identity checked after the rebase (flow `branch-neu-schreiben`, step `identitaet-nach`); a new head needs a new review."
  - sign-neu:
      call: sign-run:0.0.10@fs
      with:
        workflow: sign.yml
        repo: FreeSynergy/Catalog
        wait: 5m
        dispatch: true
      then: catalog-beleg
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "After 5 minutes the sign run is started by `workflow_dispatch` once more, then the proof is read again."
  - fertig:
      set:
        status: done
        beleg: ${ $context.beleg }
      then: end
      export:
        as: '${ $context + { ergebnis: . } }'
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "The catalog is signed and shows the entry (or no entry after a removal). Sets `status: done`."
output:
  as: '${ { status: ($context.ergebnis.status // "skipped"), beleg: ($context.ergebnis.beleg // null) } }'
