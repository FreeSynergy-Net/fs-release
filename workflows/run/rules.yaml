# The ONE rule set of the states of a run (a Lauf). It belongs to the run, not to a single workflow file (ADR 0097 E4: no states wired
# into every file; ADR 0103 E1-E3). The standard text is workflows/STATES.md; scripts/check_run_rules.py checks the structure of this file
# (derived from the data below), the tests compare the default with STATES.md. `wartet` is ONE state with a mandatory reason (`reasons`);
# one column per reason is a display setting, not part of this rule set.
version: 1
name: freesynergy
start: offen
states: [offen, läuft, wartet, pausiert, fehlgeschlagen, abgebrochen, erledigt, archiviert]
final: [erledigt, abgebrochen, archiviert]
reopen: [erledigt, abgebrochen]
archive-from: [erledigt, abgebrochen, fehlgeschlagen]
# The time box of an order (CLAUDE.md 4a, question 75) belongs to the RUN like the states, not to every flow file: at most `max-minutes` per
# order, visible progress (picture, binary, merge) or a clear blocker every `visible-every-minutes`; over the limit the run does `on-exceed`.
timebox: {max-minutes: 60, visible-every-minutes: 60, on-exceed: [stop, report, workflow-pflege]}
reasons:
  wartet: [auf-entscheidung, auf-anfrage, in-prüfung]
transitions:
  offen: [läuft, wartet, pausiert, abgebrochen]
  läuft: [läuft, wartet, pausiert, fehlgeschlagen, abgebrochen, erledigt]
  wartet: [läuft, wartet, pausiert, abgebrochen, erledigt]
  pausiert: [offen, läuft, wartet, abgebrochen]
  fehlgeschlagen: [läuft, pausiert, abgebrochen, archiviert]
  abgebrochen: [offen, archiviert]
  erledigt: [offen, archiviert]
  archiviert: []
