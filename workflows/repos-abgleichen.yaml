# Bring the local checkouts of all repos to origin/main, fast-forward only. FS profile: see README.md.
# Draft (Entwurf), not yet in main. Nothing is pushed, tagged or merged into a work branch.
document:
  dsl: 1.0.3
  namespace: freesynergy.net
  name: repos-abgleichen
  version: 0.0.8
  title: Sync all local repos with origin - https remote, fetch, fast-forward main only, report the rest
do:
  - remotes:
      call: repos-remote-https:0.0.8@fs
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: Script - origin on SSH (git@github.com:...) becomes https://github.com/...; other remotes are not touched.
  - fetch:
      call: repos-fetch:0.0.8@fs
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: Script - git fetch --all --tags --prune per repo; a fetch error means skipped and reported, nothing else changed.
  - check:
      call: repos-check:0.0.8@fs
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: Script - main checked out, clean (untracked .claude/ allowed), main is an ancestor of origin/main; anything else is skipped with its reason.
  - fast-forward:
      call: repos-ff-main:0.0.8@fs
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: Script - git merge --ff-only origin/main, only for repos that passed check; no reset, checkout, stash, pull or push.
  - report:
      call: repos-report:0.0.8@fs
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: Script - table repo | before -> after | commits or reason for skip, written to the report file of the run.
