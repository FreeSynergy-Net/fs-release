# Spezifikation: the local checkouts of all repos are brought to origin/main, fast-forward only. Everything runs in the one script
# scripts/repos-abgleichen (the five steps are its phases; the catalog calls are not yet registered). FS profile: see README.md.
# Nothing is pushed, tagged, reset or merged into a work branch. The rules, as the script states them:
# - `fetch` runs with `--no-prune` (also against fetch.prune=true in the config): no origin/*-ref is deleted. Refs that vanished on origin are found by `git remote prune --dry-run origin` (read only, "would prune") and listed as `ref-verschwunden`.
# - `remotes` (set-url SSH -> HTTPS) runs ONLY for repos that stand on main, before the fetch. Other repos keep their SSH origin
#   and are only reported. A later push of a repo that was switched runs over HTTPS credentials instead of SSH.
document:
  dsl: 1.0.3
  namespace: freesynergy.net
  name: repos-abgleichen
  version: 0.0.13
  title: Sync all local repos with origin - https remote, fetch, fast-forward main only, report the rest
do:
  - remotes:
      call: repos-remote-https:0.0.13@fs
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Script - only for repos on main: origin on SSH (git@github.com:...) becomes https://github.com/...; repos on another branch keep their remote and are only reported."
  - fetch:
      call: repos-fetch:0.0.13@fs
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: Script - git fetch --all --tags per repo (no --prune); origin/*-refs that vanished are listed as ref-verschwunden, not deleted; a fetch error means skipped and reported.
  - check:
      call: repos-check:0.0.13@fs
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: Script - main checked out, clean (untracked .claude/ allowed), main is an ancestor of origin/main; anything else is skipped with its reason.
  - fast-forward:
      call: repos-ff-main:0.0.13@fs
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: Script - git merge --ff-only origin/main, only for repos that passed check; no reset, checkout, stash, pull or push.
  - report:
      call: repos-report:0.0.13@fs
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: Script - table repo | before -> after | commits or reason for skip, written to the report file of the run.
