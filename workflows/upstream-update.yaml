# An upstream program has a new release: check it (severity, tag to commit, signature state), pin it in the mirror, check capabilities against the new book,
# review, tag and push, start the mirror build by hand, publish the draft as Pre-release, raise in the catalog. Security fixes (high, critical) go first.
# Agents never push, tag or merge. The mirror build only makes a DRAFT; publishing is a step of its own.
# HANDLAUF: the sub-workflows pin-lesen, check-upstream, compare-versions, pin-mirror, capabilities-check, docs-sync, repo-gates and resolve-head have NO script. Their `summary` is the described hand run (a checklist of read commands - gh api, git ls-remote, git rev-parse, openssl - and the existing gates of the repo: scripts/repo_tool.py check, secret scan); it is done by hand, every point with its output in the report, no new script (rule 7). Where a script is really needed the point says "Skript folgt (Rust)". A point not done is written as not done, never as green.
# Order: `Workflow upstream-update, step pin-lesen, parameters upstream, repo, from, book, branch, delta, docs, docs_base, old, new, allow` (the last five feed `doku`; `head` only on re-entry at step `head` or `review`).
# `head` is the commit hash of the mirror branch under review (never a branch name); it is created by `pin` and resolved by the step `head`; the input `head` exists only when the run re-enters at `head` or `review`. The YES of the review is bound to exactly this hash. An escalation of `doku` ends in `upstream-eskalation`; the docs main branch is pushed only after the approval (`doku-veroeffentlichen`). FS profile: see README.md.
document:
  dsl: 1.0.3
  namespace: freesynergy.net
  name: upstream-update
  version: 0.0.17
  title: Take over a new upstream release into the mirror and the catalog, security fixes first
do:
  - pin-lesen:
      call: pin-lesen:0.0.17@fs
      export:
        as: '${ $context + { pin: . } }'
      metadata:
        freesynergy.net:actor: ai
        freesynergy.net:actor-type: Service
        freesynergy.net:bot-seat: upstream-update.pin-lesen
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "FIRST step, HANDLAUF (no script; read only). Read the pin that is really on origin/main and never believe the local clone or NEUE-VERSIONEN.md - gh api repos/<our mirror repo>/contents/mirror.toml?ref=main --jq .content | base64 -d, then read upstream version, [source] tag and commit from it; also gh api repos/<our mirror repo>/commits/main --jq .sha for the head of main. Compare with the local clone (git -C <clone> rev-parse HEAD against that sha) and with the list; a difference is reported first (example - the pin 1.12.1 was already on main although the list said open). Output - pinned version, tag, commit, main head, local head, equal yes/no. If the pin on main already equals the new tag, the run goes on as a check of an existing pin (review after the fact), it does not pin again."
  - check-upstream:
      call: check-upstream:0.0.17@fs
      with:
        upstream: ${ .input.upstream }
        repo: ${ .input.repo }
      export:
        as: '${ $context + { upstream: . } }'
      metadata:
        freesynergy.net:actor: ai
        freesynergy.net:actor-type: Service
        freesynergy.net:bot-seat: upstream-update.check-upstream
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "HANDLAUF (no script, read commands only; sub-workflow check-upstream@fs has no script yet). Checklist, every point with its output in the report. (1) Release text and advisories: gh api repos/<repo>/releases/tags/<tag>, gh api repos/<repo>/security-advisories (403 or empty = say so, never guess); rate severity critical, high, medium, low, none, with the sentence of the text that proves it. (2) TAG TO COMMIT: gh api repos/<repo>/git/ref/tags/<tag>; if .object.type is tag, follow gh api repos/<repo>/git/tags/<sha> until a commit (annotated tag), else the ref sha IS the commit (lightweight tag); write down both shas and the type; only the commit counts. (3) SIGNATURE STATE: gh api repos/<repo>/commits/<commit> --jq .commit.verification and, for annotated tags, git/tags/<sha> --jq .verification; record verified, reason, signer; unsigned stays unsigned (never claimed signed), a change against mirror.toml tag_signed is reported. SIGNER IDENTITY: if verified, write verification.reason and the signer (key id or user) and compare with the key fingerprint named in mirror.toml and the key that mirror.yml verifies against (step Verify our signatures: verify-mirror.sh with release-signing-key.asc fetched from fs-release, fingerprint from mirror.toml [signing].key_fingerprint); NOTE mirror.yml has no cosign step - it signs with OpenPGP and checks with verify-mirror.sh, plus SLSA attestation; the signer proof is made against THAT check, which is never loosened, skipped or made optional, not for a rush and not for a security fix. Our own signature is only ever our key; an upstream signer is recorded, never trusted by name alone. (4) FIX COMMIT IS IN THE TAG RANGE: name the fix commit or PR of the advisory (from release text or advisory), then gh api repos/<repo>/compare/<fix-commit>...<commit> --jq .status; status ahead or identical = the fix is contained, behind or diverged = NOT contained, stop and report (a fix on a release branch that is not on upstream master is a finding of its own). (5) IS THE MIRROR ALREADY PUBLISHED: gh release list -R <our mirror repo>, gh run list -R <our mirror repo> --workflow mirror.yml --limit 10; a release or draft for this tag, or a green run for this commit, is reported before anything is pinned again. Output - tag, tag object, commit, date, severity, advisory ids, signature state, fix-contained yes/no, mirror state. Card - Skript folgt (Rust): one read-only tool for points 2 to 5 (tag to commit, signature, fix in range, mirror state); until then hand work. High or critical goes first."
  - compare:
      call: compare-versions:0.0.17@fs
      with:
        from: ${ .input.from }
        to: ${ $context.upstream.tag }
      metadata:
        freesynergy.net:actor: ai
        freesynergy.net:actor-type: Service
        freesynergy.net:bot-seat: upstream-update.compare
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "HANDLAUF (no script; compare-versions@fs). gh api repos/<repo>/compare/<from>...<to> --jq '.files[].filename' (read only), then look at exactly these files and say changed or unchanged for each - rust-toolchain.toml (MSRV), Cargo.lock (list added, removed, bumped crates by gh api contents at both tags), the build profile and Cargo.toml [profile.*], the container and packaging files. The answer goes into the report and decides whether mirror.yml needs a change; an unchecked file is written as not checked, never as unchanged. If the compare is too large (truncated file list) say so and read both trees by tag. A real change of toolchain or lock is an open decision for the review, not a silent pass."
  - pin:
      call: pin-mirror:0.0.17@fs
      with:
        tag: ${ $context.upstream.tag }
        commit: ${ $context.upstream.commit }
        released: ${ $context.upstream.released }
      metadata:
        freesynergy.net:actor: ai
        freesynergy.net:actor-type: Service
        freesynergy.net:bot-seat: upstream-update.pin
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "HANDLAUF (no script; pin-mirror@fs), done by hand in the branch worktree, local commits only, identity FreeSynergy. After step pin-lesen and check-upstream. Edit mirror.toml (upstream version, released, [source] tag, tag_signed, commit = the COMMIT of the check, never the tag object; artefact names carry the version), capabilities.toml (sources and version), every script, test and the README that carry the old version (grep -rn for the old version number and the old commit; every hit is changed or named as kept on purpose), and add the security note (severity, advisory, fixed in). Do not raise the version or crate of fs-release. Own read-only proof before commit - git ls-remote <upstream> refs/tags/<tag> refs/tags/<tag>^{} shows exactly the pinned commit (the same check mirror.yml makes). Only the pinned commit counts; never an unresolved tag."
  - capabilities-check:
      call: capabilities-check:0.0.17@fs
      with:
        book: ${ .input.book }
        tag: ${ $context.upstream.tag }
      export:
        as: '${ $context + { capabilities: . } }'
      metadata:
        freesynergy.net:actor: ai
        freesynergy.net:actor-type: Service
        freesynergy.net:bot-seat: upstream-update.capabilities-check
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "HANDLAUF (no script; capabilities-check@fs). For EVERY capability line of capabilities.toml - open the book (the user guide of the NEW version, gh api contents at the tag or the published book of that version), find the page and the sentence that proves the line, quote page and sentence in the report. A line the book does not show is marked not proven, never guessed. A changed support value (yes, no, unstable) is listed old value, new value, sentence, and decided in the review. Table in the report - line, old value, new value, proof or not proven. Card - Skript folgt (Rust): a tool that lists the capability lines and checks each quoted sentence against the book text; until then this is hand work."
  - docs:
      call: docs-sync:0.0.17@fs
      with:
        languages: [de, en]
      metadata:
        freesynergy.net:actor: ai
        freesynergy.net:actor-type: Service
        freesynergy.net:bot-seat: upstream-update.docs
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "HANDLAUF (no script; docs-sync@fs). docs/de and docs/en are generated by the repo own tool, not edited by hand where generated: run python3 -I scripts/repo_tool.py docs and python3 -I scripts/repo_tool.py export (existing commands of the repo, they write docs and export from mirror.toml and capabilities.toml; no new script), then adapt by hand what is not generated (date of the check, security note). Check by reading - both languages name the same version, the same date and the same capability values (diff the two tables line by line); placeholders are gone (repo_tool.py check reports them). Card - Skript folgt (Rust): a de/en parity check."
  - local-gates:
      call: repo-gates:0.0.17@fs
      export:
        as: '${ $context + { gates: . } }'
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "HANDLAUF (no script; repo-gates@fs) with the gates the repo already has, once per head, output kept whole (pipefail, exit code written down, never cut). (1) bash scripts/test_verify_mirror.sh (selftest of verify-mirror). (2) python3 -I scripts/repo_tool.py check. (3) the secret scan - the command of secrets-scan.yml, gitleaks git --redact --no-banner --verbose . (locally only if gitleaks is installed; otherwise the CI run at this head is the proof, read it yourself and say so). (4) git diff --check and the identity of the commits (FreeSynergy, support@freesynergy.net). (5) Rust rules only where the repo has Rust code. Red goes to back-to-pin. Existing scripts are called, nothing new is written (rule 7: no new Python)."
  - back-to-pin:
      switch:
        - rounds:
            when: '${ $context.gates.red and ($context.gates.runde // 0) >= 3 }'
            then: upstream-eskalation
        - red:
            when: '${ $context.gates.red }'
            then: pin
        - green:
            then: continue
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: Control flow - a red gate goes back to pin with the findings as the order; the red rounds are counted (`runde`), from the third one the flow ends in `upstream-eskalation`; green goes on to the review.
  - doku:
      run:
        workflow:
          namespace: freesynergy.net
          name: doku-mitziehen
          version: 0.0.17
        input:
          repo: ${ .input.repo }
          branch: ${ .input.branch }
          delta: ${ .input.delta }
          docs: ${ .input.docs }
          docs_base: ${ .input.docs_base }
          old: ${ .input.old }
          new: ${ .input.new }
          allow: ${ .input.allow }
      export:
        as: '${ $context + { doku: . } }'
      metadata:
        freesynergy.net:actor: ai
        freesynergy.net:actor-type: Service
        freesynergy.net:bot-seat: upstream-update.doku
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Mandatory step (rule doku-mitziehen) - sub-workflow doku-mitziehen.yaml after the local gates: mirror.md, capabilities.md and the pages that name the version are in step with the pin (de and en); without a matching docs change the gate is RED and the flow does not reach the review."
  - doku-weiter:
      switch:
        - eskaliert:
            when: '${ $context.doku.eskaliert == true or $context.doku.status != "green" }'
            then: upstream-eskalation
        - weiter:
            then: continue
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Control flow - the sub-workflow doku-mitziehen ended with `eskaliert` or without `status == green` (red three times, a check skipped): the person decides, this flow does NOT go on to its review. Only green goes on."
  - head:
      call: resolve-head:0.0.17@fs
      with:
        branch: ${ .input.branch }
      export:
        as: '${ $context + { kopf: . } }'
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "HANDLAUF (no script; resolve-head@fs). git rev-parse HEAD in the branch worktree gives the FULL 40-character hash of the tip (output object { head: <sha> }, kept as $context.kopf); then git ls-remote origin refs/heads/<branch> to prove the same hash is the one on the remote; read the CI at exactly this hash yourself - gh run list -R <repo> --commit <sha> --json workflowName,status,conclusion and gh run view for each run; a missing or red run at this hash is a finding, a run of an older hash does not count. In a run from step 1 there is no input head (the head is created by pin); on re-entry at head or review the input head is checked against the branch tip and a difference stops the run."
  - review:
      run:
        workflow:
          namespace: freesynergy.net
          name: review
          version: 0.0.17
        input:
          repo: ${ .input.repo }
          branch: ${ .input.branch }
          head: ${ $context.kopf.head }
          delta: ${ .input.delta }
          scope: delta
      export:
        as: '${ $context + { review: . } }'
      metadata:
        freesynergy.net:actor: ai
        freesynergy.net:actor-type: Service
        freesynergy.net:bot-seat: upstream-update.review
        freesynergy.net:gate: opus-ja
        freesynergy.net:kind: subjective
        freesynergy.net:summary: Sub-workflow review.yaml (review-request, review, verdict, bind) for exactly the head hash of step `head` - Strategy (Opus) reviews the delta and answers YES or NO bound to this hash, the approval file is written for it. A security fix with severity high or critical is reviewed the same day. Without the YES nothing is tagged, pushed or published.
  - review-again:
      switch:
        - rounds:
            when: '${ $context.review.verdict == "NEIN" and ($context.review.runde // 0) >= 3 }'
            then: upstream-eskalation
        - nein:
            when: '${ $context.review.verdict == "NEIN" }'
            then: pin
        - ja:
            then: continue
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: Control flow - a NO goes back to pin with the findings of BERICHT.md as the order; from the third NO (`runde`) the flow ends in `upstream-eskalation`; a YES goes on to the tag.
  - tag:
      call: tag:0.0.17@fs
      with:
        head: ${ $context.kopf.head }
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: opus-ja
        freesynergy.net:kind: objective
        freesynergy.net:summary: Annotated tag v<version> of the mirror on the approved head hash (the approval file of exactly this hash must exist, as in release-flow), locally.
  - push:
      call: push:0.0.17@fs
      with:
        head: ${ $context.kopf.head }
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: preapproved-list
        freesynergy.net:kind: objective
        freesynergy.net:summary: Branch release-<version> and tag, never forced; the repo must be on the pre-approved list (as in release-flow); agents never push, the coordinator does.
  - start-build:
      call: dispatch-workflow:0.0.17@fs
      with:
        workflow: mirror.yml
        inputs:
          draft_release: true
      metadata:
        freesynergy.net:actor: human
        freesynergy.net:actor-type: Person
        freesynergy.net:gate: preapproved-list
        freesynergy.net:kind: objective
        freesynergy.net:summary: The coordinator starts the mirror build by hand (workflow_dispatch of mirror.yml with draft_release=true); the build does not start by itself. It builds from source at the pinned commit (refuses if the tag no longer resolves to it), adds source tarball and SBOM, signs, and creates a DRAFT release only.
  - wait-build:
      try:
        - warten:
            listen:
              to:
                one:
                  with:
                    type: net.freesynergy.ci.green
                    subject: ${ $context.kopf.head }
            timeout:
              after:
                hours: 2
      catch:
        errors:
          with:
            type: https://serverlessworkflow.io/spec/1.0.0/errors/timeout
        do:
          - build-ohne-ergebnis:
              set:
                timeout: true
              export:
                as: '${ $context + { build: . } }'
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:timebox-exempt: "waiting for the CI of the mirror build without an agent; the coordinator reports the state every 60 min"
        freesynergy.net:summary: The flow waits for the CI result of exactly this run of mirror.yml (the event carries the head hash as subject; an event of another head is ignored). A red run sends no green event; the timeout of 2 hours is an error of the task and is caught here (`try`/`catch` on the timeout error, SW 1.0) - it sets `build.timeout`, and the next step `build-weiter` sends the flow to `upstream-eskalation`; nothing is published.
  - build-weiter:
      switch:
        - zeit:
            when: '${ $context.build.timeout == true }'
            then: upstream-eskalation
        - gruen:
            then: continue
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: Control flow - no green CI event of this head within 2 hours means `upstream-eskalation` (the person decides); a green event goes on to the Pre-release.
  - publish:
      call: publish-release:0.0.17@fs
      with:
        from: draft
        to: pre-release
      metadata:
        freesynergy.net:actor: human
        freesynergy.net:actor-type: Person
        freesynergy.net:gate: human
        freesynergy.net:kind: subjective
        freesynergy.net:summary: mirror.yml never publishes. The person or the coordinator turns the draft into a Pre-release, only with the YES of strategy or the user for exactly this head; this is a step of its own, not a pipeline behaviour.
  - doku-veroeffentlichen:
      run:
        workflow:
          namespace: freesynergy.net
          name: publish-doc
          version: 0.0.17
      metadata:
        freesynergy.net:actor: human
        freesynergy.net:actor-type: Person
        freesynergy.net:gate: human
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Sub-workflow publish-doc.yaml - rebase, generate and fast-forward push of the docs main branch by the coordinator or the human, only AFTER the review (opus-ja) and the approval of the code, together with its merge; never before, never forced; the agent never pushes."
  - catalog-entry:
      call: catalog-entry:0.0.17@fs
      with:
        program: ${ .input.upstream }
      metadata:
        freesynergy.net:actor: ai
        freesynergy.net:actor-type: Service
        freesynergy.net:bot-seat: upstream-update.catalog-entry
        freesynergy.net:gate: opus-ja
        freesynergy.net:kind: subjective
        freesynergy.net:summary: Is the program in the catalog already? If not, the entry is created first (decision of strategy). fs-kanidm has had no release and no catalog entry so far - the first run creates both.
  - catalog-bump:
      run:
        workflow:
          namespace: freesynergy.net
          name: catalog-bump
          version: 0.0.17
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: opus-ja
        freesynergy.net:kind: objective
        freesynergy.net:summary: Sub-workflow catalog-bump after the Pre-release is published, behind the approval, public reach only (as in release-flow).
  - catalog-check:
      call: check:0.0.17@fs
      then: end
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: Looks at the catalog like a user - fresh clone, signature, the new version is in it and the old one is no longer offered as current.
  - upstream-eskalation:
      set:
        todo: upstream-eskalation
      then: end
      metadata:
        freesynergy.net:actor: human
        freesynergy.net:actor-type: Person
        freesynergy.net:gate: human
        freesynergy.net:kind: subjective
        freesynergy.net:summary: The gates or the review were red three times, the mirror build was red, or it gave no result in time; the person decides what is wrong. This flow ends, nothing is tagged, pushed or published.
