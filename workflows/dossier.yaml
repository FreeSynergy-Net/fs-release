# The research dossier of a Frontend: files in R2 with sourced facts, check-docs, then the docs main branch.
# Input: vorbild (the model program the dossier is about), repo, branch, bestand (block inventory of the fs-components family), blinc (inventory of the Blinc widgets), dossier (folder of the dossier files, bausteine.md lies in it).
# Order: `Workflow dossier, step research, parameters vorbild, repo, branch` (docs/prompt-template.md); the file list,
# the source rule and the report form are in this file and rules.md [BERICHT], not in the order. FS profile: see README.md.
document:
# [FREMDBILDER-NIE-INS-REPO] (user 24.11., HARD RULE): pictures of other programs never go into a repo, the net, a release or a docs page - open source or not. Model pictures are local reading material: `.scratch/katalog-plan/bilder/<programm>/vorbild/` (sheets `.../bilder/layout/<programm>/`). The dossier files in the docs hold text in our own words only; the step `fremdbilder-pruefen` checks it before the publish (`eingabe-fehler` on the third red round). No step of this flow puts a picture into a repo (checked 24.11.: none did; the research step wrote text only, the rule is now written down).
  dsl: 1.0.3
  namespace: freesynergy.net
  name: dossier
  version: 0.0.18
  title: Research a Frontend into a dossier and publish it to the docs
do:
  - blinc-org-bestand:
      call: blinc-org-inventory:0.0.18@fs
      with:
        org: project-blinc
        out: ${ .input.blinc }
      export:
        as: '${ $context + { blinc_org: . } }'
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Script (no AI, read only, GET only) - the Blinc inventory (`blinc` input) is NEVER taken from the main checkout alone: `gh api orgs/project-blinc/repos --paginate` lists ALL org repos (e.g. blinc_node_editor, blinc_canvas_kit, blinc_portal_ui, blinc_input, blinc_game_kit, ...), each with last push date, licence (NO licence given, e.g. blinc_game_kit = do not use, listed as `nicht nutzbar`), archived flag (e.g. blinc_input = archived, listed as `archiviert`), tags (none = pin to a commit) and the layer it belongs to; every repo is read from a FRESH shallow clone under .scratch/blinc-org/<repo> (the local blinc checkout may be old or hold uncommitted work and is never pulled, reset or changed). The result `blinc` lists repos and widgets (node/flow graph, canvas, portal ui, Gantt-like) with file:line. A missing network or `gh` is `skipped` and named in the report, never an inventory without the org repos; an inventory that only names the main checkout is RED (the gap found 20.11.: the node editor was missed)."
  - research:
      call: research-ai:0.0.18@fs
      with:
        vorbild: ${ .input.vorbild }
        repo: ${ .input.repo }
        branch: ${ .input.branch }
        files: [states, dialogs, menus, context-menus, shortcuts, workflows, bausteine, acceptance, gaps]
      metadata:
        freesynergy.net:actor: ai
        freesynergy.net:actor-type: Service
        freesynergy.net:bot-seat: dossier.research
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: Writes one research file each for states, dialogs, menus and context menus, shortcuts, workflows, acceptance.md and gaps into R2; every fact has a source, what is not proven is marked [nicht belegt]; the dossier template has the REQUIRED sections `## Menübaum (vollständig)` (every main menu opened, entries, order, separators, submenus, check marks and radio groups, disabled entries, shortcuts), `## Kontextmenüs` (right click on an element and on empty space, per place), `## Werkzeugleiste` (buttons in order) and `## Tastenkürzel`; source official documentation screenshots or the real program in a container (concept only, no code, no graphics, ADR 0013; [FREMDBILDER-NIE-INS-REPO] pictures of the model program are taken ONLY into `.scratch/katalog-plan/bilder/<programm>/vorbild/`, never into a repo, the net or the docs, open source or not); what is not proven is written `nicht belegt`, never invented; a dossier without these sections makes `picture-acceptance` (step `menue-bilder`) red (`dossier-menue-fehlt`); the menus file carries a `## Menü-Inventar` list (nested bullets with optional shortcut and names, format in docs/menue-vergleich.md) and the dialogs file a table or `## Dialog-Inventar` list, because scripts/menue-vergleich reads them (docs/menue-vergleich.md); bausteine.md carries the `## Baustein-Zuordnung` table (every area of the model -> 'what is this?' -> block id, with the column `Quelle` in the order family block (familie), Blinc widget through an adapter (blinc), new block (neu, only with the reason why neither a family block nor a Blinc widget fits); format in docs/baustein-zuordnung.md; the order of a Frontend is block analysis, then look, then composition); the states file carries the table `Zustand | belegt | Quelle` (`ja` with a source, or `[offen]` marked `ohne Vorbild` as own version; scripts/dossier-gate checks it, decision 16.11.); ADR 0013 - nothing is copied. Read-only on the Frontend, no network beyond the sources named in the order, commits per [COMMIT], report per [BERICHT].
  - check-docs:
      call: check-docs:0.0.18@fs
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: check-docs on the dossier; red goes back to research until it is green.
  - baustein-zuordnung:
      call: baustein-zuordnung:0.0.18@fs
      with:
        dossier: ${ .input.dossier }/bausteine.md
        bestand: ${ .input.bestand }
        blinc: ${ .input.blinc }
      export:
        as: '${ $context + { bausteine: . } }'
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: scripts/baustein-zuordnung (no network, no AI) reads `## Baustein-Zuordnung` of bausteine.md and the block inventory of fs-components; red (rc 1) when an area has no block id, an id is not in the inventory of its `Quelle`, a Blinc widget is used although the family has the block, a new block exists already or has no reason naming both family and Blinc; rc 2 = bad input (modelled explicitly, the function maps rc 0 to green, rc 1 and rc 3 to `red` true, rc 2 to `fehler` true with `red` false - it is not proven how a real `@fs` run maps rc, so the flow does not rely on rc alone). The script counts the red rounds itself in the state file `.baustein-zuordnung-runde` in the dossier folder (+1 on red, reset on green) and prints `runde=N` (also `runde` in the `--json` report; rc 3 from N >= 3); the function puts N into the result as `runde`. It reports the share per source (familie, blinc, neu). ADR 0074 (blocks with fixed names), 0084 (one block with modules, e.g. formulas as a module).
  - baustein-zuordnung-again:
      switch:
        - fehler:
            when: '${ $context.bausteine.fehler }'
            then: eingabe-fehler
        - runden:
            when: '${ $context.bausteine.red and ($context.bausteine.runde // 0) >= 3 }'
            then: eingabe-fehler
        - red:
            when: '${ $context.bausteine.red }'
            then: research
        - green:
            then: continue
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: Control flow - bad input (`fehler`, rc 2) and a third red round (`runde` >= 3, counted by `scripts/baustein-zuordnung` in its state file, rc 3) go to the person (`eingabe-fehler`), they never jump back; a red assignment goes back to research (the agent fixes bausteine.md), green goes on to `fremdbilder-pruefen` and then to publish.
  - fremdbilder-pruefen:
      call: fremdbilder-pruefen:0.0.18@fs
      with:
        dossier: ${ .input.dossier }
        branch: ${ .input.branch }
      export:
        as: '${ $context + { fremdbilder: . } }'
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "[FREMDBILDER-NIE-INS-REPO] Before the publish (and before every commit/push). Input: `dossier`, `branch`. Command (data, no new script): EVERY commit of the range is checked, not only the net diff (a deleting commit would make the net diff clean while the picture still lies in the history on GitHub): `git log --diff-filter=A --name-only --format= $(git merge-base origin/main HEAD)..HEAD` (every file ever added in the range), plus `git diff --name-only --diff-filter=AM $(git merge-base origin/main HEAD)..HEAD` filtered by the picture extension list (case-insensitive, so `Screenshot.PNG` counts too: png, jpg, jpeg, gif, webp, svg, bmp, tif, tiff, avif, heic, heif, jxl, ico, pdf; pdf because manuals and screenshots of foreign programs often come as PDF). Picture files may stand ONLY under ONE own picture folder of the dossier repo: `bilder/unser/`; a picture of a foreign program (model folder `vorbild/`, comparison sheet, anything from `.scratch/`) is a FINDING. Output `fremdbilder` = { fremd: [paths], red, gepusht (bool), runde (int: the step counts itself in `${XDG_STATE_HOME:-$HOME/.local/state}/freesynergy/dossier/<dossier-name>.fremdbilder-runde` (OUTSIDE the docs checkout, never committed), +1 per call, file removed on green) }. Red = Taking the picture out means: REWRITE the local, not yet pushed commits so that the picture never was in any of them (for example `git rebase` with drop or edit; no force push, because nothing is pushed yet). NEVER a deleting commit (`git rm` plus a new commit): it keeps the picture in the history. If the branch is already pushed (output `gepusht` = true, read with `git branch -r --contains HEAD`), no repeat: `fremdbilder-weiche` goes to `eingabe-fehler` at once (case `gepusht-red`); `fremdbilder-weiche` runs the check again; the third red round (at most two repeats) goes to `eingabe-fehler`."
  - fremdbilder-weiche:
      switch:
        - gepusht-red:
            when: '${ $context.fremdbilder.red == true and $context.fremdbilder.gepusht == true }'
            then: eingabe-fehler
        - runden:
            when: '${ $context.fremdbilder.red == true and ($context.fremdbilder.runde // 0) >= 3 }'
            then: eingabe-fehler
        - red:
            when: '${ $context.fremdbilder.red == true }'
            then: fremdbilder-pruefen
        - green:
            when: '${ $context.fremdbilder.red == false }'
            then: publish
        - ohne-ergebnis:
            then: eingabe-fehler
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Control flow - reads `fremdbilder.red` and `fremdbilder.runde` (set by `fremdbilder-pruefen`): red runs the check again, the third red round (at most two repeats) goes to `eingabe-fehler`; green goes on to publish; a missing result goes to `eingabe-fehler`, never to publish."
  - publish:
      call: docs-main:0.0.18@fs
      then: end
      with:
        vorbild: ${ .input.vorbild }
      metadata:
        freesynergy.net:actor: human
        freesynergy.net:actor-type: Person
        freesynergy.net:gate: human
        freesynergy.net:kind: objective
        freesynergy.net:summary: The human or the coordinator brings the green dossier into the docs main branch; the agent never does. [FREMDBILDER-NIE-INS-REPO] Only the TEXT of the dossier and our own pictures go to the docs; no picture of a foreign program (model pictures stay local under `.scratch/`).
  - eingabe-fehler:
      set:
        todo: eingabe-fehler
      then: end
      metadata:
        freesynergy.net:actor: human
        freesynergy.net:actor-type: Person
        freesynergy.net:gate: human
        freesynergy.net:kind: subjective
        freesynergy.net:summary: The block check got bad input (the table or the inventory is missing or unreadable, rc 2) or was red three times, or the picture check was red for the third round or gave no result; sending the agent back to research cannot fix that, so the person looks at it. This flow ends.
