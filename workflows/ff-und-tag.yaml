# ff-und-tag: the push of a reviewed head to main and the annotated tag - what the push helper of the strategy does by hand today. The
# order: `Workflow ff-und-tag, parameters repo, branch, head, tag, allow, workdir` (docs/prompt-template.md). Specification (the @fs calls
# have no script yet, like the other specification steps). It is the procedure behind the steps `tag`, `push`, `ci` and `main-ff` of
# `release-flow` (those stay, they follow the code of `fs-release flow`); the checklist here is the hands-on side with the proofs.
# Order of the end: branch CI of ALL workflows (a hang of more than 30 minutes: cancel, ONE restart, then escalation), signing entries, the expected runs per repo (each one there and green for the head), fresh
# clone, checklist, approval for exactly this head, push without force, annotated tag, ls-remote proof, watch the release, tidy up.
# Agents never push or tag. FS profile: see README.md.
document:
  dsl: 1.0.3
  namespace: freesynergy.net
  name: ff-und-tag
  version: 0.0.12
  title: Fast-forward a reviewed head to main and tag it - checklist, proofs, release watch
do:
  - zweig-ci:
      call: branch-ci:0.0.12@fs
      with:
        repo: ${ .input.repo }
        branch: ${ .input.branch }
        head: ${ .input.head }
      export:
        as: '${ $context + { ci: . } }'
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Reads the branch CI of ALL workflows for exactly this head (also the Windows jobs, not only the one that is quick); `scripts/check_job_status.py`, read only. Result `ci` with `status` green | red | hung (no progress for more than 30 minutes) and `neustarts`. Green for an older head does not count (new head, new CI)."
  - ci-weiter:
      switch:
        - rot:
            when: '${ $context.ci.status == "red" }'
            then: eskalation
        - haengt-erstmals:
            when: '${ $context.ci.status == "hung" and ($context.ci.neustarts // 0) == 0 }'
            then: ci-neustart
        - haengt-wieder:
            when: '${ $context.ci.status == "hung" }'
            then: eskalation
        - gruen:
            when: '${ $context.ci.status == "green" }'
            then: secrets-pruefen
        - unbekannt:
            then: eskalation
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Control flow - red goes to the person (the cause comes from the log, `bugfix` or `agent-run` for exactly that run; lesson fs-packages typing-test: a hanging job is not a green one); a hang goes to ONE restart, a second hang escalates; ONLY `status == green` goes on, explicitly to `secrets-pruefen` (it never falls through to the restart step `ci-neustart`, which only `haengt-erstmals` reaches) - every other status (running, unknown, empty) escalates (standing rule ZWEIG-CI: red OR unknown = no ff)."
  - ci-neustart:
      call: ci-restart:0.0.12@fs
      with:
        repo: ${ .input.repo }
        branch: ${ .input.branch }
        head: ${ .input.head }
      then: ci-weiter
      export:
        as: '${ $context + { ci: . } }'
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "A run without progress for more than 30 minutes is cancelled and started ONCE again (counted in `neustarts`), then the CI is read again; never a second restart, never a rerun that hides a red job."
  - secrets-pruefen:
      call: secret-names:0.0.12@fs
      with:
        repo: ${ .input.repo }
        names: GPG_PRIVATE_KEY,GPG_PASSPHRASE
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Before the push: the repository holds the signing entries GPG_PRIVATE_KEY and GPG_PASSPHRASE (read only: the NAMES from the list of repository entries, never a value, nothing is printed or copied). A missing name stops the flow before any push - an unsigned release cannot be repaired afterwards."
  - erwartete-laeufe:
      call: expected-runs:0.0.12@fs
      with:
        repo: ${ .input.repo }
        head: ${ .input.head }
        tag: ${ .input.tag }
      export:
        as: '${ $context + { laeufe: . } }'
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "BEFORE the tag: lists per repo which runs are expected (`erwartet`, from the callers in `.github/workflows` of the repo; typical: `check` and `typing-test` or the repo-specific ones on the branch; `ci` and `msrv` on main after the ff; `release.yml` only at the tag) and checks with `gh run list --commit <head>` (called by the push helper of the strategy, NOT by an agent) that EVERY run expected on the branch exists and is green for exactly this head. Result `laeufe` with `status` green | red | unknown, `erwartet`, `gefunden`, `fehlend`: a missing run is RED (never green: no run = not checked), also a run for an older commit, a cancelled, skipped or still running run. The runs after the push (`ci`, `msrv` on main for the head; `release.yml` for the tag) are listed too and checked in `release-beobachten` by the same rule (lesson fs-people, fs-messages: a tag without the complete branch CI)."
  - laeufe-weiter:
      switch:
        - nicht-gruen:
            when: '${ $context.laeufe.status != "green" or ($context.laeufe.fehlend // []) != [] }'
            then: eskalation
        - gruen:
            when: '${ $context.laeufe.status == "green" }'
            then: continue
        - unbekannt:
            then: eskalation
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Control flow - ONLY `status == green` with an empty `fehlend` goes on to the clone and the tag; a missing, red or unknown run escalates (standing rule ZWEIG-CI: red OR unknown OR missing = no ff, no tag)."
  - klon:
      call: fresh-clone:0.0.12@fs
      with:
        repo: ${ .input.repo }
        branch: ${ .input.branch }
        dir: ${ .input.workdir }
      export:
        as: '${ $context + { klon: . } }'
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Fresh blobless clone in the own work folder (input workdir; no wildcard path, the folder is new and empty), so that no old state of an agent worktree flows into the check."
  - kopf-und-ff:
      call: head-ff-check:0.0.12@fs
      with:
        head: ${ .input.head }
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "The head of the clone equals the head of the order and of the approval; main of the remote (`git ls-remote`) is an ancestor of this head (`git merge-base --is-ancestor`), so the push is a pure fast-forward without a merge commit."
  - identitaet:
      call: identity-check:0.0.12@fs
      with:
        range: main..HEAD
        allowed_identity_key: FS_ALLOWED_IDENTITY
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Step `adresse-pruefen` of release-flow on the fresh clone: only the identity in FS_ALLOWED_IDENTITY is author and committer in the range (`git log --format='%ae %ce' main..HEAD | sort -u` shows exactly one line); every other address is a hit, the check names the commit and never an address; red goes to `branch-neu-schreiben`."
  - version:
      call: version-check:0.0.12@fs
      with:
        repo: ${ .input.repo }
        tag: ${ .input.tag }
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Version = crate version in Cargo.toml = Cargo.lock entry of the own crates = first heading of CHANGELOG.md (lesson fs-people v0.0.11: the lock check is mandatory, a lock with the old version is red); the tag is `v<version>`; `lock-pruefung` of release-flow runs on the clone too."
  - tag-frei:
      call: tag-free:0.0.12@fs
      with:
        repo: ${ .input.repo }
        tag: ${ .input.tag }
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "`git ls-remote --tags` shows no tag of this name (also no tag with another case), and the local clone has none; an existing tag is never moved."
  - diff-pfade:
      call: diff-paths:0.0.12@fs
      with:
        repo: ${ .input.repo }
        allow: ${ .input.allow }
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "`git diff --name-only main..HEAD` lists only the paths of the order (input allow); an unexpected path is red (the head is not the one that was reviewed)."
  - ja-fuer-kopf:
      call: approval-check:0.0.12@fs
      with:
        head: ${ .input.head }
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: opus-ja
        freesynergy.net:kind: objective
        freesynergy.net:summary: "The Opus approval names exactly this head. A JA is void for every other head: new head, new JA (rule of `review`); no JA, no push. No tag as long as a delta or re-look result for this head has an open condition: line 1 of the Opus result file must be `JA` for EXACTLY this head; a later NEIN or condition blocks the tag (lesson fs-messages v0.0.3: a condition that came after the tag left an outdated sentence in the release)."
  - push-ff:
      call: push-ff:0.0.12@fs
      with:
        repo: ${ .input.repo }
        branch: ${ .input.branch }
        into: main
      metadata:
        freesynergy.net:actor: human
        freesynergy.net:actor-type: Person
        freesynergy.net:gate: human
        freesynergy.net:kind: objective
        freesynergy.net:summary: "The person or the coordinator (the strategy's push helper) pushes the head to main as a pure fast-forward, WITHOUT force and without a merge commit; agents never push. A rejected push is never forced: it goes back to `kopf-und-ff`."
  - tag:
      call: tag-annotated:0.0.12@fs
      with:
        repo: ${ .input.repo }
        tag: ${ .input.tag }
        head: ${ .input.head }
      metadata:
        freesynergy.net:actor: human
        freesynergy.net:actor-type: Person
        freesynergy.net:gate: human
        freesynergy.net:kind: objective
        freesynergy.net:summary: "ANNOTATED tag v<version> on the pushed head (`git tag -a`), written with the project identity (author and committer = FS_ALLOWED_IDENTITY), message = the first CHANGELOG heading; then the tag is pushed alone, never forced."
  - ls-remote-beleg:
      call: ls-remote-proof:0.0.12@fs
      with:
        repo: ${ .input.repo }
        tag: ${ .input.tag }
        head: ${ .input.head }
      export:
        as: '${ $context + { beleg: . } }'
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Proof by `git ls-remote`: refs/heads/main equals the head, refs/tags/<tag> exists and its peeled commit (`^{}`) equals the head; both lines are the result `beleg` (`zeilen`) and appear in the `output` of the flow."
  - release-beobachten:
      call: release-watch:0.0.12@fs
      with:
        repo: ${ .input.repo }
        tag: ${ .input.tag }
      export:
        as: '${ $context + { release: . } }'
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "The release run of the tag is watched until its end (`scripts/check_job_status.py`): ALL jobs green; the release is published (not a draft; a draft is never counted as released); the signature says `signed` with the fingerprint of the project key; the attestation is there. Red goes to `bugfix` with the failing job, never a silent rerun. Also the runs after the push from `laeufe.erwartet` (`ci`, `msrv` on main for the head, `release.yml` for the tag) must EXIST and be green (`gh run list`, called by the push helper); a missing one is red."
  - release-weiter:
      switch:
        - rot:
            when: '${ $context.release.status != "green" }'
            then: eskalation
        - gruen:
            then: continue
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Control flow - a release that is not completely green (job red, draft, signature or attestation missing) escalates to the person; the catalog follows only after a green release (`katalog`)."
  - fertig:
      set:
        status: done
        head: ${ .input.head }
        tag: ${ .input.tag }
      then: aufraeumen
      export:
        as: '${ $context + { ergebnis: . } }'
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "The flow reached its end: head on main, annotated tag, ls-remote proof, release green and published. Sets `status: done`, then the tidy-up."
  - eskalation:
      set:
        status: escalated
        eskaliert: true
      then: aufraeumen
      export:
        as: '${ $context + { ergebnis: . } }'
      metadata:
        freesynergy.net:actor: human
        freesynergy.net:actor-type: Person
        freesynergy.net:gate: human
        freesynergy.net:kind: subjective
        freesynergy.net:summary: "The CI is red, hangs twice or has an unknown status, a check is red or the release is not green: the flow ends with `eskaliert: true` (after the tidy-up); the person decides. Nothing was forced."
  - aufraeumen:
      call: clean-workdir:0.0.12@fs
      with:
        dir: ${ .input.workdir }
        created: ${ $context.klon != null }
      then: end
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Reached from `fertig` AND from `eskalation`: removes the own work folder of the clone (exactly the named folder, never a pattern, never an empty or placeholder name) and the temp files of this run - ONLY a clone that `klon` made itself (`created`); an escalation before `klon` removes nothing; foreign folders and agent worktrees are never touched. The output keeps the proof lines."
output:
  as: '${ { status: ($context.ergebnis.status // "skipped"), eskaliert: ($context.ergebnis.eskaliert // false), head: ($context.ergebnis.head // null), tag: ($context.ergebnis.tag // null), beleg: ($context.beleg // null) } }'
