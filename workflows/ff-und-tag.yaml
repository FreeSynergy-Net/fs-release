# ff-und-tag: the push of a reviewed head to main and the annotated tag - what the push helper of the strategy does by hand today. The
# order: `Workflow ff-und-tag, parameters repo, branch, head, tag, allow, workdir` (required) and, optional, `pakete` (true = the repo builds rpm and deb, then `paketname-gleich` runs; not set = skipped, named in the output), `registry_crate` (true | false; not set = taken from the list), `registry_crates` (list of repo names, default fs-types, fs-conformance, fs-records), `erstkette_ok` (true = the user knows the FIRST release chain of this repo), `rot_freigabe` (`{ run_ids, grund, wort }`: the run ids of EXACTLY the red runs), `index_wait_wired`, `index_warten_minuten` (default 10), `main_ci_warten_minuten` (default 30) (docs/prompt-template.md). Specification (the @fs calls
# have no script yet, like the other specification steps). It is the procedure behind the steps `tag`, `push`, `ci` and `main-ff` of
# `release-flow` (those stay, they follow the code of `fs-release flow`); the checklist here is the hands-on side with the proofs.
# Order of the end (r1: erst-release stands directly before the tag, main-vor-push directly before the push): branch CI of ALL workflows (a hang of more than 30 minutes: cancel, ONE restart, then escalation), signing entries, the expected runs per repo (each one there and green for the head), fresh
# clone, checklist, approval for exactly this head, push without force, annotated tag, ls-remote proof, watch the release, tidy up.
# Agents never push or tag. FS profile: see README.md.
# KNOWN GAP (ENTSCHEID-ref, 23.11.): the case repo = fs-release does not fit this flow yet: fs-release has no release run for a tag (`release.yml` and `_release-*.yml` are `workflow_call` only; a tag push starts only `lint.yml`), so `erwartete-laeufe`/`release-beobachten` would be red or unknown and nothing is signed. A step for the case fs-release (no release run expected, check `lint.yml` and the tag proof only) is to be added later by `workflow-pflege`, before the tag v0.0.18.
# RULES ADDED BY workflow-pflege-1 (23.11.2026, cards of the strategy; each rule names its occasion):
# [LANDUNG-ALLE-GRUEN] A push to main only when ALL CI workflows of the exact head (check, windows, semver, lint, every workflow the repo runs on the branch) are green (step `alle-workflows-gruen`).
#   A deliberately red gate is allowed only with the explicit release of the strategy, named in the report with run id and reason (input `rot_freigabe`, with the run ids of exactly the red runs). Occasion: fs-types main 6f1ebcf0 landed with semver RED
#   (run 45253040919) after an Opus JA, without asking the strategy - a JA covers the code, not a red workflow.
# [NICHT-GELAUFEN-NIE-GRUEN] For ALL gates (gates.sh, semver, every check script): a gate that did not run, was skipped or cancelled, has no result or says `NotRun` is NEVER green; it is red or unknown and stops.
#   Occasion: K-2-r2 M2 (a semver check that returned `NotRun` was counted GREEN). Written once here, repeated in `testlauf`, `review` and `pin-kaskade`.
# [VERSION-GLEICH-TAG] BEFORE the tag, for EVERY repo (not only `kind: library`): version = tag (step `version`: Cargo.toml = Cargo.lock entry of the own crates = first CHANGELOG heading = tag `v<version>`),
#   and the package name of rpm AND deb is the same (step `paketname-gleich`). Occasions: fs-types v0.0.6 carried Cargo version 0.0.5; condition on fs-starter 0.0.8 (package-probe checks both packages).
# [INDEX-ZEILE] After the tag of a registry crate (fs-types, fs-conformance, fs-records) the index line in the repo fs-crates is checked (step `index-zeile`, by hand for now; later `fs-crate-index wait`, step `index-warten`).
# [ERSTE-KETTE] The FIRST release of a repo (first tag, public pre-release) is user knowledge (step `erst-release`): secrets are only read for "set or not" (names, never values), a dry run comes first.
#   Occasion: fs-capnpc v0.2.3 - first real release chain of that repo, GPG secrets not proven, decision to the user.
# [KOPF-NEU-LESEN] Every review promise names "exactly this head"; right before a push `main` of the remote is read again (`git ls-remote`), because every new main costs one CI round (steps `kopf-und-ff` first reading, `main-vor-push` directly before `push-ff`; `ja-fuer-kopf`).
# [BEDROHUNGSMODELL] (r1, K5) `rot_freigabe` and `erstkette_ok` open a gate and are TEXT in the order: whoever writes the order opens the gate (the strategy by the word of the user). Nothing more is claimed: no signature, no proof of the word; the check binds the release only to the run ids it names (`alle-weiter`, `main-ci-weiter`). Same known limit as `check-approval`.
document:
  dsl: 1.0.3
  namespace: freesynergy.net
  name: ff-und-tag
  version: 0.0.18
  title: Fast-forward a reviewed head to main and tag it - checklist, proofs, release watch
do:
  - eingaben-ableiten:
      set:
        registry: '${ if .input.registry_crate != null then (.input.registry_crate == true) else (((.input.registry_crates // ["fs-types", "fs-conformance", "fs-records"]) | index(.input.repo | split("/") | last)) != null) end }'
        pakete: '${ .input.pakete == true }'
        erstkette_ok: '${ .input.erstkette_ok == true }'
        hinweise: '${ [ (if .input.pakete == true then "paketname-gleich: runs" else "paketname-gleich: SKIPPED, input pakete is not true (a repo that builds rpm and deb sets pakete: true)" end), (if (if .input.registry_crate != null then (.input.registry_crate == true) else (((.input.registry_crates // ["fs-types", "fs-conformance", "fs-records"]) | index(.input.repo | split("/") | last)) != null) end) then "index-zeile: runs (registry crate)" else "index-zeile: not applicable, the repo is not a registry crate (input registry_crate or the list registry_crates)" end) ] }'
      export:
        as: '${ $context + { eingaben: . } }'
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Control data (workflow-pflege-1 r1, M3/M4; specification like the rest). Decides ONCE, visibly, which checks apply: `registry` = true when the order says `registry_crate: true`, or when it says nothing and the repo name is in the list `registry_crates` (default: fs-types, fs-conformance, fs-records); `registry_crate: false` in the order is respected. `pakete` = true only when the order says `pakete: true` (the repo builds rpm and deb); not set = the package name check is skipped. A skipped check is never silent: the lines in `hinweise` go into the `output` of the flow (`eingaben`). Callers pass `pakete` and `registry_crate` (pin-kaskade: from the Glied entry; lib-umzug: from the target repo)."
  - zweig-ci:
      call: branch-ci:0.0.18@fs
      with:
        repo: ${ .input.repo }
        branch: ${ .input.branch }
        head: ${ .input.head }
      export:
        as: '${ $context + { ci: . } }'
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Reads the branch CI of ALL workflows for exactly this head (also the Windows jobs, not only the one that is quick); `scripts/check_job_status.py`, read only. Result `ci` with `status` green | red | hung (no progress for more than 30 minutes) and `neustarts`. Green for an older head does not count (new head, new CI)."
  - ci-weiter:
      switch:
        - rot:
            when: '${ $context.ci.status == "red" }'
            then: eskalation
        - haengt-erstmals:
            when: '${ $context.ci.status == "hung" and ($context.ci.neustarts // 0) == 0 }'
            then: ci-neustart
        - haengt-wieder:
            when: '${ $context.ci.status == "hung" }'
            then: eskalation
        - gruen:
            when: '${ $context.ci.status == "green" }'
            then: secrets-pruefen
        - unbekannt:
            then: eskalation
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Control flow - red goes to the person (the cause comes from the log, `bugfix` or `agent-run` for exactly that run; lesson fs-packages typing-test: a hanging job is not a green one); a hang goes to ONE restart, a second hang escalates; ONLY `status == green` goes on, explicitly to `secrets-pruefen` (it never falls through to the restart step `ci-neustart`, which only `haengt-erstmals` reaches) - every other status (running, unknown, empty) escalates (standing rule ZWEIG-CI: red OR unknown = no ff)."
  - ci-neustart:
      call: ci-restart:0.0.18@fs
      with:
        repo: ${ .input.repo }
        branch: ${ .input.branch }
        head: ${ .input.head }
      then: ci-weiter
      export:
        as: '${ $context + { ci: . } }'
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "A run without progress for more than 30 minutes is cancelled and started ONCE again (counted in `neustarts`), then the CI is read again; never a second restart, never a rerun that hides a red job."
  - secrets-pruefen:
      call: secret-names:0.0.18@fs
      with:
        repo: ${ .input.repo }
        names: GPG_PRIVATE_KEY,GPG_PASSPHRASE
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Before the push: the repository holds the signing entries GPG_PRIVATE_KEY and GPG_PASSPHRASE (read only: the NAMES from the list of repository entries, never a value, nothing is printed or copied). A missing name stops the flow before any push - an unsigned release cannot be repaired afterwards."
  - erwartete-laeufe:
      call: expected-runs:0.0.18@fs
      with:
        repo: ${ .input.repo }
        head: ${ .input.head }
        tag: ${ .input.tag }
      export:
        as: '${ $context + { laeufe: . } }'
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "BEFORE the tag: lists per repo which runs are expected (`erwartet`, from the callers in `.github/workflows` of the repo; typical: `check` and `typing-test` or the repo-specific ones on the branch; `ci` and `msrv` on main after the ff; `release.yml` only at the tag) and checks with `gh run list --commit <head>` (called by the push helper of the strategy, NOT by an agent) that EVERY run expected on the branch exists and is green for exactly this head. Result `laeufe` with `status` green | red | unknown, `erwartet`, `gefunden`, `fehlend`: a missing run is RED (never green: no run = not checked; [NICHT-GELAUFEN-NIE-GRUEN]), also a run for an older commit, a cancelled, skipped or still running run. The runs after the push (`ci`, `msrv` on main for the head; `release.yml` for the tag) are listed too and checked in `release-beobachten` by the same rule (lesson fs-people, fs-messages: a tag without the complete branch CI)."
  - laeufe-weiter:
      switch:
        - nicht-gruen:
            when: '${ $context.laeufe.status != "green" or ($context.laeufe.fehlend // []) != [] }'
            then: eskalation
        - gruen:
            when: '${ $context.laeufe.status == "green" }'
            then: continue
        - unbekannt:
            then: eskalation
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Control flow - ONLY `status == green` with an empty `fehlend` goes on to the clone and the tag; a missing, red or unknown run escalates (standing rule ZWEIG-CI: red OR unknown OR missing = no ff, no tag)."
  - klon:
      call: fresh-clone:0.0.18@fs
      with:
        repo: ${ .input.repo }
        branch: ${ .input.branch }
        dir: ${ .input.workdir }
      export:
        as: '${ $context + { klon: . } }'
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Fresh blobless clone in the own work folder (with `user.name=FreeSynergy` and `user.email=support@freesynergy.net` set in the clone, FS_ALLOWED_IDENTITY, author and committer) (input workdir; no wildcard path, the folder is new and empty), so that no old state of an agent worktree flows into the check."
  - kopf-und-ff:
      call: head-ff-check:0.0.18@fs
      with:
        head: ${ .input.head }
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "The head of the clone equals the head of the order and of the approval; main of the remote (`git ls-remote`) is an ancestor of this head (`git merge-base --is-ancestor`), so the push is a pure fast-forward without a merge commit. [KOPF-NEU-LESEN] this is the FIRST reading; `main` is read AGAIN in the step `main-vor-push` directly before `push-ff` (a new main since the last read = new check of the ff and, as a rule, a new CI round for the head); the other agents of the same repo move main too, a stale reading is not a proof."
  - identitaet:
      call: identity-check:0.0.18@fs
      with:
        range: main..HEAD
        allowed_identity_key: FS_ALLOWED_IDENTITY
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Step `adresse-pruefen` of release-flow on the fresh clone: run by `scripts/identity-check` (gate `identity`); only the identity in FS_ALLOWED_IDENTITY is author and committer in the range (`git log --format='%ae%x09%ce' main..HEAD | sort -u` shows exactly one line); every other address is a hit, the check names the commit and never an address; red goes to `branch-neu-schreiben`."
  - version:
      call: version-check:0.0.18@fs
      with:
        repo: ${ .input.repo }
        tag: ${ .input.tag }
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Version = crate version in Cargo.toml = Cargo.lock entry of the own crates = first heading of CHANGELOG.md (lesson fs-people v0.0.11: the lock check is mandatory, a lock with the old version is red); the tag is `v<version>`; `lock-pruefung` of release-flow runs on the clone too. [VERSION-GLEICH-TAG] MANDATORY BEFORE the tag for EVERY repo, not only `kind: library` (a program repo, a tool repo, an action repo too); a version that differs from the tag is red, nothing is tagged (occasion: fs-types Cargo.toml 0.0.5 at the tag v0.0.6, found only afterwards: the pin showed 0.0.5 for tag v0.0.6; ADR 0064 supplement 23.11.2026, no. 5)."
  - paketname-gleich:
      call: package-name-check:0.0.18@fs
      if: ${ $context.eingaben.pakete == true }
      with:
        repo: ${ .input.repo }
        tag: ${ .input.tag }
        formate: rpm,deb
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "SPECIFICATION (no script yet, and NO proof yet: the `package-probe.yml` lives in the repo fs-starter, not in fs-release; that it builds both formats is read there, that it COMPARES the names is NOT proven). [VERSION-GLEICH-TAG] part 2, before the tag, ONLY for a repo that builds packages (input `pakete: true`; not set = the step is skipped and the skip is named in `eingaben.hinweise` of the output - a library without rpm and deb is never red for this): the package NAME and VERSION are the same for rpm AND deb (and equal the crate name and the tag version); one of the two missing or different is red, no tag. Occasion: condition on fs-starter 0.0.8 (the name of the deb differed from the rpm)."
  - tag-frei:
      call: tag-free:0.0.18@fs
      with:
        repo: ${ .input.repo }
        tag: ${ .input.tag }
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "`git ls-remote --tags` shows no tag of this name (also no tag with another case), and the local clone has none; an existing tag is never moved."
  - diff-pfade:
      call: diff-paths:0.0.18@fs
      with:
        repo: ${ .input.repo }
        allow: ${ .input.allow }
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "`git diff --name-only main..HEAD` lists only the paths of the order (input allow); an unexpected path is red (the head is not the one that was reviewed)."
  - nachblick:
      call: nachblick-read:0.0.18@fs
      with:
        head: ${ .input.head }
        range: main..HEAD
        allowed_identity_key: FS_ALLOWED_IDENTITY
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Re-look template of the tag chain (pattern `REVIEW-tk1.md` / `REVIEW-tk2.md`, read only, nothing pushed), one line per point, a verdict `JA` or `NEIN` bound to the exact head: (1) head = branch head = head of the order; (2) diff against main only the expected paths; (3) pins, lock, version = Cargo = lock = first CHANGELOG heading, tag free; (4) main is an ancestor of the head; (5) IDENTITY: `scripts/identity-check <clone>` is green (`git log --format='%ae%x09%ce' origin/main..HEAD | sort -u` is exactly the one line FS_ALLOWED_IDENTITY), the commit named, never an address; (6) TREE EQUAL to the reviewed head: `git diff --exit-code <reviewed head> <this head>` has rc 0 (after an identity rewrite the new branch -rN carries the same tree as the reviewed one); (7) branch CI at the exact head: every expected run green. A single red point is NEIN; red identity goes to `branch-neu-schreiben` (new branch -rN, no force), then the re-look runs again for the new head."
  - ja-fuer-kopf:
      call: approval-check:0.0.18@fs
      with:
        head: ${ .input.head }
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: opus-ja
        freesynergy.net:kind: objective
        freesynergy.net:summary: "The Opus approval names exactly this head. A JA is void for every other head: new head, new JA (rule of `review`); no JA, no push. No tag as long as a delta or re-look result for this head has an open condition: line 1 of the Opus result file must be `JA` for EXACTLY this head; the JA also needs the runner proof (`fs-release check-approval <verdict file> --sha <head> --run-id <run id of the review run>`, rc 0): a cost-log row of a review run (rev-..., Opus, exit 0) and a run record whose BERICHT.md write is byte-equal to the verdict file; a hand-written verdict file has no run behind it and aborts the flow (known limit: the log has no MODE column, the runner files belong to the same user as the agents - the real wall is a separate user for verdicts, G6 no. 8-10); a later NEIN or condition blocks the tag (lesson fs-messages v0.0.3: a condition that came after the tag left an outdated sentence in the release). [KOPF-NEU-LESEN] Every review promise names \"exactly this head\" (the full hash); a promise without the head, or for the head before a later commit, is no approval."
  - alle-workflows-gruen:
      call: all-workflows-green:0.0.18@fs
      with:
        repo: ${ .input.repo }
        head: ${ .input.head }
        rot_freigabe: ${ .input.rot_freigabe // null }
      export:
        as: '${ $context + { alle: . } }'
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "SPECIFICATION (no script yet; reads `gh run list --commit <head>` through the push helper, read only). [LANDUNG-ALLE-GRUEN] BEFORE the push to main: EVERY workflow the repo runs for the exact head (not only `check` and `windows`: also `semver`, `lint`, and any other) exists and is green; the list comes from `laeufe.erwartet` PLUS `gh run list` of the head, so a workflow that nobody expected is seen too. Result `alle` with `status` green | red | unknown, `rote` (run id, workflow, conclusion) and `freigabe`. [NICHT-GELAUFEN-NIE-GRUEN]: skipped, cancelled, queued, NotRun or missing is not green. A deliberately red gate counts only with `rot_freigabe` (text of the strategy: `run_ids` of exactly the red runs + reason + the word of the strategy; see `alle-weiter`); the run ids and reason go into the report. Occasion: fs-types main 6f1ebcf0, semver run 45253040919 RED accepted without asking the strategy."
  - alle-weiter:
      switch:
        - gruen:
            when: '${ $context.alle.status == "green" }'
            then: continue
        - rot-mit-freigabe:
            when: '${ ($context.alle.status == "red") and (($context.alle.rote // []) | length) > 0 and (($context.alle.rote // []) | all(.conclusion == "failure")) and (($context.alle.freigabe.grund // "") != "") and (((($context.alle.rote // []) | map(.run_id | tostring)) - (($context.alle.freigabe.run_ids // []) | map(tostring))) | length) == 0 }'
            then: continue
        - sonst:
            then: eskalation
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Control flow - ONLY all workflows green goes on to the push; a red one goes on ONLY with the release of the strategy that is bound to EXACTLY these runs: `rot_freigabe` = `{ run_ids: [...], grund, wort }`, every run id in `alle.rote` must be named in `run_ids` (run ids of the release SUPERSET OF `alle.rote`), the reason is not empty, and every red run has the conclusion `failure` (a second red run that the release does not name, a skipped, cancelled, queued or not-run workflow never passes; [LANDUNG-ALLE-GRUEN], [NICHT-GELAUFEN-NIE-GRUEN]); run ids and reason go into the report. THREAT MODEL (K5): `rot_freigabe` is text in the order; whoever writes the order opens this gate, no protection beyond that is claimed; every other result (unknown, missing, a not-run workflow, a release without run id or reason) escalates. No push to main with a red or unknown workflow."
  - main-vor-push:
      call: head-ff-check:0.0.18@fs
      with:
        head: ${ .input.head }
      export:
        as: '${ $context + { vor_push: . } }'
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "SPECIFICATION (workflow-pflege-1 r1, S5; same call as `kopf-und-ff`, no new call name). [KOPF-NEU-LESEN] DIRECTLY before `push-ff`: `main` of the remote is read again (`git ls-remote`); result `vor_push` with `ff` (true = main is still an ancestor of the head, the push stays a pure fast-forward). The reading in `kopf-und-ff` is many steps older (the CI of all workflows lies between); this one is the fresh one. A push that is rejected anyway is never forced (see `push-ff`)."
  - vor-push-weiter:
      switch:
        - ff:
            when: '${ $context.vor_push.ff == true }'
            then: continue
        - sonst:
            then: eskalation
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Control flow - main moved since the check (no longer an ancestor) or no result: `eskalation`, nothing is pushed; the new main needs a new check of the ff and, as a rule, a new CI round for the head (a new run of the flow), because the green CI was for the old base."
  - push-ff:
      call: push-ff:0.0.18@fs
      with:
        repo: ${ .input.repo }
        branch: ${ .input.branch }
        into: main
      metadata:
        freesynergy.net:actor: human
        freesynergy.net:actor-type: Person
        freesynergy.net:gate: human
        freesynergy.net:kind: objective
        freesynergy.net:summary: "The person or the coordinator (the strategy's push helper) pushes the head to main as a pure fast-forward, WITHOUT force and without a merge commit; agents never push. A rejected push is never forced: it goes back to `kopf-und-ff`. Only after `alle-workflows-gruen` ([LANDUNG-ALLE-GRUEN])."
  - main-ci-nach-landung:
      call: all-workflows-green:0.0.18@fs
      with:
        repo: ${ .input.repo }
        head: ${ .input.head }
        ref: main
        warten: true
        warten_minuten: ${ .input.main_ci_warten_minuten // 30 }
        rot_freigabe: ${ .input.rot_freigabe // null }
      export:
        as: '${ $context + { main_ci: . } }'
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "SPECIFICATION (no script yet). After the landing, BEFORE the tag: the runs that the push started on main (`ci`, `msrv`, `semver` ... all that `gh run list --commit <head>` shows) are read for the exact head and must be ALL green; running = wait (poll after 3-5 minutes, never a long pause) up to `main_ci_warten_minuten` (default 30); a run that is still running after that limit has status `hung` (no endless wait); not-run or missing = not green ([NICHT-GELAUFEN-NIE-GRUEN]). `rot_freigabe` is passed on (S2): a release bound to exactly the red runs (see `alle-weiter`) is valid for the main runs too; a red run that it does not name stays red. Result `main_ci` with `status` (green | red | hung | unknown), `rote`, `freigabe`. The tag is set ONLY after the landing with all workflows green (occasion: fs-types main 6f1ebcf0, semver red after the landing; the tag would have carried a red head)."
  - main-ci-weiter:
      switch:
        - gruen:
            when: '${ $context.main_ci.status == "green" }'
            then: continue
        - rot-mit-freigabe:
            when: '${ ($context.main_ci.status == "red") and (($context.main_ci.rote // []) | length) > 0 and (($context.main_ci.rote // []) | all(.conclusion == "failure")) and (($context.main_ci.freigabe.grund // "") != "") and (((($context.main_ci.rote // []) | map(.run_id | tostring)) - (($context.main_ci.freigabe.run_ids // []) | map(tostring))) | length) == 0 }'
            then: continue
        - haengt:
            when: '${ $context.main_ci.status == "hung" }'
            then: eskalation
        - sonst:
            then: eskalation
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Control flow - the tag only after the landing with ALL workflows green on main, or red ONLY for exactly the runs that the `rot_freigabe` names (same binding as `alle-weiter`, S2: otherwise a released red head would land and then always escalate at the tag); `hung` (still running after the limit, S3), red without a matching release, unknown or missing escalates (main stays as landed, nothing is forced, no tag)."
  - erst-release:
      call: first-release-check:0.0.18@fs
      with:
        repo: ${ .input.repo }
        tag: ${ .input.tag }
        nutzerwissen: ${ .input.erstkette_ok // false }
      export:
        as: '${ $context + { erst: . } }'
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "SPECIFICATION (no script yet). [ERSTE-KETTE] Finds out by `git ls-remote --tags` and the release list whether this repo has a release at all (public pre-release or not). Result `erst` with `erstes` (true | false) and `ok`. For the FIRST release of a repo the whole release chain (release.yml caller, signing, attestation, packages) has never run: that is USER KNOWLEDGE - the flow goes on only with `erstkette_ok: true` in the order (the user or the strategy by the user's word), after a DRY RUN (every job of the chain on a branch or with `workflow_dispatch` as far as it exists, nothing published) and with the secrets read only for `set or not` (`secrets-pruefen`: names, never values). Otherwise it goes to `eskalation`. Occasion: fs-capnpc v0.2.3 (first release chain of that repo, GPG secrets not proven; the landing was done, the TAG waited for the user's decision). r1 (S1): this step stands DIRECTLY BEFORE `tag`, after the landing and the green main CI: the landing is NOT held back by the missing knowledge, only the TAG (the first tag of a repo is a public release). THREAT MODEL (K5): `erstkette_ok` is text in the order; whoever writes the order opens this gate; no protection beyond that is claimed (same known limit as `check-approval`)."
  - erst-weiter:
      switch:
        - erstes-ohne-wissen:
            when: '${ ($context.erst.erstes == null) or (($context.erst.erstes == true) and ($context.erst.ok != true)) }'
            then: eskalation
        - sonst:
            then: continue
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Control flow - directly before `tag`: the first release of a repo without the knowledge of the user (and a dry run) escalates (main stays as landed, no tag); every other repo goes on (a missing result of `erst` is `erstes` unknown and is NOT ok: it escalates too)."
  - tag:
      call: tag-annotated:0.0.18@fs
      with:
        repo: ${ .input.repo }
        tag: ${ .input.tag }
        head: ${ .input.head }
      metadata:
        freesynergy.net:actor: human
        freesynergy.net:actor-type: Person
        freesynergy.net:gate: human
        freesynergy.net:kind: objective
        freesynergy.net:summary: "ANNOTATED tag v<version> on the pushed head (`git tag -a`), written with the project identity (author and committer = FS_ALLOWED_IDENTITY), message = the first CHANGELOG heading; then the tag is pushed alone, never forced."
  - ls-remote-beleg:
      call: ls-remote-proof:0.0.18@fs
      with:
        repo: ${ .input.repo }
        tag: ${ .input.tag }
        head: ${ .input.head }
      export:
        as: '${ $context + { beleg: . } }'
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Proof by `git ls-remote`: refs/heads/main equals the head, refs/tags/<tag> exists and its peeled commit (`^{}`) equals the head; both lines are the result `beleg` (`zeilen`) and appear in the `output` of the flow."
  - release-beobachten:
      call: release-watch:0.0.18@fs
      with:
        repo: ${ .input.repo }
        tag: ${ .input.tag }
      export:
        as: '${ $context + { release: . } }'
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "The release run of the tag is watched until its end (`scripts/check_job_status.py`): ALL jobs green; the release is published (not a draft; a draft is never counted as released); the signature says `signed` with the fingerprint of the project key; the attestation is there. Red goes to `bugfix` with the failing job, never a silent rerun. Also the runs after the push from `laeufe.erwartet` (`ci`, `msrv` on main for the head, `release.yml` for the tag) must EXIST and be green (`gh run list`, called by the push helper); a missing one is red. For a REGISTRY crate the index line in fs-crates follows in `index-zeile` (the release run alone does not show it)."
  - release-weiter:
      switch:
        - rot:
            when: '${ $context.release.status != "green" }'
            then: eskalation
        - gruen:
            then: continue
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Control flow - a release that is not completely green (job red, draft, signature or attestation missing) escalates to the person; the catalog follows only after a green release (`katalog`)."
  - index-zeile:
      call: crate-index-line-check:0.0.18@fs
      if: ${ $context.eingaben.registry == true }
      with:
        repo: ${ .input.repo }
        tag: ${ .input.tag }
        index_repo: FreeSynergy-Net/fs-crates
        warten_minuten: ${ .input.index_warten_minuten // 10 }
      export:
        as: '${ $context + { index: . } }'
      metadata:
        freesynergy.net:actor: human
        freesynergy.net:actor-type: Person
        freesynergy.net:gate: human
        freesynergy.net:kind: objective
        freesynergy.net:summary: "[INDEX-ZEILE] MANDATORY STEP for the tag of a registry crate (decided in `eingaben-ableiten`: input `registry_crate`, or the list `registry_crates`, default fs-types, fs-conformance, fs-records; a repo that is not one is named in `eingaben.hinweise`, never skipped silently): the index line of this version is checked in the repo fs-crates (the file of the crate in the index, `vers` = the tag version, `cksum` = the sum of the `.crate` of the tag, the repo of the tag). BY HAND for now (the push helper reads `gh api` / a clone of fs-crates; max. one read per 4-5 minutes because of the GitHub limit, up to `warten_minuten`). Result `index` with `status` green | missing | late, `zeile`. The index workflow in fs-crates is a PULL job (schedule + dispatch, no bot token): when the line is missing or late, the BLOCKER is named in the report - `Index workflow in fs-crates is disabled / late` - together with the ONE click of the user: Actions of fs-crates, `Enable workflow`, then `Run workflow`. Nobody works around it (no hand-written index line). Occasion: K-2 (PULL way chosen for the index), decision of the strategy 23.11.2026 06:50 (mandatory step in the run list)."
  - index-warten:
      call: fs-crate-index-wait:0.0.18@fs
      if: ${ $context.eingaben.registry == true and .input.index_wait_wired == true }
      with:
        repo: ${ .input.repo }
        tag: ${ .input.tag }
        minuten: ${ .input.index_warten_minuten // 10 }
      export:
        as: '${ $context + { index: . } }'
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "SPECIFICATION, NOT WIRED (named remainder of K-2: the command `fs-crate-index wait` exists in the crate-index tool, the CALL from the step `release-beobachten` / this flow is still missing; it is run only when the order says `index_wait_wired: true`, otherwise `index-zeile` by hand applies). Waits N minutes (default 10) for the index line of the tag and writes the same result `index` as `index-zeile`; on a missing or late line the same blocker `Index workflow in fs-crates is disabled / late` with the one user click (`Enable workflow` / `Run workflow`). When wired, `release-beobachten` calls it right after the release and `index-zeile` stays as the fallback."
  - index-weiter:
      switch:
        - nicht-registry:
            when: '${ $context.eingaben.registry != true }'
            then: continue
        - gruen:
            when: '${ $context.index.status == "green" }'
            then: continue
        - sonst:
            then: eskalation
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Control flow - a registry crate goes on only with the index line there (`index.status == green`); missing, late or no result escalates with the blocker text and the one user click; every other repo goes on (the reason is named in `eingaben.hinweise`)."
  - fertig:
      set:
        status: done
        head: ${ .input.head }
        tag: ${ .input.tag }
      then: aufraeumen
      export:
        as: '${ $context + { ergebnis: . } }'
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "The flow reached its end: head on main, annotated tag, ls-remote proof, release green and published. Sets `status: done`, then the tidy-up."
  - eskalation:
      set:
        status: escalated
        eskaliert: true
      then: aufraeumen
      export:
        as: '${ $context + { ergebnis: . } }'
      metadata:
        freesynergy.net:actor: human
        freesynergy.net:actor-type: Person
        freesynergy.net:gate: human
        freesynergy.net:kind: subjective
        freesynergy.net:summary: "The CI is red, hangs twice or has an unknown status, a check is red, a workflow on main is red or not run, the first release of a repo is not user knowledge, the index line of a registry crate is missing or late (blocker text + the one user click, see `index-zeile`) or the release is not green: the flow ends with `eskaliert: true` (after the tidy-up); the person decides. Nothing was forced."
  - aufraeumen:
      call: clean-workdir:0.0.18@fs
      with:
        dir: ${ .input.workdir }
        created: ${ $context.klon != null }
      then: end
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Reached from `fertig` AND from `eskalation`: removes the own work folder of the clone (exactly the named folder, never a pattern, never an empty or placeholder name) and the temp files of this run - ONLY a clone that `klon` made itself (`created`); an escalation before `klon` removes nothing; foreign folders and agent worktrees are never touched. The output keeps the proof lines."
output:
  as: '${ { status: ($context.ergebnis.status // "skipped"), eskaliert: ($context.ergebnis.eskaliert // false), head: ($context.ergebnis.head // null), tag: ($context.ergebnis.tag // null), beleg: ($context.beleg // null), eingaben: ($context.eingaben // null) } }'
