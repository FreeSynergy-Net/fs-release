# Pictures of a Frontend: model (Vorbild) against ours, two verdicts. FS profile: see README.md.
# [THEME-WAECHTER]: pictures count as evidence only with a green theme guard (`waechter.red == false`, see testlauf); without it the verdict is not asked for.
# [MENUES-ZUM-AUSSEHEN] Menus count as looks (user, b7): the pictures show not only the content area but, per main menu and per context menu, the model and ours side by side; the picture package names are `<programm>-menue-<hauptmenue>-vorbild|unser.png` and `<programm>-kontext-<ort>-vorbild|unser.png`. Order: picture package (model | ours) first, THEN build (frontend-round). The look is made through the style layers, not copied; \"rebuild\" means structure, naming, order, shortcuts and behaviour (ADR 0013).
# Input: installiert (true | false, default false: true ONLY for the picture of an INSTALLED program from the channel, then step `vorbedingungen` runs; pictures of a development build skip it), programm (name of the program, for the entry measure `--check-system --program`), model, ours, waechter, dossier (folder of the model dossier with the full menu tree: menus.md, context-menus.md, toolbar, shortcuts; see docs/usage.md \"Menus\").
# RULES ADDED BY workflow-pflege-2 (26.11.2026, occasion: the install picture INST-10 of `tasks` failed three times for reasons BEFORE the picture, report `.scratch/sonnet/c1-inst-10-BERICHT.md`): [EINTRITT-SYSTEM] a picture of an INSTALLED program (input `installiert: true`; a development build skips the check) counts only after the step `vorbedingungen` is green: (1) `freesynergy-filesystem` is PUBLISHED in the channel (signed; a local unsigned build does not count; attempt 1: nothing provided it); (2) every service the program needs is installed, the `Requires` of the program RPM prove it (planning needs `person`: without `person.sock` the planning service ends with `owner-unreachable`, picture without board; attempt 3); (3) the installed fs-starter knows `--check-system` and reads layout format 3/4 (fs-starter 0.0.8 had neither: `unknown option`, `layout-error-import-invalid key-unknown`; attempt 2); (4) the channel holds ALL program packages (Repository publish input `repos` lists them; otherwise the run names local files and the dnf warning `skipped OpenPGP checks`); (5) entry measure: `fs-starter --check-system --program <programm>` prints `red=0` (0.0.9: red=1 `module-down`, yellow=4). The step results are NOT guessed: each `belege` entry is read from rpm/dnf/`--check-system` output.
document:
  dsl: 1.0.3
  namespace: freesynergy.net
  name: picture-acceptance
  version: 0.0.18
  title: Show model and our pictures, take the strategy's and the user's verdict
do:
  - eintritt-weiche:
      switch:
        - installiert:
            when: '${ (.input.installiert // false) == true }'
            then: vorbedingungen
        - entwicklungsstand:
            then: menue-bilder
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Control flow - the entry measure ([EINTRITT-SYSTEM]) is asked only for the picture of an INSTALLED program (`installiert: true`); pictures of a development build (the default, all callers of this flow today) go straight to `menue-bilder`, nothing is installed there and `--check-system` would be red for the wrong reason."
  - vorbedingungen:
      call: install-preconditions:0.0.18@fs
      with:
        programm: ${ .input.programm // null }
      export:
        as: '${ $context + { vorbedingungen: . } }'
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Specification (@fs, no script yet; rule [EINTRITT-SYSTEM] in the header). Runs only when `installiert == true` (step `eintritt-weiche`). Proves in this order, each with its evidence line: `filesystem` (`freesynergy-filesystem` signed in the channel, `rpm -K` and `dnf repoquery`), `dienste` (every `Requires` of the program RPM resolves, every service socket the program needs has its module installed, e.g. `person` for planning), `starter` (`fs-starter --version` is a tag whose `--help` lists `--check-system` and that reads layout format 3 and 4), `kanal` (all program packages are in the channel, input `repos` of the Repository publish), `check-system` (`fs-starter --check-system --program <programm>` prints `red=0`). Result `vorbedingungen` = { red, belege: [{ punkt, beleg }] (ONE entry per checked point, green or red, with its evidence line), befunde: [{ punkt, grund }] (ONLY the failed or unchecked points) }; `red` is true when `befunde` is not empty; a point that was not checked is a finding, never green."
  - vorbedingungen-weiche:
      switch:
        - rot:
            when: '${ ($context.vorbedingungen.befunde // [] | length) > 0 or ($context.vorbedingungen.red // false) == true }'
            then: vorbedingung-fehlt
        - gruen:
            when: '${ $context.vorbedingungen.red == false and ($context.vorbedingungen.befunde // [] | length) == 0 and ($context.vorbedingungen.belege // [] | length) == 5 }'
            then: continue
        - ohne-ergebnis:
            then: vorbedingung-fehlt
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Control flow - a failed precondition stops BEFORE the menu pictures and the pictures (no picture without the entry measure); a missing result goes to `vorbedingung-fehlt`, never on."
  - menue-bilder:
      call: menu-images:0.0.18@fs
      with:
        dossier: ${ .input.dossier }
        model: ${ .input.model }
        ours: ${ .input.ours }
      export:
        as: '${ $context + { menue_bilder: . } }'
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Specification (@fs, like the other steps; no script yet). Input is the menu tree of the dossier (sections Menübaum (vollständig), Kontextmenüs, Werkzeugleiste, Tastenkürzel). Result `menue_bilder` is the list of pairs model | ours, ONE pair per main menu (opened, every entry, `<programm>-menue-<hauptmenue>-vorbild|unser.png`) and ONE pair per context menu (right click on an element and on empty space, `<programm>-kontext-<ort>-vorbild|unser.png`). Flags: `baum_fehlt` (the dossier has no menu tree), `paar_fehlt` (a pair is missing: a main menu or context menu of the dossier without model picture or without our picture), `red` (one of both). Class `ohne Vorbild` (dossier gate `[offen]`, programm-grundgeruest): a menu without a model is NOT a `paar_fehlt`; only our `unser.png` counts, never a foreign picture. A missing result is never green."
  - menue-weiche:
      switch:
        - baum-fehlt:
            when: '${ $context.menue_bilder.baum_fehlt }'
            then: dossier-menue-fehlt
        - paar-fehlt:
            when: '${ $context.menue_bilder.paar_fehlt or $context.menue_bilder.red }'
            then: menue-bild-fehlt
        - gruen:
            then: pictures
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Control flow - a missing menu tree in the dossier is red and goes to `dossier-menue-fehlt` (first complete the dossier); a missing picture pair is red and goes to `menue-bild-fehlt`; only a complete package goes on to `pictures`. Nothing is built before the package Vorbild|unser exists."
  - pictures:
      call: show-images:0.0.18@fs
      with:
        model: ${ .input.model }
        ours: ${ .input.ours }
        waechter: ${ .input.waechter }
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: subjective
        freesynergy.net:summary: Shows the model (Vorbild) and our picture side by side; whatever they look like, the state changes to shown.
  - strategy-verdict:
      call: verdict-ai:0.0.18@fs
      metadata:
        freesynergy.net:actor: ai
        freesynergy.net:actor-type: Service
        freesynergy.net:bot-seat: picture-acceptance.strategy-verdict
        freesynergy.net:gate: none
        freesynergy.net:kind: subjective
        freesynergy.net:summary: The strategy judges each pair - accepted or what differs; it is an opinion, not a measurement.
  - user-verdict:
      call: ask:0.0.18@fs
      metadata:
        freesynergy.net:actor: human
        freesynergy.net:actor-type: Person
        freesynergy.net:gate: human
        freesynergy.net:kind: subjective
        freesynergy.net:summary: The user's verdict is subjective and is taken as it is; nobody argues it down.
  - next:
      call: route-verdict:0.0.18@fs
      metadata:
        freesynergy.net:actor: ai
        freesynergy.net:actor-type: Service
        freesynergy.net:bot-seat: picture-acceptance.next
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: The result is `accepted` or not; the calling round decides where it goes on (in frontend-round `picture-again` sends a not accepted result back to gap-list with the user's words as the order).
      then: end
  - dossier-menue-fehlt:
      set:
        todo: dossier-menue-fehlt
      then: end
      metadata:
        freesynergy.net:actor: human
        freesynergy.net:actor-type: Person
        freesynergy.net:gate: human
        freesynergy.net:kind: subjective
        freesynergy.net:summary: "Escalation - the dossier has no complete menu tree; the order is \"first complete the dossier\" (flow `dossier`, step `research`: sections Menübaum (vollständig), Kontextmenüs, Werkzeugleiste, Tastenkürzel). Without it no picture of ours is taken and nothing is built. This flow ends."
  - menue-bild-fehlt:
      set:
        todo: menue-bild-fehlt
      then: end
      metadata:
        freesynergy.net:actor: human
        freesynergy.net:actor-type: Person
        freesynergy.net:gate: human
        freesynergy.net:kind: subjective
        freesynergy.net:summary: "A picture pair is missing (a main menu or a context menu without model or without our picture); the round that called this flow takes the missing pictures first (name scheme in the header). This flow ends."
  - vorbedingung-fehlt:
      set:
        todo: vorbedingung-fehlt
      then: end
      metadata:
        freesynergy.net:actor: human
        freesynergy.net:actor-type: Person
        freesynergy.net:gate: human
        freesynergy.net:kind: subjective
        freesynergy.net:summary: "An entry precondition is red (or not checked): no picture is taken. The report names every point of `vorbedingungen.befunde` (with the evidence from `belege`) with its evidence and the owner (publish run = user click, missing `Requires` = owner of the module, old fs-starter = C1); the picture is repeated after the fix, nobody shows a picture of a broken install. This flow ends."
