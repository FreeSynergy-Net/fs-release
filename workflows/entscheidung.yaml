# A decision of the strategy: look up what is already decided first, ask the user only on a departure or a gap, write the result down.
# Reason (strategy c5): the strategy chose Fluent although ADR 0057 says MF2. FS profile: see README.md.
document:
  dsl: 1.0.3
  namespace: freesynergy.net
  name: entscheidung
  version: 0.0.18
  title: Check the existing ADRs, ask the user only where needed, record the result
do:
  - adr-search:
      call: adr-search:0.0.18@fs
      with:
        terms: ${ .input.terms }
      export:
        as: '${ $context + { adrs: . } }'
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: subjective
        freesynergy.net:summary: Script scripts/adr-search - `git grep -i` of the terms on fs-documentation origin/main in conventions/decisions and todo; the result is the list ADR/line (or `no hits`), whatever it finds.
  - evaluate:
      call: evaluate-adrs:0.0.18@fs
      with:
        topic: ${ .input.topic }
        adrs: ${ $context.adrs }
      export:
        as: '${ $context + { verdict: . } }'
      metadata:
        freesynergy.net:actor: ai
        freesynergy.net:actor-type: Service
        freesynergy.net:bot-seat: entscheidung.evaluate
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: The strategy reads the hits. A decision that exists applies and is followed; the result is `open` only for a departure from an ADR or for a missing decision, with the ADR numbers and the reason.
  - recherche:
      call: standard-research-ai:0.0.18@fs
      with:
        topic: ${ .input.topic }
        sources: ${ .input.sources }
        out: ${ .input.out }
      export:
        as: '${ $context + { recherche: . } }'
      metadata:
        freesynergy.net:actor: ai
        freesynergy.net:actor-type: Service
        freesynergy.net:bot-seat: entscheidung.recherche
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Optional, only when the topic needs EXTERNAL standards or reference programs (e.g. workflow levels, process views): Haiku reads and inventories (text only, no build slot, no code, ADR 0013: nothing copied, own words), one report per part under `out` (e.g. .scratch/recherche-workflow-ebenen/), each with sources; a gap list per item as `covered | partial | missing` against OUR state (DSL in fs-release/workflows, ADRs, repos); not proven = `[nicht belegt]`. The ADR draft (`adr-write`, step `draft`, Opus) comes only after this step and cites the reports. Time box 60 min per order. Fixed sources: workflow patterns = http://workflowpatterns.com/ (PLAIN HTTP only, the https certificate fails; index pages /patterns/control/, /patterns/data/, /patterns/resource/, /patterns/exception/, single patterns as wcp*/wdp*/wrp*/wep*.php with ids WCP/WDP/WRP); Serverless Workflow = GitHub serverlessworkflow/specification, file dsl-reference.md (the open-workflow-specification.org path gives 404). A page that cannot be read is reported to the strategy (the user offered to copy the content), never filled from memory."
  - cut:
      call: cut-decision:0.0.18@fs
      with:
        topic: ${ .input.topic }
        inventory: ${ $context.recherche }
        out: ${ .input.out }
      export:
        as: '${ $context + { cut: . } }'
      metadata:
        freesynergy.net:actor: ai
        freesynergy.net:actor-type: Service
        freesynergy.net:bot-seat: entscheidung.cut
        freesynergy.net:gate: strategie-ok
        freesynergy.net:kind: subjective
        freesynergy.net:summary: "Opus cuts and decides after the inventory (step `recherche`, or the ADR hits of `evaluate` when no research was needed): what is in, what is out, what waits, each cut with its reason and its source or ADR. The result is the file ENTSCHEID-schnitt.md under `out`. It is a proposal until the strategy has read it and accepted it (or sent it back with the reason); an accepted cut that departs from an ADR sets `open` in the result `cut` (`$context.cut.open`), and then the steps `ask` and `record` run exactly as for `verdict.open`."
  - entwurf:
      call: contract-draft-ai:0.0.18@fs
      with:
        topic: ${ .input.topic }
        inventory: ${ $context.recherche }
        cut: ${ $context.cut }
        out: ${ .input.out }
      export:
        as: '${ $context + { entwurf: . } }'
      metadata:
        freesynergy.net:actor: ai
        freesynergy.net:actor-type: Service
        freesynergy.net:bot-seat: entscheidung.entwurf
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Optional, only when the decision needs contracts or signatures (traits, types, interfaces) before work orders can be cut; it stands after `recherche` (and `cut`) and before `ask`. Opus drafts the contracts as PAPER only (no code, no build slot) and writes the result to .scratch/<week>/decisions/ENTWURF-<name>.md under `out` (example: ENTWURF-stufe-6.md), at most 200 lines. Rules: (1) signatures and the exact files and places are checked against the REAL code (fresh clone, file:line), not recalled; what was not read is `[nicht belegt]`. (2) Every new trait carries as the first doc line `/// Pattern: <Name> - <one sentence>` and, where it departs from the pattern, `/// Abweichung: ...`. (3) Split into Sonnet work orders of at most 60 min each (one module, one set of files, own finish criterion; order and dependencies named). (4) Finish criterion WITH pictures (what the person sees; picture tests where the work shows something). (5) At most 2 questions to the user, numbered, each with a default; the technology is decided in the draft, not asked. (6) Existing first (CLAUDE.md section 8): crate, module or standard is named before anything new. The draft is a proposal; the questions go on through `ask` only when `open` is set, the work orders start only after the strategy accepted the draft."
  - ask:
      run:
        workflow:
          namespace: freesynergy.net
          name: user-decision
          version: 0.0.18
        input:
          topic: ${ .input.topic }
          terms: ${ .input.terms }
      if: ${ $context.verdict.open or $context.cut.open }
      metadata:
        freesynergy.net:actor: human
        freesynergy.net:actor-type: Person
        freesynergy.net:gate: human
        freesynergy.net:kind: subjective
        freesynergy.net:summary: Only when `open` (`verdict.open` or `cut.open`, the cut departs from an ADR) - the user decides (user-decision.yaml, which searches the ADRs itself first); the answer is taken as it is. Without `open` the existing ADR applies and nobody is asked.
  - record:
      call: record-adr:0.0.18@fs
      if: ${ $context.verdict.open or $context.cut.open }
      with:
        topic: ${ .input.topic }
        verdict: ${ $context.verdict }
        cut: ${ $context.cut }
      metadata:
        freesynergy.net:actor: ai
        freesynergy.net:actor-type: Service
        freesynergy.net:bot-seat: entscheidung.record
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: The result is written down as a new ADR or as a supplement to the ADR it departs from (adr-write.yaml carries it into the docs, the person publishes); an existing decision that simply applied needs no entry.
