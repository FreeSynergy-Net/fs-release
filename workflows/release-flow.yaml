# The release flow (`fs-release flow`, crates/fs-release/src/flow): lift, gates, review, tag, push, release, bump, sign.
# A step marked with a gate halts until somebody else has acted; run again to go on. Nothing is published without the
# approval of exactly this head. After `lift` the API switch `api-umstellung` (fs-interfaces feature `rpc` -> fs-rpc, V1+ lift) runs; between `lift` and `gates` the documentation moves along (`doku`, rule doku-mitziehen; inputs docs, docs_base,
# old, new, allow besides repo and delta; an escalation of `doku` ends this flow before the review: `doku-weiter`); the docs main branch is pushed only after
# the review, the approval and the merge of the code (`doku-veroeffentlichen`, human, after `main-ff`). The flow closes with the tidy-up of the whole docs repo
# (`doku-aufraeumen`, rule doku-aufraeumen; its push waits for the strategy). FS profile: see README.md.
document:
  dsl: 1.0.3
  namespace: freesynergy.net
  name: release-flow
  version: 0.0.10
  title: Release a branch of a program as a pre-release and bring it into the catalog
do:
  - lift:
      run:
        workflow:
          namespace: freesynergy.net
          name: lift
          version: 0.0.10
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: Sub-workflow lift.yaml with --commit; red here stops the flow before any review.
  - api-umstellung:
      call: api-umstellung:0.0.10@fs
      input:
        repo: ${ .input.repo }
        delta: ${ .input.delta }
      export:
        as: '${ $context + { api_umstellung: . } }'
      metadata:
        freesynergy.net:actor: ai
        freesynergy.net:actor-type: Application
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Specification step, no script (decision b7): only at the V1+ lift (fs-interfaces v0.0.27 or newer). From fs-interfaces v0.0.27 there is no Cargo feature `rpc` any more; the rpc helpers live in the library fs-rpc (git https://github.com/FreeSynergy/fs-rpc, tag v0.0.2; it was the module `rpc` of fs-interfaces up to v0.0.25, `fs_interfaces::rpc::X` is now `fs_rpc::X`; `fs_types::describe::CatalogServer` (feature `rpc`) is now `fs_rpc::catalog::CatalogServer`; source: README and CHANGELOG of fs-rpc v0.0.2). A program that uses `fs-interfaces` with feature `rpc` (server/client crates) changes (1) the dependency in Cargo.toml: `fs-interfaces` without feature `rpc`, plus `fs-rpc = { git = \"https://github.com/FreeSynergy/fs-rpc\", tag = \"v0.0.2\" }` with the same fs-types / fs-interfaces / fs-objects tags as fs-rpc pins (otherwise the lock holds two copies of the generated types), (2) the `use` paths `fs_interfaces::rpc::...` to `fs_rpc::...`, `fs_types::describe::CatalogServer` to `fs_rpc::catalog::CatalogServer`, `fs_types::types_capnp` stays where fs-types has it; nothing is guessed, a name that is not in fs-rpc is looked up in its README/CHANGELOG. Then `cargo check --workspace --all-targets --locked` WITHOUT feature `rpc` (via build-slot.sh). Result `api_umstellung`: `status` (green | red | skipped when the repo does not use the feature) and `crates` (list of the changed crates). Red stops the run (person or Sonnet fixes it, no go-on with a half-done switch): `api-umstellung-weiter`. Order of the libraries: fs-types -> {fs-interfaces, fs-objects, fs-jscalendar, fs-components} -> fs-rpc -> programs (ADR 0092/0093)."
  - api-umstellung-weiter:
      switch:
        - rot:
            when: '${ $context.api_umstellung.status == "red" }'
            then: eskalation
        - weiter:
            then: continue
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Control flow - `api_umstellung` is red: the flow ends in `eskalation` before `doku` and the gates; a half-done switch never goes on. `green` and `skipped` (repo without feature `rpc`) go on."
  - doku:
      run:
        workflow:
          namespace: freesynergy.net
          name: doku-mitziehen
          version: 0.0.10
        input:
          repo: ${ .input.repo }
          delta: ${ .input.delta }
          docs: ${ .input.docs }
          docs_base: ${ .input.docs_base }
          old: ${ .input.old }
          new: ${ .input.new }
          allow: ${ .input.allow }
      export:
        as: '${ $context + { doku: . } }'
      metadata:
        freesynergy.net:actor: ai
        freesynergy.net:actor-type: Application
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Mandatory step (rule doku-mitziehen) - sub-workflow doku-mitziehen.yaml: every change of code, names, interfaces or behaviour of this release pulls the documentation in fs-documentation (de and en) along in the same run; without a matching docs change the gate is RED and the flow stops before any review. The same step covers the release of lift, frontend-round and frontend-umbau, which end here."
  - doku-weiter:
      switch:
        - eskaliert:
            when: '${ $context.doku.eskaliert == true or $context.doku.status != "green" }'
            then: eskalation
        - weiter:
            then: continue
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Control flow - the sub-workflow doku-mitziehen ended with `eskaliert` or without `status == green` (red three times, a check skipped): the person decides, this flow does NOT go on to its review (`eskalation` ends it with `eskaliert: true` for the caller). Only green goes on."
  - gates:
      call: gates:0.0.10@fs
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: scripts/gates.sh on a fresh clone, the one definition of the checks.
  - lock-pruefung:
      call: lock-check:0.0.10@fs
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Lock check (ADR 0092 rule 2, ADR 0093 rule 3), script `scripts/check_lock_sources.py` (also run by scripts/gates.sh through `scripts/gates-lock.sh`): in every Cargo.lock of the repo each of fs-types, fs-objects, fs-interfaces, fs-rpc, fs-jscalendar (list: scripts/lock-sources.toml) appears in exactly ONE source; two sources are an error that names both sources and the packages that pull them. Introduction: warning first, error later - switch `strict` (default false: a WARNING, the gate stays green; true in the repo's own `.fs-lock-sources.toml` once the repo is lifted to V1+, or env FS_LOCK_STRICT=1). V1+ addition, switch `only_from_enabled` (default OFF, env FS_LOCK_ONLY_FROM=1): fs-types only from the repo FreeSynergy/fs-types."
  - review-request:
      call: review-request:0.0.10@fs
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: Writes the file Opus reads, only for a green lift report of exactly this head.
  - review:
      listen:
        to:
          one:
            with:
              type: net.freesynergy.approval
      metadata:
        freesynergy.net:actor: ai
        freesynergy.net:actor-type: Application
        freesynergy.net:gate: opus-ja
        freesynergy.net:kind: subjective
        freesynergy.net:summary: Opus reviews the head and writes the approval file; a new head makes a JA invalid.
  - tag:
      call: tag:0.0.10@fs
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: opus-ja
        freesynergy.net:kind: objective
        freesynergy.net:summary: Annotated tag v<version> on the approved head, locally.
  - push:
      call: push:0.0.10@fs
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: preapproved-list
        freesynergy.net:kind: objective
        freesynergy.net:summary: Branch (reach shared) and tag (reach public), never forced; the repo must be on the pre-approved list.
  - ci:
      listen:
        to:
          one:
            with:
              type: net.freesynergy.ci.green
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: CI of the pushed branch release-<version> must be green for exactly this head; red stops the flow.
  - main-ff:
      call: merge-ff:0.0.10@fs
      with:
        into: main
      metadata:
        freesynergy.net:actor: human
        freesynergy.net:actor-type: Person
        freesynergy.net:gate: human
        freesynergy.net:kind: objective
        freesynergy.net:summary: The human or the coordinator fast-forwards main to the green, approved head (no merge commit, never forced); agents never do.
  - doku-veroeffentlichen:
      run:
        workflow:
          namespace: freesynergy.net
          name: publish-doc
          version: 0.0.10
      metadata:
        freesynergy.net:actor: human
        freesynergy.net:actor-type: Person
        freesynergy.net:gate: human
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Sub-workflow publish-doc.yaml - rebase, generate and fast-forward push of the docs main branch by the coordinator or the human, only AFTER the review (opus-ja) and the approval of the code, together with its merge; never before, never forced; the agent never pushes."
  - release:
      listen:
        to:
          one:
            with:
              type: net.freesynergy.release.published
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "release.yml builds the artefacts and publishes the Pre-release; the flow waits (halt release). MANDATORY after the merge into main of a program or of fs-release itself: the SHA of `FreeSynergy/fs-release/...@<sha>` in release.yml, ci.yml and check.yml is raised to the merge commit in a second reviewed commit (scripts/pin-refs.sh; a commit cannot contain its own SHA), otherwise the signing job still runs the refs of the older commit (docs/usage.md)."
  - announce:
      emit:
        event:
          with:
            source: https://github.com/${ .input.repo }
            type: net.freesynergy.release.published
            subject: ${ .input.tag }
            data:
              repo: ${ .input.repo }
              tag: ${ .input.tag }
              prerelease: ${ .input.prerelease }
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: The sender side of the event the step release waits for - the last job of release.yml sends it, only after publish was green and the Pre-release is really published (a draft sends nothing). It follows the approved push; no gate is skipped. No secret, no command in data.
  - bump:
      call: bump:0.0.10@fs
      with:
        workflow: bump.yml
        repo: FreeSynergy/Catalog
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: Runs by itself as the follow-up of the published release (event net.freesynergy.release.published, see catalog-bump.yaml); the approval (opus-ja, picture OK) lay before, at the tag and push. Pull without token - fs-catalog reads the public releases on its 15-minute schedule; nobody starts it by hand.
  - sign:
      listen:
        to:
          all:
            - with:
                type: net.freesynergy.catalog.signed
            - with:
                type: net.freesynergy.catalog.tested
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: Waits for the sign and test runs of the catalog (see catalog-bump.yaml); the flow only describes this wait, it does not poll yet.
  - doku-aufraeumen:
      run:
        workflow:
          namespace: freesynergy.net
          name: doku-aufraeumen
          version: 0.0.10
        input:
          repo: ${ .input.repo }
          docs: ${ .input.docs }
          docs_base: ${ .input.docs_base }
          datum: ${ now | strftime("%Y%m%d-%H%M") }
          allow: ${ .input.allow }
      export:
        as: '${ $context + { aufraeumen: . } }'
      metadata:
        freesynergy.net:actor: ai
        freesynergy.net:actor-type: Application
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Mandatory closing step (rule doku-aufraeumen): sub-workflow doku-aufraeumen.yaml checks the docs by machine (dead links, anchors, old names, temp, de/en, ADR status) and, since the mark, only the pages of THIS repo's changed topics (input repo; no AI for unchanged pages); a branch unreviewed/doku-aufraeumen-<YYYYMMDD-HHMM> only if something changed; the push is not part of this run (result `push_offen`, the person pushes after the strategy's approval). An escalated tidy-up ends this flow with `eskaliert: true` (step aufraeumen-weiter)."
  - aufraeumen-weiter:
      switch:
        - eskaliert:
            when: '${ $context.aufraeumen.eskaliert == true or $context.aufraeumen.status == "escalated" }'
            then: eskalation
        - weiter:
            then: continue
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Control flow - only a tidy-up that ended `escalated` (red three times, mkdocs missing, a result missing) stops this flow (eskalation, the person decides). `green`, `nichts_zu_tun` and `befunde_offen` are normal ends (the findings go into the result), `skipped` is only reported with its `hinweis` (docs/topics.toml and a first mark are missing). The push of the tidy-up branch (`push_offen`) is NOT a step of this flow: the tidy-up runs as its own run, the result names the branch, and the person pushes it after the strategy's approval; so the release never hangs on the strategy."
  - fertig:
      set:
        status: released
        aufraeumen: ${ $context.aufraeumen }
      export:
        as: '${ $context + { ergebnis: . } }'
      then: end
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "The flow reached its end (the sign and test events of the catalog are in); sets `status: released`."
  - eskalation:
      set:
        status: escalated
        eskaliert: true
      export:
        as: '${ $context + { ergebnis: . } }'
      then: end
      metadata:
        freesynergy.net:actor: human
        freesynergy.net:actor-type: Person
        freesynergy.net:gate: human
        freesynergy.net:kind: subjective
        freesynergy.net:summary: "The docs gate escalated (red three times or a check skipped): this flow ends before the review with `eskaliert: true`; the person decides."
output:
  as: '${ { status: ($context.ergebnis.status // "skipped"), eskaliert: ($context.ergebnis.eskaliert // false), aufraeumen: ($context.ergebnis.aufraeumen // null) } }'
