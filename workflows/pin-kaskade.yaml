# pin-kaskade: ONE cascade of the pins after a new tag of fs-types (trigger, here v0.0.3), in the order of the DAG (ADR 0092/0093; plan
# `katalog-plan/PLAN-baukasten-architektur.md`, user priority "Grundsystem fertig"). Order: `Workflow pin-kaskade, parameters ausloeser-tag, glieder, ab, workdir` (docs/prompt-template.md). FS profile: see README.md.
# Run through `workflow-pflege` (detect, write, schema-check, glance, to-main by the strategy).
# SCRIPTS: eight `@fs` calls are REAL scripts in `scripts/` (Python, JSON on stdout, rc 0 green / 1 red / 2 bad input; self tests `scripts/test_kaskade_plan.sh`, `test_kaskade_pins.sh`, `test_kaskade_gates.sh`, `test_kaskade_zyklen.sh` with mutants): `kaskade-lage`, `kaskade-plan`, `kaskade-glied`, `kaskade-glied-fertig`, `kaskade-fremde-pins`, `lock-gleich`, `gates-komplett`, `kaskade-zyklen`. SPECIFICATION: the other `@fs` calls (`vorhanden-pruefen-ai`, `befund-beleg`, `board-card`, `kaskade-plan-regeln`, `kaskade-besonderes-ai`, `lock-sources-strict`, `push-unreviewed`, `branch-ci`, `report-write`, `windows-aufrufer`) have no script yet, and a whole real run is not proven. Agents never push to main, tag or merge; ordinary push only to `unreviewed/pin-kaskade-<repo>-<n>` (a NEW number after every rebase, never a force push, [REBASE-NEUER-BRANCH]); no `gh` call; reports per [BERICHT]; one board card (fs-tasks, project `bahn5-crates`).
# Order of the Glieder (ADR 0093 rule 1: fs-types -> {fs-interfaces, fs-objects, fs-jscalendar, fs-components} -> fs-rpc -> programs), DERIVED from the real dependencies, not from a fixed list (step `plan`): the table below is the evidence (Cargo.toml of main of every Glied repo, `git clone --depth 1`, read 17.11.2026; `A <- B, C` = A depends on B and C); the test `workflows_pin_kaskade.rs` keeps the table, the order and its own copy of the edges in step.
# GLIEDER-ORDER: fs-interfaces, fs-objects, fs-jscalendar, fs-rpc, fs-components, fs-people, fs-tasks, fs-calendars
# DAG: fs-interfaces <- fs-types
# DAG: fs-objects <- fs-types
# DAG: fs-jscalendar <- fs-types
# DAG: fs-rpc <- fs-types, fs-interfaces, fs-objects, fs-conformance
# DAG: fs-components <- fs-types, fs-conformance
# DAG: fs-people <- fs-interfaces, fs-objects, fs-components
# DAG: fs-tasks <- fs-interfaces, fs-objects, fs-components, fs-jscalendar, fs-people
# DAG: fs-calendars <- fs-types, fs-interfaces, fs-objects, fs-rpc, fs-jscalendar, fs-components, fs-tasks
# REV-PIN: fs-rpc -> fs-types rev 339aa24f (fs-conformance, via fs-starter)
# REV-PIN: fs-components -> fs-types rev 339aa24f (fs-conformance, via fs-settings)
# REV-PIN: fs-tasks -> fs-people rev 358a8145 (fs-people-directory, testdata)
# REV-PIN: fs-calendars -> fs-components rev 9950b51 (6 crates of fs-calendars-app: fs-admin-frontend, fs-components-app, fs-components-fields, fs-components-widgets, fs-components-calendar-grid, fs-components-styles)
# FREMDQUELLEN: workflows/kaskade-fremdquellen.txt (known foreign sources by `rev`, an exception list and NOT a finding): FreeSynergy/blinc-app-fix (blinc_app), FreeSynergy/blinc-layout-fix (blinc_layout), both in fs-calendars-app
# TRIGGER fs-interfaces v0.0.30 (own table, own prefixes `# DAG[fs-interfaces]:` / `# GLIEDER-ORDER[fs-interfaces]:` so that the table above and its test stay unchanged; Cargo.toml of main read 21.11.2026 by `git ls-remote` and flat clones, plan `.scratch/plan-kaskade-interfaces030-2026-11-21.md`): fs-interfaces v0.0.30 (tag 5e049ad, only `instance.capnp` appended) is DONE and only pinned further; Glieder fs-rpc (v0.0.6), fs-modules-planning (v0.0.3), fs-forms (v0.0.10, the lift only), fs-starter (v0.0.4).
# GLIEDER-ORDER[fs-interfaces]: fs-rpc, fs-modules-planning, fs-forms, fs-starter
# DAG[fs-interfaces]: fs-rpc <- fs-interfaces
# DAG[fs-interfaces]: fs-modules-planning <- fs-interfaces, fs-rpc
# DAG[fs-interfaces]: fs-forms <- fs-interfaces, fs-rpc, fs-modules-planning
# DAG[fs-interfaces]: fs-starter <- fs-interfaces, fs-rpc, fs-forms
# CYCLE NOTE [fs-interfaces]: fs-starter <-> fs-forms stays broken: fs-starter (crate fs-starter-host) pins fs-forms-run, fs-forms pins the REPO fs-starter NOT (`kaskade-zyklen` must find no cycle; the comment at fs-forms-bin/Cargo.toml line 24 `fs-starter = git fs-rpc` is to be proven before the lift of fs-forms, step C0 of the plan, not guessed). fs-components is NOT a Glied of this run (fs-forms stays on v0.0.33; fs-components v0.0.34 and fs-forms v0.0.11 are a later run).
# INPUTS for the run with the trigger fs-interfaces v0.0.30: `glieder` = [ {fs-interfaces, bibliothek, v0.0.30, allow, DONE}, {fs-rpc, bibliothek, v0.0.6}, {fs-modules-planning, bibliothek, v0.0.3}, {fs-forms, programm, v0.0.10}, {fs-starter, programm, v0.0.4} ] and `ab` = fs-rpc: fs-interfaces is given as the first Glied only so that `kaskade-plan` knows its owner repo; with `ab` it counts as done ONLY because its tag v0.0.30 exists on the remote (ls-remote); `plan.offen` is then exactly fs-rpc, fs-modules-planning, fs-forms, fs-starter in this order. `ausloeser-tag` stays a tag of fs-types (the scripts `kaskade-lage` and `kaskade-plan` know only the trigger repo fs-types: use the fs-types tag that all four repos already pin, no new fs-types). `workdir` / `worktrees` as usual (the worktree of a Glied is `<worktrees>/pk-<repo>`); `kaskade-zyklen` reads `root` = `worktrees` with `prefix: pk-` (`plan.offen` + every repo the pins mention that has a checkout there), so checkouts `pk-fs-rpc`, `pk-fs-modules-planning`, `pk-fs-forms`, `pk-fs-starter` must exist when the step runs, else the repo is an `ungelesen` node and the cycle fs-starter <-> fs-forms is NOT proven (the fs-starter checkout is the branch from `unreviewed/single-instance3`). The ordering rules of `plan-check` that name fs-jscalendar, fs-tasks or fs-people apply only to Glieder that are in the run.
# Notes to the table: `fs-conformance` is a crate of the REPO fs-types (the trigger tag carries it), pinned by `rev 339aa24f` in fs-rpc (fs-starter) and fs-components (fs-settings); `fs-calendars-app` (crate of the repo fs-calendars, main c543bcb7 read 17.11.2026) pins SIX crates of fs-components by `rev 9950b51` next to the tag pins of fs-calendars-simple: the step `rev-pins` lifts them onto the fs-components tag of the same Glied (so the DAG edge fs-calendars <- fs-components is real twice); the Blinc patch repos `FreeSynergy/blinc-app-fix` and `FreeSynergy/blinc-layout-fix` (rev) are KNOWN FOREIGN SOURCES (`kaskade-fremdquellen.txt`), neither lifted nor a finding, and `fs-people-directory` is a crate of the REPO fs-people, pinned by `rev 358a8145` in fs-tasks (testdata), so fs-people is a Glied BEFORE fs-tasks (the pilot of the programs; fs-tasks stands before the other programs, fs-people only because the pilot needs its tag). fs-tasks, fs-people and fs-calendars still take `fs-types` from the repo fs-interfaces (v0.0.22, `fs-types-frontend` v0.0.2): the lift moves it to FreeSynergy/fs-types (`--types`, `--move`), the step `fremde-pins` proves afterwards that no other source is left. fs-components does not depend on fs-rpc (and the reverse), so their relative order is free; the order of the list is the stable tie order.
# Per Glied: pin in Cargo.toml and Cargo.lock by cargo (`lift`, never by hand), `strict` lock check with `FS_LOCK_STRICT=1` and `FS_LOCK_ONLY_FROM=1` (one source per library of `scripts/lock-sources.toml`: fs-types, fs-objects, fs-interfaces, fs-rpc, fs-jscalendar; fs-types ONLY from FreeSynergy/fs-types), the gates complete in both environments (CARGO_BUILD_JOBS=4, BUILD_PRIORITY=0 = scaffold core, [GATE-*] rules), branch CI at the exact head, Opus review at the head, ff and tag ONLY through `ff-und-tag` - THEN the next Glied.
# START: the cascade starts only AFTER fs-release v0.0.11 (it holds `_windows-check.yml`): `kaskade-lage` proves the tag by ls-remote (red when missing). B4, NO exceptions: every Glied gets the caller `_windows-check.yml@v0.0.11` (file `.github/workflows/windows.yml` of the Glied repo, step `windows-aufrufer`) BEFORE its tag, and its Windows CI is green at the head.
# BUILD RULES (every build step of every Glied): [BAU-ANMELDEN] BEFORE every build one line in /srv/FreeSynergy/.scratch/nach-welle-1.md (time from `date -u` and `TZ=Europe/Berlin date`, never estimated; repo/worktree, head, command, log path, agent), max. 2 build slots systemweit (`build-slot.sh`). [GATES-WAECHTER] / [GATE-NICHT-AENDERN]: while `gates.sh` runs NOTHING in the tree changes (no edit, no commit, no checkout); gates.sh checks the tree hash at the start and the end and holds `.gates.lock`, a change = rc != 0 and the result is void. [WORKTREES-NIE-IM-HAUPT-CHECKOUT]: worktrees and clones only under /srv/FreeSynergy/.scratch/api-runner/wt/ (path under 60 characters) or probe/, NEVER inside the main checkout (an untracked worktree there turns the rust-rules gate red).
# ABORT: a red Glied stops the cascade (`eskalation` to the strategy), no skipping, no parallel build of dependent Glieder. Resume after solving: input `ab` = the Glied that was red. End: the same fs-types version in every lock, one source in the graph.
# Rule [KEINE-KALTEN-FLACHPROBEN-BIS-AUFRAEUMEN]: no cold flat trial builds in fresh targets until the clean-up is done; every build goes through `build-slot.sh` into the OWN target of the worktree (`.scratch/target/<repo>/<worktree>`, [EIGENES-TARGET]); proof runs never in a target shared with other worktrees; an existing target of the same repo state is reused. Also [GATE-VOLLSTAENDIG-LAUFEN] (`cargo fmt --all` first, then `gates.sh` COMPLETE at the end head, both environments), [GATE-CI-UMGEBUNG] (also with `CARGO_TERM_COLOR=always CI=true`), [GATE-FLACHER-KLON-OHNE-TAGS] (a counter-run in a shallow clone WITHOUT tags, `git clone --depth 1 --no-tags`), [GATE-AUSGABE-NIE-KUERZEN] (no gate output cut with `tail`/`head`, rc of every gate visible). No AI on servers (not touched).
# RULES ADDED BY workflow-pflege-1 (23.11.2026, cards 6, 7, 2; each rule names its occasion):
# [CARGO-UPDATE-DIREKT] (card 6) The lock is moved by `timeout 120 cargo update -p <crate> [--precise ...]` DIRECTLY in the worktree (no compile, seconds). It does NOT go through `build-slot.sh`: `bash .scratch/build-slot.sh cargo update -p ...`
#   fails because the slot inserts `-j8` into the cargo call and `cargo update` has no such option. Only calls that compile (check, clippy, test, build) go through the slot. SPECIFICATION CARD ONLY: no change of the script
#   `build-slot.sh` is made here; if it learns commands without `-j` later, this rule can be relaxed. Occasion: pin-s3a / pin-s2 reports (`cargo update -p fs-types` with `timeout 120`, 5 s).
# [GATES-KOMPLETT] (card 7) The gate step of a Glied calls `scripts/gates.sh` COMPLETELY (all gates in the order of the script, `--like-ci`), never clippy alone and never single cargo commands in its place. Occasion: pin-dag-r1 - the CI
#   was red at clippy AND at rust-rules (cli.rs 358 > 300), a local run of clippy alone would have missed the second gate.
# [TOOLCHAIN-ABWEICHUNG] (card 7) The local rustc (today 1.100.0) can differ from the CI `RUST_VERSION` (1.99.1). This is KNOWN: a local clippy or fmt finding in code the branch did not change (old debt, e.g. 6 findings in pin-dag-r1) is only NAMED in the report
#   ("local toolchain, not in the diff"); the CI at the exact head decides. A finding in a file the branch changed is never dismissed this way ([GATE-BELEG] of `testlauf`). CARD (not built): the gates should compare `rustc --version`
#   with `RUST_VERSION` themselves and print the deviation as a visible line (`toolchain: lokal 1.100.0, CI 1.99.1`), so nobody has to find it in the log. Occasions: K-4-r1 (fmt red only local), pin-dag-r1 (clippy local only).
# [NICHT-GELAUFEN-NIE-GRUEN] (card 2) A gate of a Glied that did not run, has no `rc` or no result is red, never green (see `ff-und-tag` and `testlauf`); `gates-weiter` already treats a missing result as red.
# Inputs: `ausloeser-tag` (tag of fs-types, e.g. v0.0.3), `glieder` (list of { repo, art, tag, allow, besonderes } in DAG order; optional per Glied, passed on to `ff-und-tag` (r1, S4): `pakete` (true = builds rpm and deb), `registry_crate` (true | false; not set = list in `ff-und-tag`: fs-types, fs-conformance, fs-records), `erstkette_ok`, `rot_freigabe` = { run_ids, workflows, grund, wort } (r3: `workflows` = list of the workflow names of exactly the red branch runs; without it `ff-und-tag` escalates, an order from before r2 must add it)), `ab` (optional resume: name of the Glied to start at), `workdir` (own folder for the fresh clones of `ff-und-tag`), `worktrees` (optional, default /srv/FreeSynergy/.scratch/api-runner/wt: the worktree of a Glied is `<worktrees>/pk-<repo>`).
# Loops: a red check step with repeats jumps back at most twice, the third red round goes to `eskalation`; the Glied steps do NOT repeat: red = abort.
document:
  dsl: 1.0.3
  namespace: freesynergy.net
  name: pin-kaskade
  version: 0.0.18
  title: Pin cascade after a new fs-types tag - Glied by Glied in DAG order, lift, lock, gates, CI, review, ff-und-tag, abort on red, resume with ab
do:
  - vorhanden-pruefen:
      call: vorhanden-pruefen-ai:0.0.18@fs
      with:
        suche: ${ .input }
      export:
        as: '${ $context + { befund: . } }'
      metadata:
        freesynergy.net:actor: ai
        freesynergy.net:actor-type: Service
        freesynergy.net:bot-seat: pin-kaskade.vorhanden-pruefen
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "MANDATORY FIRST STEP (rule of the user): before anything is built, look whether it exists and is only extended: the lift (`fs-release lift --repo NAME=vX.Y.Z`, flow `lift`), `scripts/gates-lock.sh`, `scripts/set_components_tag.py`, the flows `ff-und-tag`, `review`, `lift-v1plus`, an earlier cascade on `unreviewed/` branches and in `.scratch`. Result `befund` = { art: vorhanden | neu, verweis, beleg }; the cascade ONLY calls the existing flows, it builds no second pin, push or tag way."
  - vorhanden-pruefen-check:
      call: befund-beleg:0.0.18@fs
      with:
        befund: ${ $context.befund }
      export:
        as: '${ $context + { belegcheck: . } }'
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Check (gate): a `befund` without proof is RED; a missing `befund` is red."
  - vorhanden-pruefen-again:
      switch:
        - runden:
            when: '${ $context.belegcheck.red == true and ($context.belegcheck.runde // 0) >= 3 }'
            then: eskalation
        - red:
            when: '${ $context.belegcheck.red == true }'
            then: vorhanden-pruefen
        - green:
            when: '${ $context.belegcheck.red == false }'
            then: continue
        - ohne-ergebnis:
            then: eskalation
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Control flow - red goes back to `vorhanden-pruefen` (at most two repeats), from the third red round to `eskalation`; only `red == false` goes on; a missing result goes to `eskalation`, never to green."
  - karte:
      call: board-card:0.0.18@fs
      with:
        workflow: pin-kaskade
        ausloeser: ${ .input["ausloeser-tag"] }
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Script - the board card of this run in fs-tasks (project `bahn5-crates`; `timeout 15 fs-tasks list` first: a card `pin-kaskade` that exists gets a note, no second card; then claim, in-progress; a note per finished Glied, done at the end). Specification, no script yet (`board-card`). Rule [ARBEIT-IN-FS-TASKS]."
  - lage:
      call: kaskade-lage:0.0.18@fs
      with:
        ausloeser: ${ .input["ausloeser-tag"] }
        glieder: ${ .input.glieder }
        ab: ${ .input.ab // null }
        fs-release-tag: v0.0.11
      export:
        as: '${ $context + { lage: . } }'
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Script `scripts/kaskade-lage` (read only) - proves by `git ls-remote --tags` (never from an old clone) that the trigger tag of fs-types exists (here v0.0.3) and that fs-release v0.0.11 (holds `_windows-check.yml`; the cascade starts only after it) exists (this is the FIRST tag that holds the file, a floor; the ref the callers pin may be a later tag or a full SHA of fs-release main that contains owner-neutral, see `address aufrufer`), and shows the head of every Glied; per Glied it also reports whether `.github/workflows/windows.yml` calls `_windows-check.yml` at a tag >= v0.0.11 (`windows[].aufrufer`, `ohne_aufrufer`: NOT red here, the step `windows-aufrufer` creates it) and the Windows run of exactly that head (`windows_ci`, public REST API GET, no `gh`); with `ab` (resume input = the Glied that was red) the list starts there, and the Glieder BEFORE `ab` are read as done ONLY when their tag exists on the remote (ls-remote): result `lage` = { ausloeser, glieder, ab, erledigt: [{ repo, tag, beleg }] } - the tags of the done Glieder are kept, so `libs` of the later Glieder are right after a resume."
  - plan:
      call: kaskade-plan:0.0.18@fs
      with:
        lage: ${ $context.lage }
      export:
        as: '${ $context + { plan: . } }'
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Script `scripts/kaskade-plan` - derives the order of the Glieder from the REAL dependencies (ADR 0092/0093), not from a fixed list: reads the Cargo.toml of main of every Glied repo (blobless clone, `git ls-remote` for the head), maps every FreeSynergy git dependency (`tag` AND `rev`) to its owner repo (the repo of the git URL; known foreign sources of `workflows/kaskade-fremdquellen.txt`, the Blinc patch repos, are an exception list and skipped), builds the edges and sorts topologically with the stable tie order of the `glieder` input; fs-jscalendar is a Glied of the same level as fs-interfaces (before fs-rpc and the programs). A dependency whose owner repo is not in `glieder`, a crate from a repo that is not its owner and that the lift cannot move (fs-types from the repo fs-interfaces is listed as `falsche_quellen`, the lift moves it) and a cycle are reported as `befunde` (the cascade goes to `eskalation`, never silently on). Result `plan` = { offen: [Glied...], erledigt: `lage.erledigt` (EMPTY only without `ab`; with `ab` the Glieder before it with their ls-remote tag), befunde: [] } where a Glied = { repo, art: bibliothek | programm, tag, allow, besonderes, rev_pins }; `offen[0]` is the next one; a Glied is built only after ALL Glieder it depends on are done (no parallel build of dependent Glieder). The table in the header of this file is the evidence for today's graph."
  - plan-check:
      call: kaskade-plan-regeln:0.0.18@fs
      with:
        plan: ${ $context.plan }
      export:
        as: '${ $context + { plancheck: . } }'
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Check: the order follows the DAG (no Glied before one it depends on; every edge of `plan` is checked against the Cargo.toml pins, also the `rev` ones), fs-jscalendar stands before fs-rpc and before every program, fs-tasks stands before the other programs (fs-people only before fs-tasks), every Glied has `tag` and `allow`, `befunde` is empty, `ab` names a Glied of the list."
  - plan-again:
      switch:
        - runden:
            when: '${ $context.plancheck.red == true and ($context.plancheck.runde // 0) >= 3 }'
            then: eskalation
        - red:
            when: '${ $context.plancheck.red == true }'
            then: plan
        - green:
            when: '${ $context.plancheck.red == false }'
            then: continue
        - ohne-ergebnis:
            then: eskalation
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Control flow - red goes back to `plan` (at most two repeats), from the third red round to `eskalation`; only `red == false` goes on; a missing result goes to `eskalation`, never to green."
  - zyklen-check:
      call: kaskade-zyklen:0.0.18@fs
      with:
        plan: ${ $context.plan }
        root: ${ .input.worktrees // "/srv/FreeSynergy/.scratch/api-runner/wt" }
        prefix: pk-
      export:
        as: '${ $context + { zyklen: . } }'
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Script `scripts/kaskade-zyklen` (read only, no network; Python, rc 0 no cycle / 1 cycle / 2 bad input): no repo pins a tag of a repo that (transitively) pins it back. Builds the directed graph repo -> repo from EVERY FreeSynergy git dependency (`tag` and `rev`) in every Cargo.toml of the checkouts of ALL repos of the cascade (the repos of `plan.offen` in the work folder (the work folder is `root` = `input.worktrees`, default /srv/FreeSynergy/.scratch/api-runner/wt, with `prefix` `pk-`: the checkout of repo R is `<root>/pk-R`, the same folders as the worktrees of the Glieder; the repo name in the graph is the pin's repo name) AND every repo the pins mention that has a checkout there; known foreign sources are no edge), not only the Glieder (so a cycle such as fs-starter <-> fs-forms is found even when one side is no Glied), and searches it for cycles (depth-first, strongly connected components of more than one repo, or a repo that pins itself). Result `zyklen` = { red: true when at least one cycle exists, cycles: [[repo, ..., repo]], repos, edges, ungelesen }; red lists every cycle with its repos. Self test `scripts/test_kaskade_zyklen.sh` (2-cycle, 3-cycle, self edge, rev pin, bad input, mutants)."
  - zyklen-weiter:
      switch:
        - zyklus:
            when: '${ $context.zyklen.red == true }'
            then: eskalation
        - green:
            when: '${ $context.zyklen.red == false }'
            then: continue
        - ohne-ergebnis:
            then: eskalation
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Control flow - a dependency cycle between repos stops the cascade at once (`eskalation`, no repeat: a cycle is not solved by planning again, the pins must be cut by a decision); only `red == false` goes on; a missing result goes to `eskalation`."
  - glied-weiche:
      switch:
        - fertig:
            when: '${ ($context.plan.offen | length) == 0 }'
            then: lock-ende
        - schleife:
            when: '${ ($context.plan.offen | length) > 0 and ($context.plan.offen | length) >= ($context.plan.offen_vorher // 1000000) }'
            then: eskalation
        - weiter:
            when: '${ ($context.plan.offen | length) > 0 and ($context.plan.offen | length) < ($context.plan.offen_vorher // 1000000) }'
            then: glied-start
        - ohne-ergebnis:
            then: eskalation
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Control flow of the loop over the Glieder - an empty `plan.offen` goes to the final lock check; if the length of `plan.offen` is NOT smaller than before the last `naechstes` (`plan.offen_vorher`, written by the script `kaskade-glied-fertig`: it did not shorten the list, the same Glied would be `offen[0]` again) it is a loop and goes to `eskalation`; otherwise the next Glied; a missing plan goes to `eskalation`."
  - glied-start:
      call: kaskade-glied:0.0.18@fs
      with:
        plan: ${ $context.plan }
        ausloeser: ${ .input["ausloeser-tag"] }
        dir: ${ .input.worktrees // "/srv/FreeSynergy/.scratch/api-runner/wt" }/pk-${ $context.plan.offen[0].repo }
      export:
        as: '${ $context + { glied: . } }'
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Script `scripts/kaskade-glied` - ensures the tool file `.fs-lock-sources.toml` (`strict = true`, `only_from_enabled = true`) in the Glied worktree (missing: created; `strict = false` raised to true and shown in `hinweise`, so the commit of the Glied branch carries it), takes `plan.offen[0]` as the current Glied (`glied` = { repo, art, tag, allow, besonderes, libs, tags }, `libs` = the trigger tag of fs-types plus the tags of the Glieder already done that this one depends on, as `NAME=vX.Y.Z` for the lift; `tags` = the same for every done Glied it depends on, as {repo: tag}; a dependency that is not done is red). One Glied at a time; BUILD_PRIORITY of every build step of a Glied is 0 (scaffold core, `build-slot.sh`)."
  - rev-pins:
      call: kaskade-fremde-pins:0.0.18@fs
      with:
        glied: ${ $context.glied }
        dir: ${ .input.worktrees // "/srv/FreeSynergy/.scratch/api-runner/wt" }/pk-${ $context.glied.repo }
      export:
        as: '${ $context + { revpins: . } }'
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Script `scripts/kaskade-fremde-pins`, runs BEFORE the lift (the lift then makes Cargo.lock once, by cargo): lists every `rev` pin to a FreeSynergy repo in the Cargo.toml files of the Glied (today `fs-conformance` of the repo fs-types in fs-rpc and fs-components, rev 339aa24f; `fs-people-directory` of the repo fs-people in fs-tasks, rev 358a8145; six `fs-components` crates of `fs-calendars-app` in fs-calendars, rev 9950b51) and every crate that comes from a WRONG repo (fs-types from the repo fs-interfaces, `fs-types-frontend`); the `rev` pins are put on the TAG of the owner repo in the same Glied (fs-conformance -> the trigger tag of fs-types, which carries the crate; fs-people-directory -> the tag of the Glied fs-people, taken from `glied.libs`), only Cargo.toml is edited, never Cargo.lock. The Blinc patch repos `blinc-app-fix` and `blinc-layout-fix` (known foreign sources, `workflows/kaskade-fremdquellen.txt`) keep their `rev`: they are listed in `revpins.fremdquellen`, not lifted and not a finding. A rev whose commit is not contained in any tag of the owner repo (`git merge-base --is-ancestor` against the tag, read only) is NOT lifted by guess: it goes as a finding into `revpins.befunde` and the next step `rev-pins-weiter` stops the cascade. Worktree only under .scratch/api-runner/wt ([WORKTREES-NIE-IM-HAUPT-CHECKOUT])."
  - rev-pins-weiter:
      switch:
        - befund:
            when: '${ ($context.revpins.befunde // [] | length) > 0 or ($context.revpins.red // false) == true }'
            then: eskalation
        - ohne-befund:
            when: '${ ($context.revpins.befunde // [] | length) == 0 and ($context.revpins.red // false) == false }'
            then: continue
        - ohne-ergebnis:
            then: eskalation
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Control flow - a finding of `rev-pins` (a rev that is on no tag, a wrong source that cannot be moved) stops the cascade at once and goes to `eskalation` (the strategy decides: tag the owner repo first or add a Glied); without finding on to the lift; a missing result goes to `eskalation`."
  - pin-lift:
      run:
        workflow:
          namespace: freesynergy.net
          name: lift
          version: 0.0.18
        input:
          repo: ${ $context.glied.repo }
          commit: true
          libs: ${ $context.glied.libs }
      export:
        as: '${ $context + { lift: . } }'
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "The existing sub-workflow `lift`, called UNCHANGED (no second pin way): sets the pin in Cargo.toml to the new tag (`--repo NAME=vX.Y.Z`; fs-interfaces never touches fs-types; fs-types and fs-conformance come from the repo FreeSynergy-Net/fs-types, the lift moves a crate that still comes from the repo fs-interfaces), regenerates Cargo.lock by `cargo update --workspace` (cargo metadata, NEVER by hand) - this `cargo update` runs DIRECTLY with `timeout 120`, not through build-slot.sh ([CARGO-UPDATE-DIREKT]), runs fmt, clippy, rules, tests, `lock-sources` and commits with the identity FreeSynergy <support@freesynergy.net>."
  - ein-stand:
      call: kaskade-ein-stand:0.0.18@fs
      with:
        glied: ${ $context.glied }
        dir: ${ .input.worktrees // "/srv/FreeSynergy/.scratch/api-runner/wt" }/pk-${ $context.glied.repo }
      export:
        as: '${ $context + { einstand: . } }'
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Check (specification, no script yet; lesson 24.11.: `planning` and `person` as dev-dependencies of fs-starter pulled old fs-rpc states): DEV-DEPENDENCIES FIRST - in the Cargo.toml files of the Glied (also every member crate, `[dev-dependencies]` and `[build-dependencies]` as well as `[dependencies]`) every fs crate of `glied.libs` / `glied.tags` is on the new tag, the dev-dependency pins before the normal ones (a dev-dependency left behind pulls the old state of a lower crate into the graph); then, directly in the worktree and NOT through `build-slot.sh` (own target, `cargo tree -d --workspace --target all --edges normal,build,dev`, one run of `cargo` with the lock as the lift made it), the TARGET GRAPH has exactly ONE state (version and source/tag) per fs crate (`fs-types`, `fs-objects`, `fs-interfaces`, `fs-rpc`, `fs-conformance`, the modules, `fs-components`, `fs-forms`); a second state of an fs crate is RED with the crate, both states and the path that pulls the old one (`cargo tree -i <crate>@<old>`). Result `einstand` = { red, befunde: [{ crate, staende, zieht }] }; red is also a `cargo tree` that fails or prints nothing. No fix by hand and no `[patch]`: the pin of the Glied that pulls the old state is raised first (back to `glied-weiche`/`eskalation`, the strategy decides), Cargo.lock only by cargo."
  - ein-stand-weiter:
      switch:
        - rot:
            when: '${ ($context.einstand.red // false) == true or ($context.einstand.befunde // [] | length) > 0 }'
            then: eskalation
        - gruen:
            when: '${ $context.einstand.red == false and ($context.einstand.befunde // [] | length) == 0 }'
            then: continue
        - ohne-ergebnis:
            then: eskalation
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Control flow - ABORT on a red Glied: a second state of an fs crate in the target graph (or no result) stops the cascade at once and goes to `eskalation`; only `red == false` without findings goes on to the special work."
  - besonderes:
      call: kaskade-besonderes-ai:0.0.18@fs
      with:
        glied: ${ $context.glied }
      metadata:
        freesynergy.net:actor: ai
        freesynergy.net:actor-type: Service
        freesynergy.net:bot-seat: pin-kaskade.besonderes
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Sonnet does what is special for this Glied, from `glied.besonderes`, in the own worktree (local commit, no push): fs-interfaces - new tag, capnp regenerated, test `catalog_roundtrip`; fs-rpc - fs-starter-L1 `coded_stub`; fs-components - fs-settings lift, F1 catalog, `WITHOUT_COMPONENT` extended; a program - nothing more than its lift. Empty `besonderes` = nothing to do."
  - windows-aufrufer:
      call: windows-aufrufer:0.0.18@fs
      with:
        repo: ${ $context.glied.repo }
        aufrufer: FreeSynergy/fs-release/.github/workflows/_windows-check.yml@v0.0.11
        vorlage: examples/callers/windows.yml
      export:
        as: '${ $context + { windows: . } }'
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "B4, NO exceptions: every Glied gets the caller `FreeSynergy/fs-release/.github/workflows/_windows-check.yml@v0.0.11` BEFORE its tag. Checks and, where it is missing or pinned lower, creates the file `.github/workflows/windows.yml` in the own worktree of the Glied repo (local commit with the identity FreeSynergy <support@freesynergy.net>, no push here; `scripts/pin-refs.sh --dir <repo> v0.0.11` raises an existing pin and never lowers one). Template: `examples/callers/windows.yml` of fs-release (branch `unreviewed/windows-check`, may not be on main yet: referenced, NOT a precondition of the cascade; the cascade itself starts only after fs-release v0.0.11). Result `windows` = { red, datei, pin }; red when the file cannot be created or the pin is lower. Specification, no script yet (`windows-aufrufer`); `kaskade-lage` already reports the caller and the Windows run per head."
  - windows-weiter:
      switch:
        - rot:
            when: '${ $context.windows.red != false }'
            then: eskalation
        - gruen:
            when: '${ $context.windows.red == false }'
            then: continue
        - ohne-ergebnis:
            then: eskalation
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Control flow - no exception (B4): a Glied without the Windows caller stops the cascade (`eskalation`); only `red == false` goes on to the lock check."
  - lock-strikt:
      call: lock-sources-strict:0.0.18@fs
      with:
        repo: ${ $context.glied.repo }
        env: FS_LOCK_STRICT=1 FS_LOCK_ONLY_FROM=1
      export:
        as: '${ $context + { lockcheck: . } }'
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Script - `scripts/gates-lock.sh` / `scripts/check_lock_sources.py` with `strict = true` (env `FS_LOCK_STRICT=1`) AND `FS_LOCK_ONLY_FROM=1`: EXACTLY ONE source per library of `scripts/lock-sources.toml` (fs-types, fs-objects, fs-interfaces, fs-rpc, fs-jscalendar) in Cargo.lock, and fs-types ONLY from FreeSynergy/fs-types (a repo that still takes fs-types from the repo fs-interfaces, today fs-tasks v0.0.22, is red here); a second source is red. The lock was made by cargo, a hand edit is red."
  - gates:
      call: gates-komplett:0.0.18@fs
      with:
        repo: ${ $context.glied.repo }
        jobs: 4
        prioritaet: 0
        dir: ${ .input.worktrees // "/srv/FreeSynergy/.scratch/api-runner/wt" }/pk-${ $context.glied.repo }
      export:
        as: '${ $context + { bau: . } }'
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Script `scripts/gates-komplett` - `scripts/gates.sh` in BOTH environments (COMPLETE [GATES-KOMPLETT], never clippy alone; a toolchain deviation local against CI is named, the CI decides: [TOOLCHAIN-ABWEICHUNG]) (the strict CI one and the local one) through `/srv/FreeSynergy/.scratch/build-slot.sh` with CARGO_BUILD_JOBS=4 and BUILD_PRIORITY=0 (scaffold core); [BAU-ANMELDEN]: before EVERY build one line in nach-welle-1.md (time from `date -u`/`TZ=Europe/Berlin date`, repo/worktree, head, command, log path, agent); max. 2 build slots systemweit. [GATES-WAECHTER] / [GATE-NICHT-AENDERN]: while `gates.sh` runs nothing in the tree changes (head and tree are compared before and after, a change = red). [GATES] fmt, clippy pedantic, tests, rules check; [GATE-PIPEFAIL] `set -o pipefail` and one visible rc per gate, no output cut with `tail`/`head`; [GATE-GLEICH-CI] check scripts from the tag the CI of the repo pins. Rule [KEINE-KALTEN-FLACHPROBEN-BIS-AUFRAEUMEN]: no cold flat trial build in a fresh target while the clean-up is open (the flat run reuses its own target `.scratch/target/<repo>/flach`); the Glied builds in the OWN target of its worktree (`.scratch/target/<repo>/<worktree>`, [EIGENES-TARGET]); proof runs never in a target shared with other worktrees; an existing target of the same repo state is reused ([KEINE-KALTEN-FLACHPROBEN-BIS-AUFRAEUMEN]). [GATE-VOLLSTAENDIG-LAUFEN]: `cargo fmt --all` first, then `gates.sh` COMPLETE at the end head; [GATE-CI-UMGEBUNG]: both environments, the second with `CARGO_TERM_COLOR=always CI=true`; [GATE-FLACHER-KLON-OHNE-TAGS]: a counter-run in a shallow clone without tags (`git clone --depth 1 --no-tags`); [GATE-AUSGABE-NIE-KUERZEN]: no gate output cut with `tail`/`head`, the rc of every gate is visible."
  - gates-weiter:
      switch:
        - rot:
            when: '${ $context.lockcheck.red != false or $context.bau.red != false }'
            then: eskalation
        - gruen:
            when: '${ $context.lockcheck.red == false and $context.bau.red == false }'
            then: continue
        - ohne-ergebnis:
            then: eskalation
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Control flow - ABORT on a red Glied: lock check or gates red (or no result) stop the cascade at once and go to `eskalation`; no skipping, no next Glied, no parallel build. Only both `red == false` go on."
  - push-zweig:
      call: push-unreviewed:0.0.18@fs
      with:
        repo: ${ $context.glied.repo }
        branch-prefix: unreviewed/pin-kaskade-${ $context.glied.repo }-
      export:
        as: '${ $context + { zweig: . } }'
      metadata:
        freesynergy.net:actor: ai
        freesynergy.net:actor-type: Service
        freesynergy.net:bot-seat: pin-kaskade.push-zweig
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Ordinary push of the local commit to a NEW branch `unreviewed/pin-kaskade-<repo>-<n>` ONLY (`n` = the first number whose branch is not on the remote by `git ls-remote`, so a rebase gets a new name and never needs a force push, [REBASE-NEUER-BRANCH]; never main, never a tag, no `gh`); result `zweig` = { branch, head, basis } with the head from `git ls-remote` and `basis` = the head of main of the Glied repo (ls-remote) the review delta starts from."
  - zweig-ci:
      call: branch-ci:0.0.18@fs
      with:
        repo: ${ $context.glied.repo }
        branch: ${ $context.zweig.branch }
        head: ${ $context.zweig.head }
      export:
        as: '${ $context + { ci: . } }'
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Reads the branch CI of ALL workflows for exactly this head (`scripts/check_job_status.py`, read only): `ci.status` green | red | hung. The workflow `windows` (the caller of `_windows-check.yml`, B4) MUST exist and be green at this head, a missing Windows run is not green. A green run for an older head does not count."
  - ci-weiter:
      switch:
        - gruen:
            when: '${ $context.ci.status == "green" }'
            then: review
        - rot-oder-unbekannt:
            then: eskalation
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Control flow - ONLY `status == green` goes on to the review; red, hung, running or unknown stops the cascade (standing rule ZWEIG-CI) and goes to `eskalation`."
  - review:
      run:
        workflow:
          namespace: freesynergy.net
          name: review
          version: 0.0.18
        input:
          repo: ${ $context.glied.repo }
          branch: ${ $context.zweig.branch }
          head: ${ $context.zweig.head }
          delta: ${ $context.zweig.basis }..${ $context.zweig.head }
          scope: short
          tests: ${ .input.tests // "targeted tests of the Glied (lift, lock, gates)" }
      export:
        as: '${ $context + { urteil: . } }'
      metadata:
        freesynergy.net:actor: ai
        freesynergy.net:actor-type: Service
        freesynergy.net:bot-seat: pin-kaskade.review
        freesynergy.net:gate: opus-ja
        freesynergy.net:kind: subjective
        freesynergy.net:summary: "The Opus review at exactly this head (sub-workflow `review`, read only) with the `delta` (`<main head of the Glied>..<branch head>`) and the `tests` of the Glied like every other caller: line 1 JA or NEIN. The one review of the Glied: `ff-und-tag` below only CHECKS the JA for this head, it asks for no second one."
  - review-weiter:
      switch:
        - ja:
            when: '${ $context.urteil.verdict == "JA" }'
            then: ff-tag
        - nein-oder-offen:
            then: eskalation
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Control flow - ONLY a JA for this head goes on to the ff and tag; a NO, a condition or a missing verdict stops the cascade (`eskalation`); after the Glied is fixed the run resumes with `ab` = this Glied."
  - ff-tag:
      run:
        workflow:
          namespace: freesynergy.net
          name: ff-und-tag
          version: 0.0.18
        input:
          repo: ${ $context.glied.repo }
          branch: ${ $context.zweig.branch }
          head: ${ $context.zweig.head }
          tag: ${ $context.glied.tag }
          allow: ${ $context.glied.allow }
          workdir: ${ .input.workdir }
          pakete: ${ $context.glied.pakete }
          registry_crate: ${ $context.glied.registry_crate }
          erstkette_ok: ${ $context.glied.erstkette_ok }
          rot_freigabe: ${ $context.glied.rot_freigabe }
      export:
        as: '${ $context + { ff: . } }'
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: human
        freesynergy.net:kind: objective
        freesynergy.net:summary: "The existing sub-workflow `ff-und-tag` (r1: with its new inputs passed on from the Glied entry), the ONLY way to main and tag (no own push or tag way in this flow): derivation of the inputs, branch CI, signing entries, expected runs, fresh clone, identity, version, package names (only with `pakete: true`), approval for this head, CI of ALL workflows (red only with `rot_freigabe` for exactly the red runs), fresh reading of main, ff push (the push helper of the strategy, `gate: human`), CI on main, first-release knowledge (`erstkette_ok`), annotated tag, ls-remote proof, release watch, index line of a registry crate."
  - ff-weiter:
      switch:
        - fertig:
            when: '${ $context.ff.status == "done" and ($context.ff.eskaliert // false) == false }'
            then: naechstes
        - sonst:
            then: eskalation
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Control flow - only `status == done` without escalation counts the Glied as finished; every other result stops the cascade."
  - naechstes:
      call: kaskade-glied-fertig:0.0.18@fs
      with:
        plan: ${ $context.plan }
        glied: ${ $context.glied }
        beleg: ${ $context.ff.beleg }
      export:
        as: '${ $context + { plan: . } }'
      then: glied-weiche
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Script `scripts/kaskade-glied-fertig` - first proves by `git ls-remote --tags` that the tag of the Glied is on the remote (else red, the plan stays), then moves the Glied from `plan.offen` to `plan.erledigt` with its tag and the ls-remote proof, writes the old length of `offen` as `plan.offen_vorher` (loop guard of `glied-weiche`), adds a note to the board card, and returns to the loop: the NEXT Glied starts only now."
  - lock-ende:
      call: lock-gleich:0.0.18@fs
      with:
        plan: ${ $context.plan }
        ausloeser: ${ .input["ausloeser-tag"] }
        env: FS_LOCK_STRICT=1 FS_LOCK_ONLY_FROM=1
      export:
        as: '${ $context + { lockende: . } }'
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Script `scripts/lock-gleich` (read only), end check - in every Cargo.lock of the done Glieder (fresh blobless clones at the TAGS of the done Glieder; both switches of `env` are required, a weaker call is bad input) the SAME fs-types version (the trigger tag) and only ONE source per fs crate in the whole graph (`check_lock_sources.py` with `FS_LOCK_STRICT=1` and `FS_LOCK_ONLY_FROM=1`); EVERY crate of the repo fs-types stands on the trigger tag from the repo FreeSynergy-Net/fs-types, also `fs-conformance` (everywhere the same source and version, no `rev` pin to a FreeSynergy repo is left in any Cargo.toml: also `fs-people-directory`); one differing version, a second source or a left `rev` pin is red."
  - lock-ende-weiter:
      switch:
        - gruen:
            when: '${ $context.lockende.red == false }'
            then: bericht
        - rot-oder-unbekannt:
            then: eskalation
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Control flow - only `red == false` ends the cascade green; otherwise `eskalation`."
  - bericht:
      call: report-write:0.0.18@fs
      with:
        plan: ${ $context.plan }
        lock: ${ $context.lockende }
      then: end
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Report: per Glied repo, tag, head (ls-remote), CI, review head, gates rc; the final lock check; the numbers come from the scripts, not from an estimate."
  - eskalation:
      set:
        todo: eskalation
        ab: ${ if $context.lockende != null then null else ($context.glied.repo // null) end }
        endpruefung: ${ if $context.lockende != null then $context.lockende else null end }
      then: end
      metadata:
        freesynergy.net:actor: human
        freesynergy.net:actor-type: Person
        freesynergy.net:gate: human
        freesynergy.net:kind: subjective
        freesynergy.net:summary: "A check was red (three rounds for the steps with repeats), a Glied is red (lock, gates, CI, review NO, ff or tag not done) or a result is missing: the cascade STOPS, nothing is skipped and nothing runs in parallel. The strategy decides; the report names the Glied, the step and the last red result. After the Glied is solved the cascade resumes from exactly this Glied (input `ab`). An escalation from the end check (`lock-ende`) sets `ab: null` (no Glied is to blame) and names the end check with its red result as `endpruefung`."
