# Slim basics for a program: scaffold, window with name, icon and `was_kommt`, package metadata, user documentation stub, callers, gates, picture OK, catalog proposal.
# Replaces nothing: `programm-grundgeruest` (draft, not runnable) stays for the feature work; `programm-neu` stays the entry for NEW programs with an interface decision.
# The USER creates the repository; this flow prepares the scaffold in an own worktree and creates no repository. Agents never push, tag or merge; the tag goes through the strategy's helper after the review YES.
# Order: `Workflow grundfassung, step <id>, parameters programm, beschreibung, was_kommt, icon, frontend, art, repo, branch, head, delta, tag, vorbild, dossier, docs, docs_base, old, new, allow` (docs/prompt-template.md). FS profile: see README.md.
# Inputs: programm (name after the naming rule, ADR 0087), beschreibung (one sentence), was_kommt (list), icon (path or `placeholder`), frontend (frontend id, ASCII lower case, e.g. `simple`; the display name e.g. Einfach is translated; not core, server, client, app, bin, cli, engine, testserver - ADR 0094 draft, item 6), repo (name; the user creates it), art (`grundfassung` or `feature`; decides at `release-sperre` whether the trait lock is needed).
# Every check is green only when it says so (`red == false`); a missing result is never green.
document:
  dsl: 1.0.3
  namespace: freesynergy.net
  name: grundfassung
  version: 0.0.10
  title: Basics of a program in short - scaffold, window, metadata, user documentation, callers, gates, picture OK, catalog proposal
do:
  - name-pruefen:
      call: name-check:0.0.10@fs
      with:
        programm: ${ .input.programm }
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Script - the program name follows the naming rule of 16.11. (ADR 0087, namensregel.md: programs plural, lower case, prefix fs-; the activity is a verb (draw, paint, broadcast); data repos singular, capitalised; single case registry); a retired or forbidden old form is red. No agent renames a name \"back\" or \"simpler\"."
  - repo-lage:
      call: ask:0.0.10@fs
      with:
        repo: ${ .input.repo }
      metadata:
        freesynergy.net:actor: human
        freesynergy.net:actor-type: Person
        freesynergy.net:gate: repo-vom-nutzer
        freesynergy.net:kind: subjective
        freesynergy.net:summary: "The USER creates the repository (or says it exists); this flow creates no repository and makes no `gh` call. Only the scaffold is prepared in an own worktree and branch `unreviewed/<name>`."
  - recherche:
      call: research-haiku:0.0.10@fs
      with:
        programm: ${ .input.programm }
        vorbild: ${ .input.vorbild }
        dossier: ${ .input.dossier }
      metadata:
        freesynergy.net:actor: ai
        freesynergy.net:actor-type: Application
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Haiku (reads and writes notes only, never code) - a model dossier of at most one page for the FIRST frontend: states, menus, three workflows; existing dossiers under docs/*/programs/apps/<x>/frontends/ are used first. Foreign pictures are never quoted."
  - feature-liste:
      call: run-flow:0.0.10@fs
      with:
        workflow: feature-liste
        programm: ${ .input.programm }
        dossier: ${ .input.dossier }
      export:
        as: '${ $context + { features: . } }'
      metadata:
        freesynergy.net:actor: ai
        freesynergy.net:actor-type: Application
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Runs the flow `feature-liste` (branch unreviewed/workflow-feature-liste of fs-release, in progress, not yet in main): the complete feature list from the research goes to fs-documentation `todo/features/<programm>.md`, sorted into today / next / later (`- [ ]`/`- [x]`; note \"Feature-Freeze: offen (Nutzer)\"). `fenster` and `nutzer-doku` read \"today\" and \"next\" from this list (`$context.features`), not from an own input; the input `was_kommt` is only the start text if the list is still empty. Until that flow is in main this call is a specification."
  - vertrag-standard:
      call: run-flow:0.0.10@fs
      with:
        workflow: trait-delta
        programm: ${ .input.programm }
      export:
        as: '${ $context + { vertrag: . } }'
      metadata:
        freesynergy.net:actor: ai
        freesynergy.net:actor-type: Application
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Contract and standard per program, at the same time as the basics and the frontend ([BRUECKE-BEIDE-SEITEN]): the trait or capnp schema in fs-interfaces and the standard it follows. If the contract is missing, the flow `trait-delta` is started (branch unreviewed/workflow-trait-delta, not yet in main). The basics may start with a MINIMAL contract; the release of a feature run only when the lock file `sperren/<programm>_v1.sha256` exists (fixed point, set by the strategy, never by an agent; a lock is no feature freeze); `release-sperre` checks it (`art: feature`: a missing lock is red, never green; `art: grundfassung`: draft contract, visibly marked). Until `trait-delta.yaml` is in main: see the plan section Bruecke."
  - geruest:
      call: scaffold-ai:0.0.10@fs
      with:
        programm: ${ .input.programm }
        beschreibung: ${ .input.beschreibung }
        repo: ${ .input.repo }
        branch: ${ .input.branch }
      metadata:
        freesynergy.net:actor: ai
        freesynergy.net:actor-type: Application
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Sonnet, one slot - the scaffold of the program as a Rust crate or workspace; it delivers the core plus `fs-<programm> serve` (the server on the contract) plus the client crate `fs-<programm>-client`, all on the contract of `vertrag-standard` (F3 = A, ADR 0021): engine and frontend separate (ADR 0021), every source file starts with the `//! Pattern:` line and a `//!` head, no file longer than 300 lines (ADR 0043), the existing core stays as it is. MANDATORY: the binary crate knows `--version` (prints `<programm> <crate version>`, exit 0) and `--help` (exit 0); an unknown option exits 2 with a message (pattern: main.rs of fs-texts, our own code); the release smoke test calls `/usr/bin/<programm> --version` (fs-people failed on `unknown option --version`). Local commits ([COMMIT]), report per [BERICHT]."
  - frontend-crate:
      call: frontend-crate-ai:0.0.10@fs
      with:
        programm: ${ .input.programm }
        frontend: ${ .input.frontend }
        repo: ${ .input.repo }
        branch: ${ .input.branch }
      metadata:
        freesynergy.net:actor: ai
        freesynergy.net:actor-type: Application
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Sonnet (ADR 0094 draft, items 6 and 9, stage 1) - creates the crate `crates/fs-<programm>-<frontend>` with `[[bin]] fs-<programm>-<frontend>`, depending only on the client `fs-<programm>-client` and fs-components (never on -core or -server); the manifest `packaging/frontends/<frontend>.metainfo.xml` (AppStream addon with `<extends>`, `<requires>`, `fs:frontend-id`, `fs:exec`, `fs:contract`); the starter in `fs-<programm>` (secure the server, start the frontend, fallback to the standard frontend with a visible message); a handshake test with a wrong contract version (exit code 3 and a message, never silent); a `cargo tree` check that no dependency leads to -core or -server. The frontend is its own process with a frontend manifest (program, contract and version, capabilities, start command); at least one frontend is mandatory. The manifest format is AppStream per the ADR draft 0094 (the review proposed TOML `~/.local/share/freesynergy/frontend/<programm>/<id>.toml` until the ADR gap is closed: open decision). Same release package as the program (stage 1)."
  - fenster:
      call: window-ai:0.0.10@fs
      with:
        programm: ${ .input.programm }
        icon: ${ .input.icon }
        was_kommt: ${ $context.features.was_kommt }
        frontend: ${ .input.frontend }
      metadata:
        freesynergy.net:actor: ai
        freesynergy.net:actor-type: Application
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Sonnet - fills the crate `fs-<programm>-<frontend>` made by `frontend-crate` (no window compiled into the program) with fs-components (blocks first, none painted by hand): a window with the name, the icon (path or placeholder) and the list `was_kommt`; elements that do not work yet are locked with \"kommt noch\" (ADR 0066), no grey window without a reason, STOP-KI wherever AI is used. Engine and frontend stay separate processes and crates."
  - manifest:
      call: manifest-ai:0.0.10@fs
      with:
        programm: ${ .input.programm }
        beschreibung: ${ .input.beschreibung }
      metadata:
        freesynergy.net:actor: ai
        freesynergy.net:actor-type: Application
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Sonnet - the package metadata in `Cargo.toml` (authors, description, license, repository, rust-version) and the AppStream metadata in schema 1 WITHOUT `<icon>` (the icon comes with fs-packages 0.0.19 and schema 2); no invented fields."
  - nutzer-doku:
      call: user-doc-ai:0.0.10@fs
      with:
        programm: ${ .input.programm }
        beschreibung: ${ .input.beschreibung }
        was_kommt: ${ $context.features.was_kommt }
        docs: ${ .input.docs }
      metadata:
        freesynergy.net:actor: ai
        freesynergy.net:actor-type: Application
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Sonnet - the user documentation stub in fs-documentation, docs/de and docs/en `programs/apps/<x>/index.md`: what it is, what it can do today, what comes, picture. The picture is a placeholder until the picture OK; own work only, no foreign logos."
  - aufrufer:
      call: callers-ai:0.0.10@fs
      with:
        repo: ${ .input.repo }
      metadata:
        freesynergy.net:actor: ai
        freesynergy.net:actor-type: Application
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Sonnet - `.github/workflows/check.yml` and `release.yml` as callers of fs-release at `@v0.0.10` (examples/callers), pinned with `scripts/pin-refs.sh --dir <repo> v0.0.10`; `release.yml` with `kind: app`; `macos: false` and `windows-targets: \"\"` (decision of the strategy: the first version is Linux only)."
  - lock-sources:
      call: lock-sources-file:0.0.10@fs
      with:
        repo: ${ .input.repo }
      metadata:
        freesynergy.net:actor: ai
        freesynergy.net:actor-type: Application
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Sonnet - `.fs-lock-sources.toml` with `strict = true` (the lock check of fs-release, ADR 0092 rule 2); a Cargo.lock with the pinned sources is checked in."
  - changelog-readme:
      call: changelog-readme-ai:0.0.10@fs
      with:
        programm: ${ .input.programm }
        beschreibung: ${ .input.beschreibung }
        was_kommt: ${ .input.was_kommt }
      metadata:
        freesynergy.net:actor: ai
        freesynergy.net:actor-type: Application
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Sonnet - README (en, de) and CHANGELOG (en, de) of the new program: a first entry, what it is, what comes; no promise beyond `was_kommt`."
  - binary-test:
      call: binary-smoke:0.0.10@fs
      with:
        programm: ${ .input.programm }
      export:
        as: '${ $context + { binary: . } }'
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Binary test through build-slot.sh - `<programm> --version` and `fs-<programm>-<frontend> --version` exit 0 and the output contains the crate version, `--help` exits 0, an unknown option exits 2 with a message; the result is `red` or not. It mirrors the smoke test of the release flow (deb job, ubuntu:24.04 x86_64/aarch64)."
  - gates:
      call: gates:0.0.10@fs
      export:
        as: '${ $context + { gates: . } }'
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "scripts/gates.sh ([GATES]) through build-slot.sh, one at a time: cargo fmt --check, clippy (pedantic, -D warnings), tests (--locked), check-rust-rules; the result is `red` or not, rc is kept."
  - gates-again:
      switch:
        - red:
            when: ${ $context.gates.red or $context.binary.red }
            then: geruest
        - green:
            then: continue
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Control flow - red gates or a red binary test go back to geruest, otherwise on to the documentation gate."
  - doku:
      run:
        workflow:
          namespace: freesynergy.net
          name: doku-mitziehen
          version: 0.0.10
        input:
          repo: ${ .input.repo }
          delta: ${ .input.delta }
          docs: ${ .input.docs }
          docs_base: ${ .input.docs_base }
          old: ${ .input.old }
          new: ${ .input.new }
          allow: ${ .input.allow }
      export:
        as: '${ $context + { doku: . } }'
      metadata:
        freesynergy.net:actor: ai
        freesynergy.net:actor-type: Application
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Mandatory gate (rule doku-mitziehen) as a check AFTER nutzer-doku - sub-workflow doku-mitziehen.yaml checks only places and consistency; red stops before the picture."
  - bild:
      call: window-picture:0.0.10@fs
      with:
        programm: ${ .input.programm }
      export:
        as: '${ $context + { images: . } }'
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Script/test run - a picture of the window (testlauf with the theme guard, [THEME-WAECHTER]: a picture without a green guard is no evidence) and the picture for the user documentation; where the guard script is missing the result is missing and the flow does not go on to the picture OK (see `waechter`)."
  - waechter:
      call: theme-waechter-check:0.0.10@fs
      with:
        images: ${ $context.images }
      export:
        as: '${ $context + { waechter: . } }'
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "[THEME-WAECHTER] - every picture carries the requested theme and a token colour at a fixed place must fit it; a wrong theme is RED. A picture of a run whose guard is missing or red is no evidence: the verdict is not asked for. Specification: `theme-waechter-check` has no script yet, a missing result stops the flow before `picture-ok`, never green."
  - picture-ok:
      run:
        workflow:
          namespace: freesynergy.net
          name: picture-acceptance
          version: 0.0.10
        input:
          model: ${ .input.vorbild }
          ours: ${ $context.images }
          waechter: ${ $context.waechter }
      export:
        as: '${ $context + { verdict: . } }'
      metadata:
        freesynergy.net:actor: human
        freesynergy.net:actor-type: Person
        freesynergy.net:gate: bild-ok
        freesynergy.net:kind: subjective
        freesynergy.net:summary: "Picture OK of the user (window and documentation picture), taken as it is. Without a verdict the flow stops; it never goes on to the release without it."
  - katalog-vorschlag:
      call: catalog-proposal-ai:0.0.10@fs
      with:
        programm: ${ .input.programm }
        beschreibung: ${ .input.beschreibung }
        tag: ${ .input.tag }
      metadata:
        freesynergy.net:actor: ai
        freesynergy.net:actor-type: Application
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Sonnet - a DIFF for fs-catalog (two entries, program and frontend; for `art: grundfassung` the description and the README say \"Contract: draft\"; with `kind = frontend` and `requires` = the capability; schema 1 until fs-packages 0.0.19, description en and de), written as a patch file in the report; it is NOT pushed. The catalog change itself is `catalog-bump` after the release."
  - release-sperre:
      switch:
        - ohne-sperre:
            when: ${ .input.art != "grundfassung" and $context.vertrag.sperre != true }
            then: end
        - mit-sperre:
            then: continue
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Control flow (decision of the strategy, aim: visibility) - input `art` is `grundfassung` or `feature`. A BASICS release (only window, \"what comes\" and documentation; stores and exchanges no data over the contract) may release as v0.0.1 WITHOUT the lock: the contract is then a draft (`vertrag.status = entwurf`), marked visibly in the README (line \"Contract: draft\") and in the catalog description (`katalog-vorschlag`). A FEATURE release (stores or exchanges data over the contract) needs the lock file `sperren/<programm>_v1.sha256`; without it, or without a result, the flow ends (red, never green, the person decides). Reason: a lock before data flows over the contract protects nothing yet, while a visible first release is the aim."
  - release:
      run:
        workflow:
          namespace: freesynergy.net
          name: release-flow
          version: 0.0.10
        input:
          repo: ${ .input.repo }
          tag: ${ .input.tag }
          prerelease: true
          delta: ${ .input.delta }
          docs: ${ .input.docs }
          docs_base: ${ .input.docs_base }
          old: ${ .input.old }
          new: ${ .input.new }
          allow: ${ .input.allow }
      metadata:
        freesynergy.net:actor: human
        freesynergy.net:actor-type: Person
        freesynergy.net:gate: human
        freesynergy.net:kind: objective
        freesynergy.net:summary: "release-flow.yaml holds the ONE Opus review of this head (bound to exactly this head, green branch CI of all workflows first), then tag, CI, release; the trait must be locked first (`vertrag-standard`), the tag is set only by the strategy's helper after the picture OK and the review YES, never by an agent. There is no second review here."
