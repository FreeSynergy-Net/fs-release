# Slim basics for a program: scaffold, window with name, icon and `was_kommt`, package metadata, user documentation stub, callers, gates, picture OK, catalog proposal.
# Replaces nothing: `programm-grundgeruest` (draft, not runnable) stays for the feature work; `programm-neu` stays the entry for NEW programs with an interface decision.
# The USER creates the repository; this flow prepares the scaffold in an own worktree and creates no repository. Agents never push, tag or merge; the tag goes through the strategy's helper after the review YES.
# Order: `Workflow grundfassung, step <id>, parameters programm, bauplan, beschreibung, icon, frontend, art, repo, branch, head, delta, tag, vorbild, dossier, frontend_crate, programmseite, hilfe_marker, docs, docs_base, old, new, allow` (docs/prompt-template.md). FS profile: see README.md.
# Help = docs after ADR 0072 [akz.] (manual in the wiki, blocks with purpose `help.<topic>`) (pflege 9, G2b): input `programmseite` (program page in fs-documentation en + de, default `programs/apps/<programm>/index.md`) and `hilfe_marker`; step `doku-hilfe` after `nutzer-doku`.
# Inputs: programm (name after the naming rule, ADR 0087), bauplan (the path of `scaffold.toml`, ADR 0099; step `generieren` makes the program from it with `fs-blueprint new`), beschreibung (one sentence), icon (path; missing: the nearest existing icon of the catalog, marked "vorläufig" and in the gap list - no PNG placeholder), frontend (frontend id, ASCII lower case, e.g. `simple`; the display name e.g. Einfach is translated; not core, server, client, app, bin, cli, engine, testserver - ADR 0094 draft, item 6), repo (name; the user creates it), art (`grundfassung` or `feature`; decides at `release-sperre` whether the trait lock is needed).
# Rules of 17 Nov. (b7): (a) NO PNG placeholder: a missing component is replaced by the nearest EXISTING component, honestly marked "vorläufig" (tooltip or hint) and listed in the gap list ("Lücken") of the program's DESIGN; the real component is built in the background (lane 1) and replaces it. (b) Versions may currently JUMP (e.g. the basics directly v0.0.2, even with gaps); later no longer (the user announces it); version = tag. (c) No picture OK of the user is needed: the STRATEGY looks at the pictures (step `picture-ok`); only `accepted == true` goes on to `katalog-vorschlag`, otherwise gap list or escalation, never on.
# (d) SLOT RULE (hint): WRITE code, tests, documentation and picture sketches without a build slot; BUILD only after the release of a slot (`build-slot.sh`, at most 2 builds at the same time); waiting for a slot is no idle time.
# (e) LOOK AT ONCE (rule [AUSSEHEN-SOFORT], b7, 17 Nov.): a basics release shows more than "what comes" - step `hauptansicht` adds the first REAL main view in the look of the model (lessons [AUSSEHEN-LEHREN]); the pictures go as a PAIR model | ours with the SAME filter and state (step `bildpaar`); NO tag without the picture OK of the strategy (b7) (`vor-tag`).
# (f) BUNDLE ([BUENDEL-RELEASE], b7, 17 Nov.): do not release every small change alone: step `buendel-frage` asks the strategy "bundle complete? otherwise keep collecting" before `release`; a single release only for a blocker (program does not start, data loss, security).
# (g) MANDATORY test `server-unresponsive` ("hanging instance") in `binary-test`: a missing test = RED, never green.
# Release lock by `art` (decision b7, 17 Nov.; it replaces condition 2 of the Opus NO on f5bfc276 for the basics): a BASICS release (window, "what comes" and documentation only; stores no data over the contract) MAY release as v0.0.x WITHOUT the trait lock; the contract is then visibly a DRAFT in README and catalog. The lock `release_frei` (`sperren/<programm>_v1.sha256`) is MANDATORY before the first FEATURE release (data over the contract). The Opus conditions 1, 3, 4, 5 are kept.
# Every check is green only when it says so (`red == false`); a missing result is never green.
# Review template frontend: step `frontend-nur-komponenten` (input `frontend_crate`) before the picture acceptance: only component calls; logic or a widget is a finding (conversation `frontend-befund-talk`).
# Mandatory first step `vorhanden-pruefen` (rule of the user): look whether it exists or is only extended; the result `befund` (with proof) is read by the following steps.
document:
  dsl: 1.0.3
  namespace: freesynergy.net
  name: grundfassung
  version: 0.0.13
  title: Basics of a program in short - scaffold, window, metadata, user documentation, callers, gates, picture OK, catalog proposal
do:
  - vorhanden-pruefen:
      call: vorhanden-pruefen-ai:0.0.13@fs
      with:
        suche: ${ .input }
      export:
        as: '${ $context + { befund: . } }'
      metadata:
        freesynergy.net:actor: ai
        freesynergy.net:actor-type: Application
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "MANDATORY FIRST STEP (rule of the user: before anything is built, look whether it already exists and whether it is only extended): search ALL repos, the `unreviewed/` branches, `.scratch` and the inventories (`katalog-plan/INVENTUR-*.md`). Result `befund` = { art: vorhanden | neu, verweis (\"extend X\"), beleg (what was searched, with paths and heads) }. `neu` only WITH a reason and proof. The following steps read `befund`; nothing is built without it."
  - vorhanden-pruefen-check:
      call: befund-beleg:0.0.13@fs
      with:
        befund: ${ $context.befund }
      export:
        as: '${ $context + { belegcheck: . } }'
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Check (gate): `befund` without proof is RED - `neu` needs a reason and a proof (what was searched), `vorhanden` needs a reference \"extend X\"; a missing `befund` is red."
  - vorhanden-pruefen-again:
      switch:
        - runden:
            when: '${ $context.belegcheck.red == true and ($context.belegcheck.runde // 0) >= 3 }'
            then: grundfassung-eskalation
        - red:
            when: '${ $context.belegcheck.red == true }'
            then: vorhanden-pruefen
        - green:
            when: '${ $context.belegcheck.red == false }'
            then: continue
        - ohne-ergebnis:
            then: grundfassung-eskalation
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Control flow - red goes back to `vorhanden-pruefen` (at most two repeats), from the third red round to the escalation; only `red == false` goes on; a missing result goes to the escalation, never on."
  - name-pruefen:
      call: name-check:0.0.13@fs
      with:
        befund: ${ $context.befund }
        programm: ${ .input.programm }
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Script - the program name follows the naming rule of 16.11. (ADR 0087, namensregel.md: programs plural, lower case, prefix fs-; the activity is a verb (draw, paint, broadcast); data repos singular, capitalised; single case registry); a retired or forbidden old form is red. No agent renames a name \"back\" or \"simpler\"."
  - repo-lage:
      call: ask:0.0.13@fs
      with:
        repo: ${ .input.repo }
      metadata:
        freesynergy.net:actor: human
        freesynergy.net:actor-type: Person
        freesynergy.net:gate: repo-vom-nutzer
        freesynergy.net:kind: subjective
        freesynergy.net:summary: "The USER creates the repository (or says it exists); this flow creates no repository and makes no `gh` call. Only the scaffold is prepared in an own worktree and branch `unreviewed/<name>`."
  - recherche:
      call: research-haiku:0.0.13@fs
      with:
        programm: ${ .input.programm }
        vorbild: ${ .input.vorbild }
        dossier: ${ .input.dossier }
      metadata:
        freesynergy.net:actor: ai
        freesynergy.net:actor-type: Application
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Haiku (reads and writes notes only, never code) - the model named in `.input.vorbild` (the choice of the strategy; missing: ask, never pick one yourself); a model dossier of at most one page for the FIRST frontend: states, menus, three workflows; existing dossiers under docs/*/programs/apps/<x>/frontends/ are used first. Foreign pictures are never quoted."
  - feature-liste:
      call: run-flow:0.0.13@fs
      with:
        workflow: feature-liste
        programm: ${ .input.programm }
        dossier: ${ .input.dossier }
      export:
        as: '${ $context + { features: . } }'
      metadata:
        freesynergy.net:actor: ai
        freesynergy.net:actor-type: Application
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Runs the flow `feature-liste` (`workflows/feature-liste.yaml` of fs-release, in main): the complete feature list from the research goes to fs-documentation `todo/features/<programm>.md`, sorted into today / next / later (`- [ ]`/`- [x]`; note \"Feature-Freeze: offen (Nutzer)\"). `fenster` and `nutzer-doku` read \"today\" and \"next\" from this list (`$context.features`), not from an own input. It also delivers `vorbild` (`features.vorbild` is the model of `.input.vorbild` from the `recherche` dossier, with its pictures) and `hauptansicht` (areas and controls of the main view, from the plan table of the program) as RESULTS (`$context.features.vorbild`, `$context.features.hauptansicht`), read by `hauptansicht`. There is no own input `was_kommt`; it is a RESULT of this step. The flow `feature-liste` is in main."
  - vertrag-standard:
      call: run-flow:0.0.13@fs
      with:
        workflow: trait-delta
        programm: ${ .input.programm }
      export:
        as: '${ $context + { vertrag: . } }'
      metadata:
        freesynergy.net:actor: ai
        freesynergy.net:actor-type: Application
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Contract and standard per program, at the same time as the basics and the frontend ([BRUECKE-BEIDE-SEITEN]): the trait or capnp schema in fs-interfaces and the standard it follows. If the contract is missing, the flow `trait-delta` is started (`workflows/trait-delta.yaml`, in main). The basics may start with a MINIMAL contract; the release of a feature run only when the lock file `sperren/<programm>_v1.sha256` exists (fixed point, set by the strategy, never by an agent; a lock is no feature freeze); `release-sperre` checks it (`art: feature`: a missing lock is red, never green; `art: grundfassung`: draft contract, visibly marked). `trait-delta.yaml` is in main."
  - generieren:
      call: fs-blueprint:0.0.13@fs
      with:
        bauplan: ${ .input.bauplan }
        programm: ${ .input.programm }
        repo: ${ .input.repo }
        branch: ${ .input.branch }
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "The program is GENERATED from its blueprint, no agent writes scaffold code by hand (ADR 0099, S5; it replaces the AI step `scaffold-ai`, which was kept until the generator was equal: S3/S4 proved a program that builds and starts on Linux and Windows, answered by the real command). Call in the own worktree: `fs-blueprint new <bauplan> --out <worktree>` (input `bauplan` = the path of `scaffold.toml`, a folder `forms/` next to it comes along): it checks the blueprint against the catalog and the repo, generates workspace, core (seed), server, client, bin with the start tests, the CI callers (`check.yml`, `windows.yml`) and the desktop file, and writes them; on a check error NOTHING is written and the error comes as a code with a sentence (en or de): the blueprint is then repaired, not the generated code. Afterwards `fs-blueprint check --repo <worktree> --drift` must be green (no hand change to a generated file, no file under `crates/` without a head or an exception). Exceptions (hand-written code) only through `[[exception]]` with a talk record (flow `ausnahme-gespraech`). The binary knows `--version`, `--help` and an unknown option exits 2 (the generated start test checks it). Local commits ([COMMIT]), report per [BERICHT]."
  - frontend-crate:
      call: frontend-crate-ai:0.0.13@fs
      with:
        programm: ${ .input.programm }
        frontend: ${ .input.frontend }
        repo: ${ .input.repo }
        branch: ${ .input.branch }
      metadata:
        freesynergy.net:actor: ai
        freesynergy.net:actor-type: Application
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Sonnet (ADR 0094 draft, items 6 and 9, stage 1) - creates the crate `crates/fs-<programm>-<frontend>` with `[[bin]] fs-<programm>-<frontend>`, depending only on the client `fs-<programm>-client` and fs-components (never on -core or -server); the manifest `packaging/frontends/<frontend>.metainfo.xml` (AppStream addon with `<extends>`, `<requires>`, `fs:frontend-id`, `fs:exec`, `fs:contract`); the starter in `fs-<programm>` (secure the server, start the frontend, fallback to the standard frontend with a visible message); a handshake test with a wrong contract version (exit code 3 and a message, never silent); a `cargo tree` check that no dependency leads to -core or -server. The frontend is its own process with a frontend manifest (program, contract and version, capabilities, start command); at least one frontend is mandatory. The manifest format is AppStream per the ADR draft 0094 (the review proposed TOML `~/.local/share/freesynergy/frontend/<programm>/<id>.toml` until the ADR gap is closed: open decision). Own package `fs-<programm>-<frontend>` in the same release (deb/rpm) (stage 1)."
  - bild-start:
      set:
        n: 0
      export:
        as: '${ $context + { bild_runde: . } }'
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Starts the picture round counter `bild_runde.n` at 0 (read and raised by `bild-zaehlen`, never reset by the loop back to `fenster`)."
  - fenster:
      call: window-ai:0.0.13@fs
      with:
        programm: ${ .input.programm }
        icon: ${ .input.icon }
        was_kommt: ${ $context.features.was_kommt }
        frontend: ${ .input.frontend }
      metadata:
        freesynergy.net:actor: ai
        freesynergy.net:actor-type: Application
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Sonnet - fills the crate `fs-<programm>-<frontend>` made by `frontend-crate` (no window compiled into the program) with fs-components (blocks first, none painted by hand): a window with the name, the icon and the list `was_kommt` (`$context.features.was_kommt`); PLACEHOLDER RULE (17 Nov.): a component or an icon that is missing is NOT replaced by a PNG placeholder but by the nearest EXISTING component (it may do less), honestly marked \"vorläufig\" (tooltip or hint in the window) and written into the gap list \"Lücken\" (DESIGN of the program) with the name of the missing real component (built in the background by lane 1, it replaces the stand-in later); elements that do not work yet are locked with \"kommt noch\" (ADR 0066), no grey window without a reason, STOP-KI wherever AI is used. Engine and frontend stay separate processes and crates."
  - hauptansicht:
      call: main-view-ai:0.0.13@fs
      with:
        programm: ${ .input.programm }
        frontend: ${ .input.frontend }
        vorbild: ${ $context.features.vorbild }
        ansicht: ${ $context.features.hauptansicht }
      metadata:
        freesynergy.net:actor: ai
        freesynergy.net:actor-type: Application
        freesynergy.net:gate: bilder-gate
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Sonnet (rule AUSSEHEN-SOFORT, b7 17 Nov.; specification: the workflow `main-view-ai:0.0.13@fs` has no script yet) - adds the FIRST REAL main view in the look of the model to the crate `fs-<programm>-<frontend>` as start page next to `Start` and `Was kommt` (screen `main`, pictures `--picture --screen main|main-empty`). Plan table per program: draw = board with tool bar and canvas; messages = conversation list, history, input; resources = list and detail; forms = form list and editor view; activities = timeline; broadcast = dashboard; decisions, workflows, data, paint likewise from their model dossier. Built ONLY from existing fs-components blocks (placeholder rule: the nearest existing component, marked \"vorläufig\", gap list \"Lücken\" in DESIGN, no PNG). Example data ONLY in `fs-<programm>-<frontend>/src/preview.rs` (typed, ids with the prefix `preview:`, no real personal data, never in core, server or client, never stored, exported or sent over the contract); `mode(capabilities)` switches them off as soon as the capability to read the area is there (per area never mixed); every write action in the preview is locked with a reason. Preview marker EXACTLY ONCE: an Alert (Info, title \"Vorschau\" / \"Preview\") at the top plus the title addition; per row at most the example name. LESSONS [AUSSEHEN-LEHREN], built against the model PICTURE, not against the plan text: navigation as a LEFT bar with symbols (the title of the main area = the active filter); groups as LARGE headings; rows with type symbol left, sentence with the object name in bold, time right and NO coloured badges per row; readable font size like the model and generous white space; an empty state with symbol and explanatory text (`main-empty`). Gate (picture gate `bilder-gate`): the picture pair model | ours with the SAME filter and state, see `bildpaar`; without the pair and the picture OK of the strategy there is no tag."
  - manifest:
      call: manifest-ai:0.0.13@fs
      with:
        programm: ${ .input.programm }
        beschreibung: ${ .input.beschreibung }
      metadata:
        freesynergy.net:actor: ai
        freesynergy.net:actor-type: Application
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Sonnet - the package metadata in `Cargo.toml` (authors, description, license, repository, rust-version) and the AppStream metadata in schema 1 WITHOUT `<icon>` (the icon comes with fs-packages 0.0.19 and schema 2); no invented fields."
  - nutzer-doku:
      call: user-doc-ai:0.0.13@fs
      with:
        programm: ${ .input.programm }
        beschreibung: ${ .input.beschreibung }
        was_kommt: ${ $context.features.was_kommt }
        docs: ${ .input.docs }
      metadata:
        freesynergy.net:actor: ai
        freesynergy.net:actor-type: Application
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Sonnet - the user documentation stub in fs-documentation, docs/de and docs/en `programs/apps/<x>/index.md`: what it is, what it can do today, what comes, picture. The picture is the real window (no PNG placeholder: what is missing in the window is a stand-in component marked \"vorläufig\" and listed under \"Lücken\" in DESIGN); own work only, no foreign logos."
  - doku-hilfe:
      call: doku-hilfe-ai:0.0.13@fs
      with:
        programmseite: ${ .input.programmseite // ("programs/apps/" + .input.programm + "/index.md") }
        hilfe_marker: ${ .input.hilfe_marker // "fs:help" }
      metadata:
        freesynergy.net:actor: ai
        freesynergy.net:actor-type: Application
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Help = docs after ADR 0072 [akz.] (the manual in the wiki, blocks with purpose `help.<topic>`; supplement G2b point 1): prove that the program page in fs-documentation (`docs/en` and `docs/de`, input `programmseite`, default `programs/apps/<programm>/index.md`) has the MARKED help part, the block with purpose `help.<topic>` from the manual in the wiki (marker `hilfe_marker`, default `fs:help`); if not, a placeholder block is created. The help block reads only this part through fs-texts: one source, never a second text. No help text is written into the program repo."
  - doku-hilfe-check:
      call: doku-hilfe-regel:0.0.13@fs
      with:
        programmseite: ${ .input.programmseite // ("programs/apps/" + .input.programm + "/index.md") }
      export:
        as: '${ $context + { hilfecheck: . } }'
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Check: the marker is there in BOTH languages (en and de) and encloses a part; no help text in the program repo (a second source is red)."
  - doku-hilfe-again:
      switch:
        - runden:
            when: '${ $context.hilfecheck.red == true and ($context.hilfecheck.runde // 0) >= 3 }'
            then: grundfassung-eskalation
        - red:
            when: '${ $context.hilfecheck.red == true }'
            then: doku-hilfe
        - green:
            when: '${ $context.hilfecheck.red == false }'
            then: continue
        - ohne-ergebnis:
            then: grundfassung-eskalation
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Control flow - red goes back to `doku-hilfe` (at most two repeats), from the third red round to the escalation; only `red == false` goes on; a missing result goes to the escalation, never to green."
  - aufrufer:
      call: callers-ai:0.0.13@fs
      with:
        repo: ${ .input.repo }
      metadata:
        freesynergy.net:actor: ai
        freesynergy.net:actor-type: Application
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Sonnet - `.github/workflows/check.yml` and `release.yml` as callers of fs-release at `@v0.0.10` (examples/callers), pinned with `scripts/pin-refs.sh --dir <repo> v0.0.10`; `release.yml` with `kind: app`; `macos: false` and `windows-targets: \"\"` (decision of the strategy: the first version is Linux only, said honestly in README and catalog: \"Linux (Windows/macOS follow)\"); ALL `uses:` lines in `release.yml` and `check.yml` at `@v0.0.10` (or the newest chain), none at an older tag."
  - lock-sources:
      call: lock-sources-file:0.0.13@fs
      with:
        repo: ${ .input.repo }
      metadata:
        freesynergy.net:actor: ai
        freesynergy.net:actor-type: Application
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Sonnet - `.fs-lock-sources.toml` with `strict = true` (the lock check of fs-release, ADR 0092 rule 2); a Cargo.lock with the pinned sources is checked in."
  - changelog-readme:
      call: changelog-readme-ai:0.0.13@fs
      with:
        programm: ${ .input.programm }
        beschreibung: ${ .input.beschreibung }
        was_kommt: ${ $context.features.was_kommt }
      metadata:
        freesynergy.net:actor: ai
        freesynergy.net:actor-type: Application
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Sonnet - README (en, de) and CHANGELOG (en, de) of the new program: a first entry, what it is, what comes (`$context.features.was_kommt`); no promise beyond it. DESIGN gets \"The basics\" and the gap list \"Lücken\" (every stand-in component marked \"vorläufig\", see `fenster`). README and catalog say \"Contract: draft\" for `art: grundfassung`; the platforms are stated honestly: \"Linux (Windows/macOS follow)\". The version is the tag (versions may currently jump, e.g. the basics directly v0.0.2; later no longer, the user announces it)."
  - binary-test:
      call: binary-smoke:0.0.13@fs
      with:
        programm: ${ .input.programm }
      export:
        as: '${ $context + { binary: . } }'
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Binary test through build-slot.sh - `<programm> --version` and `fs-<programm>-<frontend> --version` exit 0 and the output contains the crate version, `--help` exits 0, an unknown option exits 2 with a message; MANDATORY test `server-unresponsive` (\"hanging instance\"): a server that does not answer ends the start in BOUNDED time with an error (code and parameters, MF2 key per ADR 0057), never a hang and never silent (pattern: fs-broadcast `a_hanging_instance_ends_the_start_with_an_error_in_bounded_time`); the result has `server_unresponsive` (test found and green); a missing test is RED (`red == true`), never green. The result is `red` or not. Carries red and runde (+1 for each jump back from `gates-again`). It mirrors the smoke test of the release flow (deb job, ubuntu:24.04 x86_64/aarch64)."
  - lehren-pruefen:
      call: lessons-check-ai:0.0.13@fs
      export:
        as: '${ $context + { lehren: . } }'
      metadata:
        freesynergy.net:actor: ai
        freesynergy.net:actor-type: Application
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Check points from the six basics (draw, messages, resources, forms, activities, tasks) - the result `lehren` is `red` or not, each point with evidence: (1) the `capabilities` result type of each contract (CapabilityList or flat) is read from fs-interfaces and the server answers with exactly that type; (2) `CONTRACT_VERSION` in the server when the core has none; (3) `release.yml`: ALL `uses` at `@v0.0.10` (or the newest chain); (4) `--version`, `-V`, `--help` answer BEFORE any window or socket, proven with `env -i`; (5) deb `depends = \"$auto, fs-<x>-simple (>= v)\"` (not the binary version) and the matching rpm requires; AppStream `compare=\"ge\"` in the metainfo; (6) tests: a Mutex around handshake tests (one server per process stops), ETXTBSY protection for stub starters (close and sync the file before exec); (7) Windows is said honestly (\"Linux (Windows/macOS follow)\"); (8) error texts: since the fs-rpc error codes the display uses `message_key()` and `params()` with MF2 de/en (ADR 0057), no English sentence from a library reaches the user; (9) the data folder is created only through `create_private` / `prepare_data_dir` (lesson fs-tasks: 0755); (10) the placeholder rule is kept (no PNG, stand-ins marked \"vorläufig\", gap list in DESIGN); (11) main view present (screen `main`), preview marker and `main-empty` picture exist, `mode()` test plus mutant, no real personal data in `preview.rs`, the lessons AUSSEHEN-LEHREN are met (left bar with symbols, large headings, rows without badges, readable font, empty state with symbol); (12) the test `server-unresponsive` exists and is green (missing = red); (13) the slot rule is kept (code written without a slot, built only after the release of a slot). Carries red and runde (+1 for each jump back from `gates-again`)."
  - gates:
      call: gates:0.0.13@fs
      export:
        as: '${ $context + { gates: . } }'
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "scripts/gates.sh ([GATES]) through build-slot.sh, one at a time: cargo fmt --check, clippy (pedantic, -D warnings), tests (--locked), check-rust-rules; the test `server-unresponsive` is one of the tests (missing = red); the result is `red` or not, rc is kept. Carries red and runde (the number of the round, +1 for each jump back from `gates-again`)."
  - gates-again:
      switch:
        - runden:
            when: ${ ($context.gates.red or $context.binary.red or $context.lehren.red) and (($context.gates.runde // 0) >= 3 or ($context.binary.runde // 0) >= 3 or ($context.lehren.runde // 0) >= 3) }
            then: grundfassung-eskalation
        - red:
            when: ${ $context.gates.red or $context.binary.red or $context.lehren.red }
            then: generieren
        - green:
            then: continue
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Control flow - red gates, a red binary test or a red `lehren` check go back to generieren, from the third red round (`runde` >= 3) to `grundfassung-eskalation` (the person decides), otherwise on to the documentation gate."
  - doku:
      run:
        workflow:
          namespace: freesynergy.net
          name: doku-mitziehen
          version: 0.0.13
        input:
          repo: ${ .input.repo }
          delta: ${ .input.delta }
          docs: ${ .input.docs }
          docs_base: ${ .input.docs_base }
          old: ${ .input.old }
          new: ${ .input.new }
          allow: ${ .input.allow }
      export:
        as: '${ $context + { doku: . } }'
      metadata:
        freesynergy.net:actor: ai
        freesynergy.net:actor-type: Application
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Mandatory gate (rule doku-mitziehen) as a check AFTER nutzer-doku - sub-workflow doku-mitziehen.yaml checks only places and consistency; red stops before the picture."
  - bild:
      call: window-picture:0.0.13@fs
      with:
        programm: ${ .input.programm }
      export:
        as: '${ $context + { images: . } }'
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Script/test run - a picture of the window (testlauf with the theme guard, [THEME-WAECHTER]: a picture without a green guard is no evidence) and the picture for the user documentation; where the guard script is missing the result is missing and the flow does not go on to the picture OK (see `waechter`)."
  - waechter:
      call: theme-waechter-check:0.0.13@fs
      with:
        images: ${ $context.images }
      export:
        as: '${ $context + { waechter: . } }'
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "[THEME-WAECHTER] - every picture carries the requested theme and a token colour at a fixed place must fit it; a wrong theme is RED. A picture of a run whose guard is missing or red is no evidence: the verdict is not asked for. Pictures `main` and `main-empty` of the main view (`hauptansicht`) are taken too. Specification: `theme-waechter-check` has no script yet, a missing result stops the flow before `picture-ok`, never green."
  - bildpaar:
      call: picture-pair-check:0.0.13@fs
      with:
        images: ${ $context.images }
        vorbild: ${ $context.features.vorbild }
        screens:
          - main
          - main-empty
      export:
        as: '${ $context + { bildpaar: . } }'
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: bilder-gate
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Picture gate of the main view (specification, no script yet): for `main` and `main-empty` (de and en) BOTH pictures exist - the model picture and ours - with the SAME filter and the SAME state (same active filter, language and theme); model pictures come from the model round (podman, local, no terms of service agreed; documentation pictures only from public pages), never from a run that agreed to a licence dialog. A missing model picture, a missing main view picture or a pair with a different state is RED (`red`), never green. HINT for the later script: the model comes from ONE source, `$context.features.vorbild` (`hauptansicht`, `bildpaar`, `picture-ok`); after `feature-liste` there is no second source. The picture OK of the strategy (b7) on these pairs is MANDATORY: no tag without it (`vor-tag`)."
  - bildpaar-weiche:
      switch:
        - rot:
            when: ${ $context.bildpaar.red != false }
            then: bild-eskalation
        - gruen:
            then: continue
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Control flow - a red or missing picture pair goes to `bild-eskalation` (the person completes the model pictures), never on to the verdict; only `red == false` goes on to `picture-ok`."
  - frontend-nur-komponenten:
      call: frontend-nur-komponenten:0.0.13@fs
      with:
        frontend_crate: ${ .input.frontend_crate }
      export:
        as: '${ $context + { komponenten: . } }'
      metadata:
        freesynergy.net:actor: ai
        freesynergy.net:actor-type: Application
        freesynergy.net:gate: opus-ja
        freesynergy.net:kind: subjective
        freesynergy.net:summary: "Review template frontend (rule of the user, lane 3): the frontend crate (input `frontend_crate`) contains ONLY the plugging together of components from fs-components plus theme, style, menu tree and texts: no logic, no own widgets, no data conversion. A new widget or logic is a FINDING (result `befunde`, each with file and line): a missing component is built in fs-components (or the nearest existing component stands in, marked \"vorläufig\"), logic belongs into the program or the modules through the contract. Until the frontend is a description (manifest / forms kit, read at run time) the plug-together code is a transition. Opus reads only the crate and writes the findings; it changes nothing."
  - frontend-nur-komponenten-weiche:
      switch:
        - runden:
            when: '${ $context.komponenten.befunde != null and ($context.komponenten.befunde | length) > 0 and ($context.komponenten.runde // 0) >= 3 }'
            then: grundfassung-eskalation
        - befund:
            when: '${ $context.komponenten.befunde != null and ($context.komponenten.befunde | length) > 0 }'
            then: frontend-befund-talk
        - sauber:
            when: '${ $context.komponenten.befunde != null and ($context.komponenten.befunde | length) == 0 }'
            then: picture-ok
        - ohne-ergebnis:
            then: grundfassung-eskalation
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Control flow - a finding goes to the conversation `frontend-befund-talk` (at most two repeats, then the escalation); only an empty list (not a missing result) goes on; a missing result goes to the escalation, never on."
  - frontend-befund-talk:
      call: talk:0.0.13@fs
      with:
        frontend_crate: ${ .input.frontend_crate }
        befunde: ${ $context.komponenten.befunde }
      then: frontend-nur-komponenten
      metadata:
        freesynergy.net:actor: human
        freesynergy.net:actor-type: Person
        freesynergy.net:gate: human
        freesynergy.net:kind: subjective
        freesynergy.net:summary: "Conversation of the user and Opus about every finding (logic or widget in the frontend crate): move it into fs-components or into the program, or decide otherwise; the protocol `talk-<programm>-frontend-<datum>.md` holds the decision. No agent decides it alone. Then the check runs again."
  - picture-ok:
      run:
        workflow:
          namespace: freesynergy.net
          name: picture-acceptance
          version: 0.0.13
        input:
          dossier: ${ .input.dossier }
          model: ${ $context.features.vorbild }
          ours: ${ $context.images }
          waechter: ${ $context.waechter }
          paare: ${ $context.bildpaar }
      export:
        as: '${ $context + { verdict: . } }'
      metadata:
        freesynergy.net:actor: ai
        freesynergy.net:actor-type: Application
        freesynergy.net:gate: none
        freesynergy.net:kind: subjective
        freesynergy.net:summary: "No picture OK of the user is needed (decision b7, 17 Nov.): the STRATEGY looks at the pictures (window, main view and documentation picture, side by side with the model as a pair with the same filter and state, `bildpaar`, the `dossier` handed over like in `frontend-round`) and gives the verdict; the result is `accepted`. Pictures without a green `waechter` (`red == false`) are no evidence. Without a verdict the flow does not go on."
  - bild-zaehlen:
      set:
        n: ${ ($context.bild_runde.n // 0) + 1 }
      export:
        as: '${ $context + { bild_runde: . } }'
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "The flow counts the picture rounds itself (`picture-acceptance` delivers no `runde`): `bild_runde.n` in the context, +1 for each verdict; `bild-weiche` reads it."
  - bild-weiche:
      switch:
        - accepted:
            when: '${ $context.verdict.accepted == true }'
            then: continue
        - runden:
            when: '${ $context.verdict.accepted == false and ($context.bild_runde.n // 0) >= 3 }'
            then: grundfassung-eskalation
        - not-accepted:
            when: '${ $context.verdict.accepted == false }'
            then: fenster
        - no-verdict:
            then: bild-eskalation
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Control flow - ONLY `accepted == true` goes on to `katalog-vorschlag`; `accepted == false` goes back to `fenster` (from the third round, `bild_runde` >= 3, to `grundfassung-eskalation`) with the words of the strategy as the order (gap list); anything else (no verdict, e.g. `dossier-menue-fehlt`, `menue-bild-fehlt`) goes to `bild-eskalation`, never on."
  - katalog-vorschlag:
      call: catalog-proposal-ai:0.0.13@fs
      with:
        programm: ${ .input.programm }
        beschreibung: ${ .input.beschreibung }
        tag: ${ .input.tag }
      metadata:
        freesynergy.net:actor: ai
        freesynergy.net:actor-type: Application
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Sonnet - a DIFF for fs-catalog (two entries, program and frontend; for `art: grundfassung` the description and the README say \"Contract: draft\"; with `kind = frontend` and `requires` = the capability; schema 1 until fs-packages 0.0.19, description en and de), written as a patch file in the report; it is NOT pushed. The catalog change itself is `catalog-bump` after the release."
  - zusammenfassung:
      call: summary-ai:0.0.13@fs
      with:
        programm: ${ .input.programm }
        was_kommt: ${ $context.features.was_kommt }
        art: ${ .input.art }
        tag: ${ .input.tag }
      export:
        as: '${ $context + { zusammenfassung: . } }'
      metadata:
        freesynergy.net:actor: ai
        freesynergy.net:actor-type: Application
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Sonnet - the result of the run: `was_kommt` (from `feature-liste`, `$context.features.was_kommt`, no own input), the gap list \"Lücken\" (every stand-in component marked \"vorläufig\" with the name of the missing real component; no PNG placeholder), the contract state (draft or locked), the version = tag (versions may currently jump, e.g. the basics directly v0.0.2; later no longer; the user announces it) and the verdict of the strategy, the state of the main view (preview marker, picture pairs `main` and `main-empty`) and the bundle answer. Honest: what is only a stand-in is said as such."
  - release-sperre:
      switch:
        - ohne-sperre:
            when: ${ .input.art != "grundfassung" and $context.vertrag.sperre != true }
            then: end
        - mit-sperre:
            then: continue
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Control flow (decision of the strategy, aim: visibility) - input `art` is `grundfassung` or `feature`. A BASICS release (only window, \"what comes\" and documentation; stores and exchanges no data over the contract) may release as v0.0.x (e.g. v0.0.2) WITHOUT the lock: the contract is then a draft (`vertrag.status = entwurf`), marked visibly in the README (line \"Contract: draft\") and in the catalog description (`katalog-vorschlag`). A FEATURE release (stores or exchanges data over the contract) needs the lock file `sperren/<programm>_v1.sha256`; without it, or without a result, the flow ends (red, never green, the person decides). Reason: a lock before data flows over the contract protects nothing yet, while a visible first release is the aim."
  - vor-tag:
      call: pre-tag-check:0.0.13@fs
      with:
        repo: ${ .input.repo }
        branch: ${ .input.branch }
        head: ${ .input.head }
        verdict: ${ $context.verdict }
        bildpaar: ${ $context.bildpaar }
      export:
        as: '${ $context + { vor_tag: . } }'
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Before ANY tag: (1) the branch CI of ALL workflows (also Windows where it exists) is green on exactly this head - checked, not assumed; (2) every condition of the Opus review (also of the Nachblick, delta look) is resolved: NO tag with an open condition (lesson messages v0.0.3); (3) for `art: feature` the lock `release_frei` is there; (4) the picture OK of the strategy (b7) on the picture pairs of the main view is there (`bildpaar`, `picture-ok`): no tag without it: this step is RED when `verdict.accepted != true` or `bildpaar.red != false` (both are handed over in `with`, not only named here). The result is `red` or not; a missing result is never green."
  - vor-tag-weiche:
      switch:
        - rot:
            when: ${ $context.vor_tag.red != false }
            then: end
        - gruen:
            then: continue
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Control flow - `red` or a missing result ends the flow here (the person decides); only `red == false` goes on to the release."
  - buendel-frage:
      call: ask:0.0.13@fs
      with:
        programm: ${ .input.programm }
        tag: ${ .input.tag }
        frage: "Bundle complete? Otherwise keep collecting."
      export:
        as: '${ $context + { buendel: . } }'
      metadata:
        freesynergy.net:actor: ai
        freesynergy.net:actor-type: Application
        freesynergy.net:gate: none
        freesynergy.net:kind: subjective
        freesynergy.net:summary: "Decision question to the STRATEGY before every release ([BUENDEL-RELEASE], b7 17 Nov.): \"Bundle complete? Otherwise keep collecting.\" The question names the content of the bundle - the functions, the fixes and the dependencies (pins) that go out with this tag; at most ONE release per program and day. The answer is `buendel` with `vollstaendig` (true/false) and `blocker` (true only for a blocker for the user: program does not start, data loss, security). Every release costs CI time and a signing release of the user. No answer is no yes."
  - buendel-weiche:
      switch:
        - blocker:
            when: ${ $context.buendel.blocker == true }
            then: continue
        - vollstaendig:
            when: ${ $context.buendel.vollstaendig == true }
            then: continue
        - sammeln:
            then: buendel-sammeln
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Control flow - a complete bundle or a blocker goes on to the release; everything else (bundle not complete, no answer) goes to `buendel-sammeln`: keep collecting, NO tag. A single release only for a blocker."
  - release:
      then: end
      run:
        workflow:
          namespace: freesynergy.net
          name: release-flow
          version: 0.0.13
        input:
          repo: ${ .input.repo }
          tag: ${ .input.tag }
          prerelease: true
          delta: ${ .input.delta }
          docs: ${ .input.docs }
          docs_base: ${ .input.docs_base }
          old: ${ .input.old }
          new: ${ .input.new }
          allow: ${ .input.allow }
      metadata:
        freesynergy.net:actor: human
        freesynergy.net:actor-type: Person
        freesynergy.net:gate: human
        freesynergy.net:kind: objective
        freesynergy.net:summary: "release-flow.yaml holds the ONE Opus review of this head (bound to exactly this head, green branch CI of all workflows first), then tag, CI, release; for `art: feature` the trait lock `release_frei` must be there first (`vertrag-standard`, `release-sperre`); a basics release may go out with the draft contract; push and tag only through the flow `ff-und-tag` (until that file exists: the steps of `release-flow`), the tag only after the review YES (and the open Opus conditions resolved, `vor-tag`) through the strategy's helper, never by an agent. Versions may currently jump (the basics directly v0.0.2); version = tag. There is no second review here."
  - buendel-sammeln:
      set:
        todo: buendel-sammeln
      then: end
      metadata:
        freesynergy.net:actor: human
        freesynergy.net:actor-type: Person
        freesynergy.net:gate: human
        freesynergy.net:kind: subjective
        freesynergy.net:summary: "The bundle is not complete (rule [BUENDEL-RELEASE]): the work stays on the collecting branch (branch chain), Opus reviews each part as before, nothing is tagged; the next functions and fixes are collected and the question `buendel-frage` is asked again at the next head. This flow ends."
  - bild-eskalation:
      set:
        todo: bild-eskalation
      then: end
      metadata:
        freesynergy.net:actor: human
        freesynergy.net:actor-type: Person
        freesynergy.net:gate: human
        freesynergy.net:kind: subjective
        freesynergy.net:summary: "The strategy gave no verdict on the pictures (or the dossier menu tree or a picture pair is missing): the person completes the dossier or the missing pictures; nothing is released. This flow ends."
  - grundfassung-eskalation:
      set:
        todo: grundfassung-eskalation
        status: escalated
        eskaliert: true
      then: end
      metadata:
        freesynergy.net:actor: human
        freesynergy.net:actor-type: Person
        freesynergy.net:gate: human
        freesynergy.net:kind: subjective
        freesynergy.net:summary: "Escalation after the third red round (`runde` >= 3) of the gates or of the picture verdict: the person decides how to go on; nothing is released. This flow ends."
