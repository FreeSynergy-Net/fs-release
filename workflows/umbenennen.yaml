# Rename a program: repo, crates (fs-<x>-*), catalog entry with `replaces`, docs, pins in other repos (ADR 0080, ADR 0063, ADR 0077).
# The old name is never given out again (scripts/retired-names.txt). Everything up to the approval gate is reversible work in worktrees
# and branches; the GitHub rename is a step of its own, only after the approval gate (strategy OK for exactly this head). The dry run
# (`trockenlauf`) and the after-check run without AI and without network. Agents never push, tag, merge, rename or delete a repo.
# Order: `Workflow umbenennen, step <id>, parameters old, new, repos, catalog, docs, docs_base, allow, retired, branch, delta, tag`
# (docs/prompt-template.md). FS profile: see README.md.
# Inputs docs, docs_base, old, new (as lists), allow, delta are passed on to release-flow (step `doku`, rule doku-mitziehen).
# Input keep (JSON, L2): list of {pattern, grund, bereich} for the names that stay on purpose (bereich: Typ, Vertrag, Capability-ID, PROGRAM, MIME, Seitenpfad, sonstiges); checked by trockenlauf and nachher.
# The head under review is NOT an input: it is resolved after the gates (step `head`); review, approval (`freigabe`) and the rename are bound to exactly this hash, the plan approval to the pair old -> new (subject of the event).
# Order of the end: gates, head, review (NO goes back to `umbau`), approval for this head, code merge, GitHub rename, docs merge (only after the rename), switch the remotes, redirect check, catalog with `replaces` (own LAST step `katalog`), release.
# Marks: "(Spezifikation, Skript folgt)" = the script part does not exist yet (step `lock`, the lock part of `rename`, the FS_<X>_* environment variables); the rest (--keep, --world, `rename` scaffold, `id=` in the catalog) runs in scripts/umbenennen.
document:
  dsl: 1.0.3
  namespace: freesynergy.net
  name: umbenennen
  version: 0.0.16
  title: Rename a program - repo, crates, catalog with replaces, docs, pins - the old name is never given out again
do:
  - trockenlauf:
      call: rename-dry-run:0.0.16@fs
      with:
        old: ${ .input.old }
        new: ${ .input.new }
        repos: ${ .input.repos }
        catalog: ${ .input.catalog }
        docs: ${ .input.docs }
        retired: ${ .input.retired }
        keep: ${ .input.keep }
        allow: ${ .input.allow }
      export:
        as: '${ $context + { plan: . } }'
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Script `scripts/umbenennen dry-run` (Python, no network, no AI, reads only) - lists the crates `<old>-*` with their new names, CI files, pins in other repos, the catalog entry and the hits in the docs; RED when the new name was given up before (retired list), the old name is already retired, the new name already exists as a checkout or a catalog entry, or a name is not of the form fs-<x>. Self test `scripts/test_umbenennen.sh`. Red stops the flow before anything is changed. (L2) `keep` is a JSON list of objects `{pattern, grund, bereich}`: `pattern` is the word pattern that stays on purpose, `grund` is the reason in one line, `bereich` is one of `Typ`, `Vertrag`, `Capability-ID`, `PROGRAM`, `MIME`, `Seitenpfad`, `sonstiges`. Example (valid JSON): `[{\"pattern\": \"history.*\", \"grund\": \"Capability-IDs gehoeren zum Vertrag in fs-interfaces, eigener Beschluss noetig\", \"bereich\": \"Capability-ID\"}]`. The dry run lists every hit of the old name that no `pattern` covers as an open point; a `pattern` that matches nothing in the tree is RED (a stale entry), so `bewusst belassen` is checked by the machine. (L3) The search covers every `/srv/FreeSynergy/fs-*` checkout on `origin/main` (not only the old repo and the docs), so repos that name the old program (fs-interfaces, fs-hub, fs-release) are found. (L4) `allow` is a setting of the flow: the pages that may keep the old name as a record (e.g. `docs/*/conventions/*`, `docs/*/temp/thread-r/*`, `docs/*/temp/research/*`, `docs/*/todo/*`; accepted ADRs are NOT rewritten and are named in the ADR status line instead); only files tracked in git on the head count. `docs/*/decisions/` is generated and ignored by `.gitignore`, its copies are not counted, so the 60 hits of a plain grep are not the number of open points."
  - plan-red:
      switch:
        - red:
            when: '${ $context.plan.red != false }'
            then: end
        - green:
            then: continue
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Control flow - a red dry run ends the flow (the person changes the plan or the names); so does a run without a result (bad input, rc 2, `red` is null or missing): only `red == false` goes on."
  - plan-gate:
      listen:
        to:
          one:
            with:
              type: net.freesynergy.approval
              subject: ${ .input.old + "->" + .input.new }
      metadata:
        freesynergy.net:actor: human
        freesynergy.net:actor-type: Person
        freesynergy.net:gate: strategie-ok
        freesynergy.net:kind: subjective
        freesynergy.net:summary: The plan of the dry run (crates, files, pins, catalog, docs) is looked at and accepted by the strategy before any file is changed; the approval event must carry the subject `<old>-><new>` (exactly this plan), an approval for anything else does not open the gate. The first run of a rename also needs the user's yes for the rename (ADR 0080 F1).
  - umbau:
      call: rename-ai:0.0.16@fs
      with:
        old: ${ .input.old }
        new: ${ .input.new }
        repos: ${ .input.repos }
        branch: ${ .input.branch }
      metadata:
        freesynergy.net:actor: ai
        freesynergy.net:actor-type: Application
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "In the worktree branch of the program (not in main) - crates `<old>-*` become `<new>-*` (Cargo.toml, imports, binary names, the link of the old binary name if ADR 0063 asks for it), CI files (release, typing-test, windows), release chain allowlist, package names; the catalog entry of the new name with `replaces = [old]` (ADR 0080, schema 2) in a branch of fs-catalog; pins in other repos only on the new tag (a later run, never a path dependency). Only what the plan lists. Own worktree, local commits ([COMMIT]), no push, no tag, no rename of a GitHub repo; gates one at a time ([GATES], [BASH]); report per [BERICHT]. (L1) Write mode (the scaffold `scripts/umbenennen rename` exists, honours `--allow`, refuses a dirty tree and leaves pin URLs `github.com/FreeSynergy/<old>` alone until step `pins`; its lock part and the FS_<X>_* environment variables are (Spezifikation, Skript folgt): the env form is only reported and not replaced, it is a decision of its own via `keep`), in this order and only with the script (not by hand): `git mv` of the crate folders `crates/<old>-*` to `crates/<new>-*`; replacement of `<old>-` and `<old>_` with word boundary in `*.toml`, `*.rs`, `*.md` and `Cargo.lock` (the `keep` entries are skipped); the lock is renamed with the crates; then `cargo metadata --locked` (step `lock` below, (Spezifikation, Skript folgt)). (L5) CI comments: in `.github/workflows/release.yml` (and the other CI files) the comments that name the old program are renamed too, otherwise the next reader finds the old name again; a branch with open work in the repo (e.g. `r4-admin`) is brought to main first (a human step, not this one)."
  - lock:
      call: rename-lock-check:0.0.16@fs
      with:
        branch: ${ .input.branch }
      export:
        as: '${ $context + { lock: . } }'
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "(Spezifikation, Skript folgt - the script step `lock-check` does not exist yet.) (L1) Runs `cargo metadata --locked` in the worktree branch after `umbau` (the lock file must match the renamed crates without an update; `--locked` fails on any needed change). Reports `red`, `runde` (red rounds counted by the script in its state file, rc 3 from the third red round) and the lines of cargo. Build through `/srv/FreeSynergy/.scratch/build-slot.sh cargo metadata --locked` ([GATES]). Not a test of the program: it checks only the names and the lock."
  - lock-weiter:
      switch:
        - runden:
            when: '${ $context.lock.red != false and ($context.lock.runde // 0) >= 3 }'
            then: eskalation
        - rot:
            when: '${ $context.lock.red != false }'
            then: umbau
        - gruen:
            then: continue
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Control flow - a red lock check goes back to `umbau` with the cargo lines (the write mode is run again on the same branch, the script is idempotent: names already renamed are a no-op); from the third red round (`runde`) the flow ends in `eskalation`; only `red == false` goes on. A run without a result is not green."
  - sperre:
      call: rename-retire:0.0.16@fs
      with:
        old: ${ .input.old }
        new: ${ .input.new }
        retired: ${ .input.retired }
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: Script `scripts/umbenennen retire` writes `<old> -> <new>` into scripts/retired-names.txt (a local commit that goes through the same review; written before `nachher` so the checked head carries it, in effect only at the end, with the merge of fs-release, i.e. geschrieben vor nachher, wirksam am Schluss); the old name is never given out again, the same pair again is a no-op (the loops back to `umbau` run this step again), any other entry for the old name is refused. (L5) A new repo with the old name must never exist again (it would take over the GitHub redirect); the retired list covers that, and the other fs-* repos that still name the old program (found by the search of `trockenlauf`, e.g. fs-interfaces, fs-hub, fs-release) are cleaned up before this step, otherwise the after-check is RED.
  - doku:
      run:
        workflow:
          namespace: freesynergy.net
          name: doku-mitziehen
          version: 0.0.16
        input:
          repo: ${ .input.repos[0] }
          branch: ${ .input.branch }
          delta: ${ .input.delta }
          docs: ${ .input.docs }
          docs_base: ${ .input.docs_base }
          old: ${ [.input.old] }
          new: ${ [.input.new] }
          allow: ${ .input.allow }
      export:
        as: '${ $context + { doku: . } }'
      metadata:
        freesynergy.net:actor: ai
        freesynergy.net:actor-type: Application
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: Sub-workflow doku-mitziehen.yaml - the docs in fs-documentation (de and en, links, pages, ADR status lines; ADR texts are not rewritten, `allow` names the history pages) move in the same run, grep for the old name, `mkdocs build --strict`, check-docs; a rename without the docs is RED.
  - doku-weiter:
      switch:
        - eskaliert:
            when: '${ $context.doku.eskaliert == true or $context.doku.status != "green" }'
            then: eskalation
        - weiter:
            then: continue
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Control flow - the sub-workflow doku-mitziehen ended with `eskaliert` or without `status == green` (red three times, a check skipped): the person decides, this flow does NOT go on to its review. Only green goes on."
  - nachher:
      call: rename-after:0.0.16@fs
      with:
        old: ${ .input.old }
        new: ${ .input.new }
        repos: ${ .input.repos }
        catalog: ${ .input.catalog }
        docs: ${ .input.docs }
        retired: ${ .input.retired }
        keep: ${ .input.keep }
        allow: ${ .input.allow }
      export:
        as: '${ $context + { after: . } }'
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Script `scripts/umbenennen after` - RED when the old name is still in a crate name, in `.github/`, in a pin or in the docs (outside the allowed history pages), when the catalog entry of the new name has no `replaces`, or when the old name is not on the retired list. (L2) Every `pattern` of `keep` still matches the tree as the dry run saw it; a kept name that changed or vanished is RED (the list of `keep` is the same format as in `trockenlauf`). The result carries `red` and `runde` (red rounds counted by the script in its state file, rc 3 from the third red round); the third red round goes to `eskalation`."
  - nachher-again:
      switch:
        - runden:
            when: '${ ($context.after.red and ($context.after.runde // 0) >= 3) }'
            then: eskalation
        - red:
            when: '${ $context.after.red == true }'
            then: umbau
        - green:
            when: '${ $context.after.red == false }'
            then: continue
        - ohne-ergebnis:
            then: eskalation
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: Control flow - red goes back to `umbau` with the lines of the check, from the third red round the flow ends in `eskalation`; a run without a result is not green and goes to `eskalation` too.
  - gates:
      call: repo-gates:0.0.16@fs
      export:
        as: '${ $context + { gates: . } }'
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: The gates of every changed repo, once per head (scripts/gates.sh on a fresh clone; the checks of the catalog schema for the `replaces` field); the order is after the check of the names, so a red gate never hides a name leftover.
  - gates-again:
      switch:
        - runden:
            when: '${ $context.gates.red and ($context.gates.runde // 0) >= 3 }'
            then: eskalation
        - red:
            when: '${ $context.gates.red }'
            then: umbau
        - green:
            then: continue
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: Control flow - red goes back to `umbau`, the third red round ends in `eskalation`.
  - head:
      call: resolve-head:0.0.16@fs
      with:
        branch: ${ .input.branch }
      export:
        as: '${ $context + { kopf: . } }'
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: Resolves the branch to the commit hash of its tip (git rev-parse, read only) AFTER `umbau`, `sperre`, `doku` and the gates - the commits of those steps are in it. From here on only this hash counts (review, approval, merge), never the branch name; a new commit means a new `head` and a new review.
  - review:
      run:
        workflow:
          namespace: freesynergy.net
          name: review
          version: 0.0.16
        input:
          repo: ${ .input.repos[0] }
          branch: ${ .input.branch }
          head: ${ $context.kopf.head }
          delta: ${ .input.delta }
      export:
        as: '${ $context + { review: . } }'
      metadata:
        freesynergy.net:actor: ai
        freesynergy.net:actor-type: Application
        freesynergy.net:gate: opus-ja
        freesynergy.net:kind: subjective
        freesynergy.net:summary: Sub-workflow review.yaml for exactly the head hash of step `head` (`$context.kopf.head`, resolved after the gates, never a branch name) - the JA is bound to this hash by `bind`; a new head makes it void.
  - review-again:
      switch:
        - rounds:
            when: '${ $context.review.verdict == "NEIN" and ($context.review.runde // 0) >= 3 }'
            then: eskalation
        - nein:
            when: '${ $context.review.verdict != "JA" }'
            then: umbau
        - ja:
            then: continue
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: Control flow - a NO (or no clear JA) goes back to `umbau` with the findings of BERICHT.md as the order and a new head after `gates`/`head`; from the third NO (`runde` of review.yaml) the flow ends in `eskalation`. Only a JA for this head goes on to the approval.
  - freigabe:
      listen:
        to:
          one:
            with:
              type: net.freesynergy.approval
              subject: ${ $context.kopf.head }
      metadata:
        freesynergy.net:actor: human
        freesynergy.net:actor-type: Person
        freesynergy.net:gate: strategie-ok
        freesynergy.net:kind: subjective
        freesynergy.net:summary: The approval gate before the GitHub rename - the strategy OK (approval file, event with the subject `$context.kopf.head`) for exactly this head (and this pair old -> new, bound by the plan approval); an approval of another head or subject does not open it; without it nothing is renamed, merged or pushed. The dry run (step `trockenlauf`) can be run alone at any time; it changes nothing and needs no approval.
  - merge:
      call: merge-ff:0.0.16@fs
      with:
        into: main
      metadata:
        freesynergy.net:actor: human
        freesynergy.net:actor-type: Person
        freesynergy.net:gate: human
        freesynergy.net:kind: objective
        freesynergy.net:summary: The human or the coordinator fast-forwards main of the program and of the repos with changed pins to the approved head (NOT fs-catalog, that is the own last step `katalog`) (no merge commit, never forced); only after the approval for exactly this head; agents never do. (L5) Before it, the human pushes both branches (program and docs, `unreviewed/...` branches named in the plan) - the push is a human step, not an agent step. The rename on GitHub below runs on this state of main. Order after the umbau (strategy) - code merge (this step), GitHub rename, docs merge, switch the remotes, catalog with replaces, name lock in effect.
  - github-umbenennen:
      call: rename-github:0.0.16@fs
      with:
        old: ${ .input.old }
        new: ${ .input.new }
      metadata:
        freesynergy.net:actor: human
        freesynergy.net:actor-type: Person
        freesynergy.net:gate: strategie-ok
        freesynergy.net:kind: objective
        freesynergy.net:summary: The human or the coordinator renames the repo on GitHub (tags, releases, issues and the redirect stay) after the approval above and after the step `merge` (main is on the approved head); a placeholder repo of the new name is saved and removed or archived first (ADR 0080 F1, only with the user's yes). Agents never do this. (L5) The docs step below is only after this step (otherwise the links 404); the local remotes are switched in the own step `remotes` after the docs merge.
  - doku-veroeffentlichen:
      run:
        workflow:
          namespace: freesynergy.net
          name: publish-doc
          version: 0.0.16
      metadata:
        freesynergy.net:actor: human
        freesynergy.net:actor-type: Person
        freesynergy.net:gate: human
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Sub-workflow publish-doc.yaml - rebase, generate and fast-forward push of the docs main branch by the coordinator or the human, only AFTER the review (opus-ja) and the approval of the code, together with its merge; never before, never forced; the agent never pushes. (L5) Doku-Merge erst NACH der GitHub-Umbenennung (`github-umbenennen`): davor zeigen die Links auf github.com/FreeSynergy/<new> und liefern 404 (mkdocs --strict prueft externe Links nicht). Reihenfolge nach dem Umbau (Strategie): Code-Merge (`merge`), GitHub-Umbenennung, Doku-Merge (hier), danach lokale Remotes umstellen (`remotes`), dann Katalog mit replaces (`katalog`, letzter Schritt)."
  - remotes:
      call: rename-remotes:0.0.16@fs
      with:
        old: ${ .input.old }
        new: ${ .input.new }
        repos: ${ .input.repos }
      metadata:
        freesynergy.net:actor: human
        freesynergy.net:actor-type: Person
        freesynergy.net:gate: human
        freesynergy.net:kind: objective
        freesynergy.net:summary: "(L5) After the GitHub rename and after the docs merge the local remotes are switched (`git remote set-url origin` to the new URL, in every checkout of the changed repos); the old URL redirects, the new one is the truth. Human or coordinator, never an agent."
  - pins:
      call: rename-pins:0.0.16@fs
      with:
        old: ${ .input.old }
        new: ${ .input.new }
        repos: ${ .input.repos }
        allow: ${ .input.allow }
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Script `scripts/umbenennen rename --pins` (it runs only now, AFTER the GitHub rename and the remotes): replaces the pin URLs `github.com/FreeSynergy/<old>` by `<new>` in the repos that carry pins (`--allow` keeps history pages, a dirty tree is refused). The normal `rename` of `umbau` leaves these URLs as they are, because before the GitHub rename the new URL would 404. The change is a local commit in its own branch and goes through a short review and a human fast-forward like every other change; agents never push."
  - weiterleitung:
      call: rename-redirect-check:0.0.16@fs
      with:
        old: ${ .input.old }
        new: ${ .input.new }
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Read only - `git ls-remote` on the old and the new URL answers with the same refs (clone redirect). NOT proven: the redirect of release assets after the rename (ADR 0080, open) - the first release as the new name downloads from the new URL."
  - katalog:
      call: merge-ff:0.0.16@fs
      with:
        into: main
        repo: ${ .input.catalog }
      metadata:
        freesynergy.net:actor: human
        freesynergy.net:actor-type: Person
        freesynergy.net:gate: human
        freesynergy.net:kind: objective
        freesynergy.net:summary: "(L5) The own LAST step of the rename order: the human or the coordinator fast-forwards main of fs-catalog (the entry of the new name with `replaces = [old]`, ADR 0080) to the approved head, only after the GitHub rename, the docs merge, the remotes and the redirect check; before that the release URL and `replaces` in the catalog would point to a 404. Then the name lock (`sperre`, already in the checked head) is in effect with the merge of fs-release. Never forced; agents never do."
  - release:
      run:
        workflow:
          namespace: freesynergy.net
          name: release-flow
          version: 0.0.16
        input:
          repo: ${ .input.new }
          tag: ${ .input.tag }
          prerelease: true
          delta: ${ .input.delta }
          docs: ${ .input.docs }
          docs_base: ${ .input.docs_base }
          old: ${ [.input.old] }
          new: ${ [.input.new] }
          allow: ${ .input.allow }
      metadata:
        freesynergy.net:actor: human
        freesynergy.net:actor-type: Person
        freesynergy.net:gate: human
        freesynergy.net:kind: objective
        freesynergy.net:summary: "The first release as the new name (next tag of the same count, ADR 0064) runs through release-flow.yaml with its own review; the catalog shows the new entry as an update of the old one (`replaces`); user data is copied, never moved. MANDATORY after the merge: the SHA of `FreeSynergy/fs-release/...@<sha>` in release.yml, ci.yml and check.yml is raised to the merge commit in a second reviewed commit (scripts/pin-refs.sh), see docs/usage.md."
  - eskalation:
      set:
        todo: umbenennen-eskalation
      then: end
      metadata:
        freesynergy.net:actor: human
        freesynergy.net:actor-type: Person
        freesynergy.net:gate: human
        freesynergy.net:kind: subjective
        freesynergy.net:summary: "A check was red for the third time: the loop stops and the person decides. Nothing was renamed on GitHub. The report names the step and the last red lines. This flow ends."
