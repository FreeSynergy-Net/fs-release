# One request to an upstream project (an issue). The text is drafted by the agent, the person approves and chooses the channel, a script
# sends it or the person writes it themselves. Blinc: NO AI attribution in issue, PR or commit; no new Blinc PR without asking the user.
# Rule of the Blinc permission (98): a request to Blinc goes through git-bug in OUR repo WITHOUT asking the user, but only when it is PROVEN (reproduction or source), the DUPLICATES are checked (the tracker of the upstream, read only), the
# text is ENGLISH, has NO AI words and NO addresses or personal data, and carries the git-bug id. NEVER a pull request and NEVER a comment in a foreign issue or thread. Other upstreams keep the approval of the person (step `approval`).
# The agent only prepares the text and the git-bug id; the helper of the strategy sends (agents never call gh or a browser login). Loops are counted: from the third round (`runde` >= 3) `eskalation`.
# Agents never push to our repos, tag or merge. Order: `Workflow upstream-anfrage, step draft, parameters upstream, evidence, art, absender` (required, otherwise held back; optional: `nachfrage`, `bedingung`, `erstkontakt_datei`). FS profile: see README.md.
# TEXTS TO THE OUTSIDE (mandatory for EVERY text that leaves us: issue, PR text, mail, request to Blinc or another upstream; other workflows point here):
# (a) read the rules of the target (CONTRIBUTING, AI stance, issue template) and cite the place (`ziel-regeln-lesen`); (b) INFORM, do not advertise, do not nag (decision of the user, 23.11.2026):
# the AI note stands CLEARLY ONCE at the FIRST contact with a project, as ONE honest sentence or short paragraph inside the text (never a signature, trailer or footer); afterwards only where it makes sense
# (code contribution, pull request or crate; the rules of the target ask for it; somebody asks). Never hidden when asked, never denied. The memory is ONE list, `workflows/upstream-erstkontakt.txt` (one line per
# target project: first contact date, source, reaction; step `erstkontakt-lesen`; `erstkontakt-vermerken` sets or updates it after the text was SENT). `ki-haltung-weiche` decides by that entry. A target that
# rejects AI contributions (example: Kanidm) gets a DRAFT prepared (copy block + preview), but agents and bot NEVER send there: the human sends (user decision 23.11.2026; `send` is blocked by its `if:`). (b2) WHO sends is named in the order (`absender`: `mensch` | `bot`). The FIRST contact
# is drafted by the agent, read against and sent by the human, in the voice of the user (the bot never sends it). From the second contact on the bot (Claude) usually writes and sends itself: then the sender is OPENLY the bot and the text is NEVER in the voice of the
# user. The bot sends only where that is allowed (Blinc: rule 98, git-bug; a target that refuses AI: never; Kanidm: agents and bot NEVER send, the user does; any other target only when its rules cited in `ziel.bot` allow a bot).
# (c) finished as a copy block in the format of the target; the LOOK is a mandatory gate: the preview in the target format is checked (`kopierblock`, `vorschau-weiche`), without a checked preview nothing goes to the user;
# (d) the sender reads it against and only then it goes out (gate human, when a human sends). An agent never sends itself except by (b2): only the sender `bot` at a target that allows it.
# Blinc and (d) (decision of the strategy): "the sender reads against" holds when a HUMAN is the sender (every other upstream: steps `approval`, `choose-channel`). At Blinc WE are
# the sender (bot) by THEIR rules and the permission (98) stays: no approval for the sender `bot` at Blinc; with `absender: mensch` the approval and the channel choice run at Blinc too. The steps (a) `ziel-regeln-lesen` and (c) `kopierblock` (format of the target) apply to Blinc too
# and are never skipped; the gates before them (rules, text gate, proof, duplicates) replace the reading-against there.
# PULL REQUEST (a contribution with a patch; this flow never sends one itself, the human does): step `pr-nach-antwort`. A PR leaves only when (a) the issue is ANSWERED (answer read, the rules of the upstream kept) or (b) the time limit
# has run out (`frist_tage`, default 14 days). Time limit without an answer = factual only: ONE follow-up question is allowed, never nag. The rules of the upstream go first; the AI note follows the rules of the target (steps `pr-ziel-regeln`, `pr-ki-weiche`, `pr-haltung-weiche`):
# openly in the text where `ki_hinweis` says so, BUT at Blinc NO AI attribution (house rule, line 2). The pull request goes through the SAME gates as an issue (rules read, duplicates, text gate, copy block with a checked preview; steps
# `pr-dubletten`, `pr-text-gate`, `pr-kopierblock`, `pr-vorschau-weiche`) and never gets less checking than an issue; sent only from the account of the user after their YES (gate human). Until then the PR stays red (`pr-wartet`). Optional parameters of a PR: `issue`, `frist_tage`, `pr_text`.
document:
  dsl: 1.0.3
  namespace: freesynergy.net
  name: upstream-anfrage
  version: 0.0.17
  title: Send one request to an upstream project by the channel the person chooses
do:
  - art-pruefen:
      call: request-kind:0.0.17@fs
      with:
        upstream: ${ .input.upstream }
        art: ${ .input.art }
      export:
        as: '${ $context + { art: . } }'
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Script - the kind of the request: only an `issue` (a question or a wish as a new issue). A pull request, a comment in a foreign issue or thread, a review or a reaction is red and is not sent by this flow. Result `art` with `red` and `art.art` (`issue` | `pr` | `comment` | other). A pull request is red HERE and goes to the step `pr-nach-antwort` (it is released only by answer or time limit and only the human sends it)."
  - art-weiche:
      switch:
        - pr:
            when: '${ $context.art.art == "pr" }'
            then: pr-nach-antwort
        - verboten:
            when: '${ $context.art.red != false }'
            then: abgelehnt
        - issue:
            then: continue
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Control flow - a pull request goes to `pr-nach-antwort` (red until the answer or the time limit, and only the human sends it); a comment or a missing result goes to `abgelehnt`; only `red == false` goes on to the proof."
  - ziel-regeln-lesen:
      call: target-rules:0.0.17@fs
      with:
        upstream: ${ .input.upstream }
      export:
        as: '${ $context + { ziel: . } }'
      metadata:
        freesynergy.net:actor: ai
        freesynergy.net:actor-type: Service
        freesynergy.net:bot-seat: upstream-anfrage.ziel-regeln-lesen
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "TEXTS TO THE OUTSIDE (a), mandatory for every outside text. The agent READS the rules of the target (CONTRIBUTING, code of conduct, AI or LLM stance, issue and PR template, the contributor notes in the README) read only, and cites the place of each finding (file and line or link, at the date read); no citation means not read. Result `ziel` with `ki` (`erlaubt`, `verlangt`, `ohne-vermerk` = the rules forbid an AI note in the text, as at Blinc, or `abgelehnt` = the target refuses AI contributions, as Kanidm), `bot` (`erlaubt` only when the cited rules allow a bot or an AI agent to write and send itself; silent rules or none = `nein`), `format` (the format of the target: template fields, language, length) and `fundstellen`. Silent rules count as `erlaubt`."
  - erstkontakt-lesen:
      call: first-contact-read:0.0.17@fs
      with:
        upstream: ${ .input.upstream }
        datei: ${ .input.erstkontakt_datei // "workflows/upstream-erstkontakt.txt" }
      export:
        as: '${ $context + { erstkontakt: . } }'
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Script (no AI), read only: finds the line of this target project in the ONE list `workflows/upstream-erstkontakt.txt` (`<owner>/<name> erstkontakt=<date> quelle=... reaktion=...`). Result `erstkontakt` with `vorhanden` (true only with a valid line), `datum` and `reaktion`. No line = first contact. An unreadable or malformed list gives `vorhanden: null`, which counts as NOT known (never a guess): the safe side applies, the sender is the human and the AI note stands."
  - ki-haltung-weiche:
      switch:
        - ki-nein:
            when: '${ $context.ziel.ki == null or $context.ziel.fundstellen == null or ($context.ziel.fundstellen | length) == 0 or (["erlaubt", "verlangt", "ohne-vermerk", "abgelehnt"] | index($context.ziel.ki)) == null }'
            then: ki-abgelehnt
        - weiter:
            then: continue
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Control flow (TEXTS TO THE OUTSIDE (a) and (b)) - no `fundstellen` (missing or empty: the rules count as NOT read), a missing `ziel` result or a `ki` value outside the fixed set `erlaubt | verlangt | ohne-vermerk | abgelehnt` goes to `ki-abgelehnt` (the rules are NOT read: nothing is prepared). A target that REJECTS AI contributions (`ki == abgelehnt`, Kanidm) is NOT stopped here (user decision 23.11.2026): the draft IS prepared up to the copy block and the preview, but afterwards ONLY the human sends it (`send` is blocked by its `if:`, the person uses `hand-text`). Only a cited result with a value of the set goes on. The AI note for the text is decided right after by `ki-hinweis` from the entry of `erstkontakt-lesen` (first contact: the note stands once, clearly; later only on a condition)."
  - ki-hinweis:
      call: ai-note-decide:0.0.17@fs
      with:
        erstkontakt: ${ $context.erstkontakt }
        ziel: ${ $context.ziel }
        nachfrage: ${ .input.nachfrage }
        bedingung: ${ .input.bedingung }
      export:
        as: '${ $context + { ki_hinweis: . } }'
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Script (no AI) (TEXTS TO THE OUTSIDE (b), decided by the entry of `erstkontakt-lesen`; no valid entry = FIRST contact). Result `ki_hinweis` (true or false) = the draft carries the AI note as ONE honest sentence or short paragraph: yes at the first contact, and later only when a condition holds - the rules of the target ask for it (`ziel.ki == verlangt`), somebody asked (`nachfrage`), or the text is a code contribution, pull request or crate (`bedingung` = code | pull-request | crate). Never for `ohne-vermerk` (Blinc: the rules forbid it there); never hidden when asked and never denied (the answer to a question is given by the sender). Nothing is sent by this step."
  - absender-weiche:
      switch:
        - bot-verboten:
            when: '${ .input.absender == "bot" and (.input.upstream == "kanidm" or $context.ziel.ki == "abgelehnt" or $context.erstkontakt.vorhanden != true or (.input.upstream != "blinc" and $context.ziel.bot != "erlaubt")) }'
            then: abgelehnt
        - absender-unklar:
            when: '${ (["mensch", "bot"] | index(.input.absender)) == null }'
            then: abgelehnt
        - weiter:
            then: continue
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Control flow (TEXTS TO THE OUTSIDE (b2)) - the order names WHO sends: `absender` = `mensch` | `bot`; a missing or other value is held back. The bot as sender is refused (`abgelehnt`) at the FIRST contact (the human writes and sends it), at Kanidm (agents and bot never send themselves), at a target that refuses AI, and at every target except Blinc whose cited rules (`ziel.bot`) do not allow a bot; Blinc stays allowed by rule 98 (git-bug). A text of the bot is openly the bot, never in the voice of the user."
  - belegen:
      call: prove-ai:0.0.17@fs
      with:
        upstream: ${ .input.upstream }
        evidence: ${ .input.evidence }
      export:
        as: '${ $context + { belegt: . } }'
      metadata:
        freesynergy.net:actor: ai
        freesynergy.net:actor-type: Service
        freesynergy.net:bot-seat: upstream-anfrage.belegen
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "The agent PROVES what the request says: a reproduction (steps, version, measured numbers) or the source (file and line at the pinned version and at upstream main); read only, in its own directory. Nothing unproven is asked or claimed. Result `belegt` with `belegt` (true only with a reproduction or a source) and the evidence."
  - belegt-weiche:
      switch:
        - unbelegt:
            when: '${ $context.belegt.belegt != true }'
            then: abgelehnt
        - belegt:
            then: continue
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Control flow - an unproven statement (or a missing result) is held back: `abgelehnt`; only `belegt == true` goes on to the duplicate search."
  - dubletten:
      call: search-duplicates-ai:0.0.17@fs
      with:
        upstream: ${ .input.upstream }
        belegt: ${ $context.belegt }
      export:
        as: '${ $context + { dubletten: . } }'
      metadata:
        freesynergy.net:actor: ai
        freesynergy.net:actor-type: Service
        freesynergy.net:bot-seat: upstream-anfrage.dubletten
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "The agent searches the tracker of the upstream (issues open and closed, by keywords of the request) READ ONLY: no login, no comment, no reaction, no new issue. A hit that says the same is a duplicate. Result `dubletten` with `treffer` (the list of hits with link) - the search and its keywords are named, never `none` without a search."
  - dubletten-weiche:
      switch:
        - doppelt:
            when: '${ $context.dubletten.treffer == null or ($context.dubletten.treffer | length) > 0 }'
            then: abgelehnt
        - neu:
            then: continue
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Control flow - a duplicate (the same request already stands in the tracker) or a missing result goes to `abgelehnt` with the link, no comment is written there; only an empty hit list (`treffer` present and empty) goes on."
  - ticket:
      call: git-bug-ticket:0.0.17@fs
      with:
        upstream: ${ .input.upstream }
        belegt: ${ $context.belegt }
      export:
        as: '${ $context + { ticket: . } }'
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Script - the request is a git-bug ticket in OUR repo (`git-bug` entry with labels kind and area); the id is returned and stands in the text and in the report. Nothing is sent to the upstream yet. Result `ticket` with `id`."
  - draft:
      call: draft-issue:0.0.17@fs
      with:
        upstream: ${ .input.upstream }
        evidence: ${ $context.belegt }
        ticket: ${ $context.ticket.id }
        ziel: ${ $context.ziel }
        ki_hinweis: ${ $context.ki_hinweis }
        absender: ${ .input.absender }
      export:
        as: '${ $context + { draft: . } }'
      metadata:
        freesynergy.net:actor: ai
        freesynergy.net:actor-type: Service
        freesynergy.net:bot-seat: upstream-anfrage.draft
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: The agent drafts the issue - short, friendly, English, backed by evidence (reproducer, version, measured numbers); title on the first line, a blank line, then the body; it names the git-bug id of the ticket; NO address or personal data, NO AI words except the one honest AI note below, no pull request, no comment in a foreign issue. TEXTS TO THE OUTSIDE (b) - INFORM, do not advertise, do not nag - when `ki_hinweis` is true (first contact, or a condition of `ki-hinweis`) the text states the AI help ONCE, clearly, as ONE honest sentence or short paragraph inside the text (what the AI did and that a human stands behind or answers) - never a signature, never a trailer, never a robot footer, no session link, never scattered; when `ki_hinweis` is false there is NO AI word (nothing is denied when somebody asks). Voice by `absender` - `mensch` is the voice of the user (we or I as the user would say it), `bot` is OPENLY the bot (Claude), never in the voice of the user, no pretence of a person; the format follows `ziel.format`.
  - rules:
      call: upstream-rules:0.0.17@fs
      with:
        upstream: ${ .input.upstream }
        draft: ${ $context.draft }
        ziel: ${ $context.ziel }
      export:
        as: '${ $context + { rules: . } }'
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: Script - reads the CLAUDE.md of the upstream clone (Blinc - /srv/FreeSynergy/blinc) and checks the draft against it AND against the rules and format cited in `ziel` (`ziel.fundstellen`, `ziel.format`, `ziel.ki`); for Blinc no Claude, Anthropic or AI mention, no Co-Authored-By, no session link, no robot footer; a new Blinc PR needs the user's question first. The result is `hits`, the list of broken rules.
  - text-gate:
      call: text-gate:0.0.17@fs
      with:
        draft: ${ $context.draft }
        ticket: ${ $context.ticket }
        ziel: ${ $context.ziel }
        ki_hinweis: ${ $context.ki_hinweis }
        absender: ${ .input.absender }
      export:
        as: '${ $context + { textcheck: . } }'
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Script - the text gate: the text is ENGLISH, has NO AI words (Claude, Anthropic, AI, LLM, model, agent, robot, bot footer) - except exactly ONE honest AI note (one sentence or short paragraph, not a signature or trailer) when `ki_hinweis` is true (a missing, repeated or scattered note, or any AI mention when `ki_hinweis` is false or `ziel.ki` is `ohne-vermerk`, is a hit); a text of `absender` bot in the voice of the user, or of `absender` mensch in the voice of the bot, is a hit -, NO e-mail address, no phone number, no personal data and no private path, and names the git-bug id; no Co-Authored-By, no session link. Result `textcheck` with `hits` (the broken points) and `runde` (+1 for each jump back from `back-to-draft`)."
  - back-to-draft:
      switch:
        - runden:
            when: '${ ($context.rules.hits == null or $context.textcheck.hits == null or ($context.rules.hits | length) > 0 or ($context.textcheck.hits | length) > 0) and ($context.textcheck.runde // 0) >= 3 }'
            then: eskalation
        - hits:
            when: '${ $context.rules.hits == null or $context.textcheck.hits == null or ($context.rules.hits | length) > 0 or ($context.textcheck.hits | length) > 0 }'
            then: draft
        - clean:
            then: continue
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: Control flow - a hit of `rules` or `text-gate` (a missing `hits` result counts as a hit) goes back to draft with the hits as the order, from the third round (`runde` >= 3) to `eskalation`; a clean draft goes on to the copy block (`kopierblock`) and the preview gate.
  - kopierblock:
      call: copy-block:0.0.17@fs
      with:
        draft: ${ $context.draft }
        format: ${ $context.ziel.format }
      export:
        as: '${ $context + { block: . } }'
      metadata:
        freesynergy.net:actor: ai
        freesynergy.net:actor-type: Service
        freesynergy.net:bot-seat: upstream-anfrage.kopierblock
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "TEXTS TO THE OUTSIDE (c). The agent sets the clean draft as ONE copy block in the format of the target (GitHub Markdown by default - title, short summary, steps to reproduce, expected / actual, version; the template fields of the target when it has one), with a rendered preview IN THE TARGET FORMAT checked for broken lists, fences, links and line breaks (the LOOK is a mandatory gate, `vorschau-weiche`). Result `block` with the copy block and the preview check (`vorschau_ok`); plain text, ready to paste, without any wrapper or note of ours inside it."
  - vorschau-weiche:
      switch:
        - ohne-vorschau:
            when: '${ $context.block == null or $context.block.vorschau_ok != true }'
            then: abgelehnt
        - geprueft:
            then: continue
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Control flow (TEXTS TO THE OUTSIDE (c), mandatory gate) - without a copy block whose preview in the target format was checked (`vorschau_ok == true`, a missing result counts as not checked) NOTHING goes to the user or on: `abgelehnt`."
  - blinc-kanal:
      call: blinc-channel:0.0.17@fs
      with:
        upstream: ${ .input.upstream }
      export:
        as: '${ $context + { channel: . } }'
      if: '${ .input.upstream == "blinc" and .input.absender == "bot" }'
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Script - for Blinc with the sender `bot` the channel is `git-bug` and nothing else, set by the rule of the Blinc permission (98): no approval of the user is asked for a proven, duplicate-free, English text without AI words (the gate above), no pull request, no comment. Result `channel`."
  - approval:
      call: approve:0.0.17@fs
      with:
        block: ${ $context.block }
      export:
        as: '${ $context + { freigabe: . } }'
      metadata:
        freesynergy.net:actor: human
        freesynergy.net:actor-type: Person
        freesynergy.net:gate: human
        freesynergy.net:kind: subjective
        freesynergy.net:summary: TEXTS TO THE OUTSIDE (d) - the SENDER (the user) reads the copy block `block` against the preview and the cited rules of the target, and gives the YES for exactly this text, beforehand; without it nothing is sent, a changed text needs a new YES. Result `freigabe` (`ja`); only `ja == true` lets a human sender go to `send`. The approval is skipped ONLY for the sender `bot` at Blinc (rule 98, we are the sender there, the bot, by THEIR rules); a human sender at Blinc ALSO goes through it, so no text goes out in the voice of the user unread.
      if: '${ (.input.upstream == "blinc" and .input.absender == "bot") | not }'
  - choose-channel:
      call: choose-channel:0.0.17@fs
      with:
        upstream: ${ .input.upstream }
      export:
        as: '${ $context + { channel: . } }'
      metadata:
        freesynergy.net:actor: human
        freesynergy.net:actor-type: Person
        freesynergy.net:gate: human
        freesynergy.net:kind: subjective
        freesynergy.net:summary: The person chooses the channel for this upstream - `tracker` (the upstream's own issue tracker, e.g. a GitHub issue under the user's account, only after the user's release for exactly this channel), `git-bug` (only if we have write access to the upstream's repository; `git-bug push` over SSH fails otherwise) or `direct` (Discord or mail, the user writes it themselves with the approved text as the template). Without a choice nothing is sent.
      if: '${ (.input.upstream == "blinc" and .input.absender == "bot") | not }'
  - send:
      call: send-issue:0.0.17@fs
      if: '${ $context.channel != "direct" and .input.upstream != "kanidm" and $context.ziel.ki != "abgelehnt" and (.input.absender == "bot" or $context.freigabe.ja == true) }'
      with:
        upstream: ${ .input.upstream }
        block: ${ $context.block }
        channel: ${ $context.channel }
      export:
        as: '${ $context + { send: . } }'
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: human
        freesynergy.net:kind: subjective
        freesynergy.net:summary: Script - sends by the chosen channel, only the approved copy block `block` (exactly what the sender read), only after the YES and the choice (for Blinc without a YES, by rule 98 and the gates above); `tracker` creates the issue at the upstream's tracker with the user's account, `git-bug` creates it with git-bug (-F file, labels kind and area) and sends it with `git-bug push bugs` over the SSH remote. Returns the issue id. The step is BLOCKED by its `if:` for Kanidm and every target with `ziel.ki == abgelehnt` (agents and bot never send there, the person does by `hand-text`) and for a human sender without the YES (`freigabe.ja`). The helper of the strategy runs it; an agent never calls gh or a browser login. WHO sends is `absender` - a human (first contact always) or, from the second contact on and only where allowed (step `absender-weiche`), openly the bot.
  - hand-text:
      call: hand-text:0.0.17@fs
      if: '${ $context.channel == "direct" or .input.upstream == "kanidm" or $context.ziel.ki == "abgelehnt" or ($context.freigabe.ja != true and .input.absender != "bot") }'
      with:
        block: ${ $context.block }
      metadata:
        freesynergy.net:actor: human
        freesynergy.net:actor-type: Person
        freesynergy.net:gate: human
        freesynergy.net:kind: subjective
        freesynergy.net:summary: Direct contact (Discord, mail) and EVERY send at Kanidm or at a target that refuses AI, or by a human without the YES - the person writes and sends the message themselves, with the approved copy block `block` as the template; the machine sends nothing and the agent does nothing in this step.
  - erstkontakt-vermerken:
      call: first-contact-note:0.0.17@fs
      with:
        upstream: ${ .input.upstream }
        datei: ${ .input.erstkontakt_datei // "workflows/upstream-erstkontakt.txt" }
        id: ${ $context.send.id }
        channel: ${ $context.channel }
        absender: ${ .input.absender }
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: subjective
        freesynergy.net:summary: "Script - AFTER the text was SENT (by `send`, or the person confirmed that they sent it themselves by `hand-text`): sets the line of this target project in `workflows/upstream-erstkontakt.txt` when there was none (`erstkontakt=<UTC date>`, `quelle=<issue id or direct>`, `reaktion=offen`), otherwise only updates it; the `reaktion` is added later when an answer arrives (also by `upstream-watch`). One list, one source; nothing is written when nothing was sent. The file is part of the checked-in repo fs-release: the write lands as a change in a worker branch (or the working copy of the coordinator) and goes through review like any change; agents never push, tag or merge it themselves."
  - link-ins-ticket:
      call: ticket-link:0.0.17@fs
      with:
        ticket: ${ $context.ticket }
        channel: ${ $context.channel }
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Script - writes the link of the sent issue (or the note `direct`) into the git-bug ticket of our repo, so the ticket and the upstream issue point at each other."
  - record:
      call: note-history:0.0.17@fs
      then: end
      with:
        id: ${ $context.send.id }
        channel: ${ $context.channel }
      metadata:
        freesynergy.net:actor: ai
        freesynergy.net:actor-type: Service
        freesynergy.net:bot-seat: upstream-anfrage.record
        freesynergy.net:gate: none
        freesynergy.net:kind: subjective
        freesynergy.net:summary: The agent notes the history - upstream, channel, issue id (none for `direct`), date, the approved text, later answers - in the report; no planning files in the upstream.
  - pr-nach-antwort:
      call: pr-gate:0.0.17@fs
      with:
        upstream: ${ .input.upstream }
        issue: ${ .input.issue }
        frist_tage: ${ .input.frist_tage // 14 }
        datei: ${ .input.erstkontakt_datei // "workflows/upstream-erstkontakt.txt" }
      export:
        as: '${ $context + { pr_tor: . } }'
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Script, read only (no gh write, no comment): checks for a pull request whether (a) the issue `issue` of the upstream was ANSWERED (answer read, `antwort` with link; the rules of the upstream (CONTRIBUTING, AI stance, PR template) read and cited in `fundstellen`) or (b) the time limit `frist_tage` (default 14 days since our issue) has run out. Result `pr_tor` with `frei` (true only for (a) with kept rules or (b)), `grund` (`antwort` | `frist`), `frist_ohne_antwort` and `nachfrage_erlaubt` (true once: a time limit without an answer allows ONE factual follow-up question, written and sent by the human, never nagging; the question already asked is noted in the ONE list `workflows/upstream-erstkontakt.txt` as `nachfrage=<UTC date>` on the line of the target, and `nachfrage_erlaubt` is false as soon as that field stands there; the human adds it when they sent the question). The rules of the upstream go before our time limit: if they forbid or delay a PR, `frei` stays false."
  - pr-weiche:
      switch:
        - pr-wartet:
            when: '${ $context.pr_tor == null or $context.pr_tor.frei != true or ($context.pr_tor.fundstellen // [] | length) == 0 }'
            then: pr-rot
        - pr-frei:
            then: continue
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Control flow - a missing result, no answer and no expired time limit, or rules of the upstream not cited (`fundstellen` empty) keep the pull request RED: `pr-rot`; only `frei == true` with cited rules goes on to the approval of the user."
  - pr-ziel-regeln:
      call: target-rules:0.0.17@fs
      with:
        upstream: ${ .input.upstream }
        art: pr
      export:
        as: '${ $context + { ziel: . } }'
      metadata:
        freesynergy.net:actor: ai
        freesynergy.net:actor-type: Service
        freesynergy.net:bot-seat: upstream-anfrage.pr-ziel-regeln
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "TEXTS TO THE OUTSIDE (a) for the pull request: the SAME call as `ziel-regeln-lesen` (no copy of its logic) - the rules of the target (CONTRIBUTING, AI or LLM stance, PR template) are read read only and cited in `fundstellen`, with `ki` and `format`. The rules of the upstream go first."
  - pr-erstkontakt-lesen:
      call: first-contact-read:0.0.17@fs
      with:
        upstream: ${ .input.upstream }
        datei: ${ .input.erstkontakt_datei // "workflows/upstream-erstkontakt.txt" }
      export:
        as: '${ $context + { erstkontakt: . } }'
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Script (no AI), read only: the SAME call as `erstkontakt-lesen` - the ONE list `workflows/upstream-erstkontakt.txt` says whether this target was contacted before (the AI note stands once at the first contact)."
  - pr-ki-weiche:
      switch:
        - ki-nein:
            when: '${ $context.ziel.ki == null or $context.ziel.fundstellen == null or ($context.ziel.fundstellen | length) == 0 or (["erlaubt", "verlangt", "ohne-vermerk", "abgelehnt"] | index($context.ziel.ki)) == null }'
            then: ki-abgelehnt
        - weiter:
            then: continue
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Control flow, the same rule as `ki-haltung-weiche` (TEXTS TO THE OUTSIDE (a), (b)) - no `fundstellen`, no `ziel` result or a `ki` value outside `erlaubt | verlangt | ohne-vermerk | abgelehnt` goes to `ki-abgelehnt`: the rules are NOT read."
  - pr-ki-hinweis:
      call: ai-note-decide:0.0.17@fs
      with:
        erstkontakt: ${ $context.erstkontakt }
        ziel: ${ $context.ziel }
        nachfrage: ${ .input.nachfrage }
        bedingung: ${ .input.bedingung }
        art: pr
      export:
        as: '${ $context + { ki_hinweis: . } }'
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Script (no AI), the SAME call as `ki-hinweis` (TEXTS TO THE OUTSIDE (b)): `ki_hinweis` says whether the target allows or asks for the AI note; for a code contribution it is normally yes. The attitude switch below has the last word."
  - pr-haltung-weiche:
      switch:
        - blinc:
            when: '${ .input.upstream == "blinc" }'
            then: pr-ohne-vermerk
        - andere:
            then: continue
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Control flow, the rules of the upstream go first (CLAUDE.md of the user, section 8): Blinc has the house rule `NO AI attribution in issue, PR or commit`, so a pull request to Blinc goes to `pr-ohne-vermerk` (NO AI note, no Co-Authored-By); every other upstream goes on to `pr-mit-vermerk` (the AI collaboration is named openly where `ki_hinweis` says so, never hidden, never denied)."
  - pr-mit-vermerk:
      set:
        ki: ${ $context.ki_hinweis == true }
      export:
        as: '${ $context + { vermerk: . } }'
      then: pr-dubletten
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Not Blinc - `vermerk.ki` is true exactly when `ki_hinweis` is true: the text carries the ONE honest AI note (one sentence or short paragraph inside the text, never a signature or trailer) as the rules of the target and the first-contact list say."
  - pr-ohne-vermerk:
      set:
        ki: false
      export:
        as: '${ $context + { vermerk: . } }'
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Blinc - `vermerk.ki` is false whatever `ki_hinweis` says: NO AI attribution in the pull request text (rule of the maintainer, quoted in the head of this flow). The text gate then refuses every AI word."
  - pr-dubletten:
      call: search-duplicates-ai:0.0.17@fs
      with:
        upstream: ${ .input.upstream }
        belegt: ${ $context.pr_tor }
        art: pr
      export:
        as: '${ $context + { dubletten: . } }'
      metadata:
        freesynergy.net:actor: ai
        freesynergy.net:actor-type: Service
        freesynergy.net:bot-seat: upstream-anfrage.pr-dubletten
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "The SAME call as `dubletten`, here for the open pull requests (and closed ones) of the target: READ ONLY, no login, no comment, no reaction, no new pull request. A hit that says the same is a duplicate. Result `dubletten` with `treffer`."
  - pr-dubletten-weiche:
      switch:
        - doppelt:
            when: '${ $context.dubletten.treffer == null or ($context.dubletten.treffer | length) > 0 }'
            then: abgelehnt
        - neu:
            then: continue
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Control flow, the same rule as `dubletten-weiche` - a duplicate pull request or a missing result goes to `abgelehnt` with the link, no comment is written there; only an empty hit list goes on."
  - pr-regeln:
      call: upstream-rules:0.0.17@fs
      with:
        upstream: ${ .input.upstream }
        draft: ${ .input.pr_text }
        ziel: ${ $context.ziel }
      export:
        as: '${ $context + { rules: . } }'
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Script, the SAME call as `rules` - checks the PR text against the CLAUDE.md of the upstream clone and the rules cited in `ziel` (for Blinc: no Claude, Anthropic or AI mention, no Co-Authored-By)."
  - pr-text-gate:
      call: text-gate:0.0.17@fs
      with:
        draft: ${ .input.pr_text }
        ticket: ${ .input.issue }
        ziel: ${ $context.ziel }
        ki_hinweis: ${ $context.vermerk.ki }
        absender: mensch
      export:
        as: '${ $context + { textcheck: . } }'
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Script, the SAME call as `text-gate` (TEXTS TO THE OUTSIDE, mandatory for every text): English, no addresses and no personal data, no AI words except exactly ONE honest note when `vermerk.ki` is true (never for Blinc). The sender of a pull request is always the human."
  - pr-text-weiche:
      switch:
        - treffer:
            when: '${ $context.rules.hits == null or $context.textcheck.hits == null or ($context.rules.hits | length) > 0 or ($context.textcheck.hits | length) > 0 }'
            then: pr-rot
        - sauber:
            then: continue
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Control flow - a hit of `pr-regeln` or `pr-text-gate` (a missing `hits` result counts as a hit) keeps the pull request RED (`pr-rot`, the hits are the reason); the text is corrected and the flow runs again. A clean text goes on to the copy block."
  - pr-kopierblock:
      call: copy-block:0.0.17@fs
      with:
        draft: ${ .input.pr_text }
        format: ${ $context.ziel.format }
      export:
        as: '${ $context + { block: . } }'
      metadata:
        freesynergy.net:actor: ai
        freesynergy.net:actor-type: Service
        freesynergy.net:bot-seat: upstream-anfrage.pr-kopierblock
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "TEXTS TO THE OUTSIDE (c), the SAME call as `kopierblock`: the clean PR text as ONE copy block in the format of the target (its PR template), with a checked preview (`vorschau_ok`)."
  - pr-vorschau-weiche:
      switch:
        - ohne-vorschau:
            when: '${ $context.block == null or $context.block.vorschau_ok != true }'
            then: abgelehnt
        - geprueft:
            then: continue
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Control flow (TEXTS TO THE OUTSIDE (c), mandatory gate), the same rule as `vorschau-weiche` - without a copy block whose preview in the target format was checked NOTHING goes to the user: `abgelehnt`."
  - pr-freigabe:
      call: approve:0.0.17@fs
      with:
        block: ${ $context.block }
      export:
        as: '${ $context + { freigabe: . } }'
      metadata:
        freesynergy.net:actor: human
        freesynergy.net:actor-type: Person
        freesynergy.net:gate: human
        freesynergy.net:kind: subjective
        freesynergy.net:summary: "The sender (the user) reads the pull request text and the patch against the cited rules of the upstream and gives the YES for exactly this text, beforehand. This step comes only after the same gates as an issue (rules read, attitude switch, duplicates, text gate, copy block with a checked preview). The AI note follows the rules of the target: openly named where `vermerk.ki` is true, never hidden, never denied; at Blinc there is NO AI attribution (house rule). Without the YES nothing goes out."
  - pr-hand-text:
      call: hand-text:0.0.17@fs
      then: end
      if: '${ $context.freigabe.ja == true }'
      with:
        block: ${ $context.block }
      metadata:
        freesynergy.net:actor: human
        freesynergy.net:actor-type: Person
        freesynergy.net:gate: human
        freesynergy.net:kind: subjective
        freesynergy.net:summary: "The person opens the pull request themselves, from their own account, with the approved text as the template (agents and bot never call gh for a pull request). If the YES is missing this step is skipped and the flow ends in `pr-rot`."
  - pr-rot:
      set:
        todo: pr-wartet
        status: held-back
      then: end
      metadata:
        freesynergy.net:actor: human
        freesynergy.net:actor-type: Person
        freesynergy.net:gate: human
        freesynergy.net:kind: subjective
        freesynergy.net:summary: "The pull request stays RED: no answer yet and the time limit has not run out, the rules of the upstream are not cited or forbid it, or the user did not say YES. Nothing is sent, no comment is written. The strategy reads the reason; after the answer or the time limit the flow is run again. This flow ends."
  - abgelehnt:
      set:
        todo: abgelehnt
        status: held-back
      then: end
      metadata:
        freesynergy.net:actor: human
        freesynergy.net:actor-type: Person
        freesynergy.net:gate: human
        freesynergy.net:kind: subjective
        freesynergy.net:summary: "Nothing is sent: a pull request or a comment was asked for, the statement is not proven, or a duplicate exists (the link goes into the report; no comment is written in the foreign issue), the preview in the target format was not checked, or the sender `bot` is not allowed here (first contact, Kanidm, a target that refuses AI or a bot) or not named. The strategy reads the reason and decides; a held-back request may come back with proof. This flow ends."
  - ki-abgelehnt:
      set:
        todo: ki-abgelehnt
        status: held-back
      then: end
      metadata:
        freesynergy.net:actor: human
        freesynergy.net:actor-type: Person
        freesynergy.net:gate: human
        freesynergy.net:kind: subjective
        freesynergy.net:summary: "TEXTS TO THE OUTSIDE (b): the rules of the target were NOT read (no citation, no result, unknown value). Nothing is prepared and nothing is sent; the rules must be read and cited first (a refusal of AI contributions is NOT this state: that target gets a prepared draft that only the human sends). This flow ends."
  - eskalation:
      set:
        todo: eskalation
        status: escalated
      then: end
      metadata:
        freesynergy.net:actor: human
        freesynergy.net:actor-type: Person
        freesynergy.net:gate: human
        freesynergy.net:kind: subjective
        freesynergy.net:summary: "Escalation after the third round (`runde` >= 3) of the rules or the text gate: the person decides how to go on; nothing is sent. This flow ends."
