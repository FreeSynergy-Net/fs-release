# Convert existing building blocks and Frontends to the layers of ADR 0074: theme contract with fixed block names, DTCG tokens, no fixed colors or spacings in blocks or Frontends, arrangement separate. Goal: new Frontends are built quickly from blocks.
# The ADR is conventions/decisions/0074-stil-bausteine-bewegung-klang-menues.md in fs-documentation.
# Gate before replacing painted copies by Blinc blocks: bruecke, alle-stile-erweitern, stil-vollstaendigkeit, zwei-stile (plan-theme-bruecke.md).
# One run per block group = per crate (input.group); in it first the texts (`texte`, ADR 0057 Words/MF2, de+en, gate texts-check), then the tokens. Agents never push, tag or merge. Order: `Workflow frontend-umbau, step <id>, parameters contract, tag, repo,
# branch, head, delta, group, frontend_crate` (docs/prompt-template.md). FS profile: see README.md.
# Inputs docs, docs_base, old, new, allow, delta are passed on to release-flow (step `doku`, rule doku-mitziehen).
# Review template frontend: step `frontend-nur-komponenten` (input `frontend_crate`) before the picture acceptance: only component calls; logic or a widget is a finding (conversation `frontend-befund-talk`).
# Mandatory first step `vorhanden-pruefen` (rule of the user): look whether it exists or is only extended; the result `befund` (with proof) is read by the following steps.
document:
  dsl: 1.0.3
  namespace: freesynergy.net
  name: frontend-umbau
  version: 0.0.10
  title: Convert one group of building blocks to the layers of ADR 0074
do:
  - vorhanden-pruefen:
      call: vorhanden-pruefen-ai:0.0.10@fs
      with:
        suche: ${ .input }
      export:
        as: '${ $context + { befund: . } }'
      metadata:
        freesynergy.net:actor: ai
        freesynergy.net:actor-type: Application
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "MANDATORY FIRST STEP (rule of the user: before anything is built, look whether it already exists and whether it is only extended): search ALL repos, the `unreviewed/` branches, `.scratch` and the inventories (`katalog-plan/INVENTUR-*.md`). Result `befund` = { art: vorhanden | neu, verweis (\"extend X\"), beleg (what was searched, with paths and heads) }. `neu` only WITH a reason and proof. The following steps read `befund`; nothing is built without it."
  - vorhanden-pruefen-check:
      call: befund-beleg:0.0.10@fs
      with:
        befund: ${ $context.befund }
      export:
        as: '${ $context + { belegcheck: . } }'
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Check (gate): `befund` without proof is RED - `neu` needs a reason and a proof (what was searched), `vorhanden` needs a reference \"extend X\"; a missing `befund` is red."
  - vorhanden-pruefen-again:
      switch:
        - runden:
            when: '${ $context.belegcheck.red == true and ($context.belegcheck.runde // 0) >= 3 }'
            then: umbau-eskalation
        - red:
            when: '${ $context.belegcheck.red == true }'
            then: vorhanden-pruefen
        - green:
            when: '${ $context.belegcheck.red == false }'
            then: continue
        - ohne-ergebnis:
            then: umbau-eskalation
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Control flow - red goes back to `vorhanden-pruefen` (at most two repeats), from the third red round to the escalation; only `red == false` goes on; a missing result goes to the escalation, never on."
  - texte:
      call: texts-convert-ai:0.0.10@fs
      with:
        befund: ${ $context.befund }
        group: ${ .input.group }
        repo: ${ .input.repo }
        branch: ${ .input.branch }
        head: ${ .input.head }
        delta: ${ .input.delta }
      metadata:
        freesynergy.net:actor: ai
        freesynergy.net:actor-type: Application
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: First the texts, then the tokens, in the same run per crate. The agent moves every fixed text of the group to `Words` with MF2 messages (ADR 0057, not Fluent), German and English together; own worktree, local commits ([COMMIT]), no push, no tag; report per [BERICHT].
  - texts-check:
      call: texts-check:0.0.10@fs
      with:
        group: ${ .input.group }
      export:
        as: '${ $context + { texts: . } }'
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: Script - the gate `texts-check` - no fixed text left in the group, every message in de and en, valid MF2; the result is `red` or not.
  - texts-again:
      switch:
        - red:
            when: '${ $context.texts.red }'
            then: texte
        - done:
            then: continue
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: Control flow - a red `texts-check` goes back to texte, only green texts go on to the token steps.
  - count:
      call: count-fixed-values:0.0.10@fs
      with:
        group: ${ .input.group }
      export:
        as: '${ $context + { count: . } }'
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: subjective
        freesynergy.net:summary: Script - counts in the group the fixed colors, fixed spacings and block names that are not in the contract (ADR 0074, conventions/decisions/0074-stil-bausteine-bewegung-klang-menues.md); whatever the numbers are, they are written down as the starting state.
  - assign:
      call: assign-tokens:0.0.10@fs
      with:
        group: ${ .input.group }
        counted: ${ $context.count }
      export:
        as: '${ $context + { assign: . } }'
      metadata:
        freesynergy.net:actor: ai
        freesynergy.net:actor-type: Application
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: The agent maps every counted value to a DTCG token and every block to its fixed contract name (WAI-ARIA, Open UI); a value without a fitting token is listed, not invented.
  - bruecke:
      call: theme-bridge-ai:0.0.10@fs
      with:
        group: ${ .input.group }
        mapping: ${ $context.assign }
        repo: ${ .input.repo }
        branch: ${ .input.branch }
        head: ${ .input.head }
        delta: ${ .input.delta }
      metadata:
        freesynergy.net:actor: ai
        freesynergy.net:actor-type: Application
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: Before a painted copy is replaced by a real Blinc block - the agent gives every Blinc block of the group its fixed contract name with parts and states (WAI-ARIA, Open UI) and the `blinc` entry (class and state selectors) and maps the DTCG tokens to the Blinc theme slots, the generated style sheet and the wrapper; nothing may stay in the Blinc default look (ADR 0074, one style for everything). Plan /srv/FreeSynergy/.scratch/plan-theme-bruecke.md. Own worktree, local commits, no push, no tag.
  - alle-stile-erweitern:
      call: styles-extend-ai:0.0.10@fs
      with:
        group: ${ .input.group }
        repo: ${ .input.repo }
        branch: ${ .input.branch }
        head: ${ .input.head }
        delta: ${ .input.delta }
      metadata:
        freesynergy.net:actor: ai
        freesynergy.net:actor-type: Application
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: Fixed step of the flow that introduces a block, part or state - a new version of the theme contract, and EVERY existing style gets an explicit entry for it (mostly only assigning tokens; no silent gaps). Own worktree, local commits, no push, no tag.
  - stil-vollstaendigkeit:
      call: stil-vollstaendigkeit:0.0.10@fs
      with:
        contract: ${ .input.contract }
      export:
        as: '${ $context + { vollstaendig: . } }'
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: scripts/stil-vollstaendigkeit - theme contract times all styles, every block with all parts and states has an explicit entry in every style; a missing one is `red`, no release.
  - vollstaendig-again:
      switch:
        - runden:
            when: '${ $context.vollstaendig.red and ($context.vollstaendig.runde // 0) >= 3 }'
            then: umbau-eskalation
        - red:
            when: '${ $context.vollstaendig.red }'
            then: alle-stile-erweitern
        - green:
            then: continue
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: Control flow - a missing entry goes back to alle-stile-erweitern (from the third red round, `runde` >= 3, to the person in `umbau-eskalation`), otherwise on to zwei-stile.
  - zwei-stile:
      call: zwei-stile:0.0.10@fs
      with:
        group: ${ .input.group }
      export:
        as: '${ $context + { stile2: . } }'
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: Script scripts/zwei-stile (no network, no AI) - the gate BEFORE the painted copies are replaced (convert) - every block of the contract names of the group that is already reached through an adapter (Blinc blocks; own blocks still carry fixed values before `convert` and are not drawn here) is drawn once in two styles (Craft and a second one, light and dark); a block whose picture does not change is RED (it does not hang on the style); the exception list only holds reasons of content (e.g. icons). Order - contract, stil-vollstaendigkeit, zwei-stile. Self test with counter-checks. Plan /srv/FreeSynergy/.scratch/plan-theme-bruecke.md section 4.
  - zwei-stile-again:
      switch:
        - runden:
            when: '${ $context.stile2.red and ($context.stile2.runde // 0) >= 3 }'
            then: umbau-eskalation
        - red:
            when: '${ $context.stile2.red }'
            then: bruecke
        - green:
            then: continue
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: Control flow - a block that does not follow the style goes back to bruecke (from the third red round, `runde` >= 3, to the person in `umbau-eskalation`), otherwise on to the images before the change and to convert.
  - before:
      call: render-images:0.0.10@fs
      with:
        group: ${ .input.group }
        state: before
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: subjective
        freesynergy.net:summary: Renders the images of the group before the change (the reference for the pixel comparison).
  - convert:
      call: convert-ai:0.0.10@fs
      with:
        group: ${ .input.group }
        mapping: ${ $context.assign }
        repo: ${ .input.repo }
        branch: ${ .input.branch }
        head: ${ .input.head }
        delta: ${ .input.delta }
      metadata:
        freesynergy.net:actor: ai
        freesynergy.net:actor-type: Application
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: The agent replaces fixed colors, spacings and names by tokens and contract names and keeps the arrangement in its own layer. Own worktree, local commits ([COMMIT]), no push, no tag; report per [BERICHT]. The loop back from `repeat` runs until the script counts 0 fixed colors and spacings.
  - recount:
      call: count-fixed-values:0.0.10@fs
      with:
        group: ${ .input.group }
      export:
        as: '${ $context + { recount: . } }'
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: Script - the same count as at the start; the result is `fixed` (colors and spacings still fixed).
  - gates:
      call: gates:0.0.10@fs
      export:
        as: '${ $context + { gates: . } }'
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: scripts/gates.sh ([GATES]), the one definition of the checks; the result is `red` or not.
  - same-pictures:
      call: pixel-compare:0.0.10@fs
      with:
        group: ${ .input.group }
      export:
        as: '${ $context + { pictures: . } }'
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: Script - renders the images after the change and compares them pixel by pixel with the before images; the conversion must not change the look (default theme); the result is `different` or not.
  - repeat:
      switch:
        - again:
            when: '${ $context.recount.fixed > 0 or $context.gates.red or $context.pictures.different }'
            then: convert
        - done:
            then: continue
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: Control flow - fixed values left, red gates or a changed picture go back to convert, otherwise on to the release.
  - frontend-nur-komponenten:
      call: frontend-nur-komponenten:0.0.10@fs
      with:
        frontend_crate: ${ .input.frontend_crate }
      export:
        as: '${ $context + { komponenten: . } }'
      metadata:
        freesynergy.net:actor: ai
        freesynergy.net:actor-type: Application
        freesynergy.net:gate: opus-ja
        freesynergy.net:kind: subjective
        freesynergy.net:summary: "Review template frontend (rule of the user, lane 3): the frontend crate (input `frontend_crate`) contains ONLY the plugging together of components from fs-components plus theme, style, menu tree and texts: no logic, no own widgets, no data conversion. A new widget or logic is a FINDING (result `befunde`, each with file and line): a missing component is built in fs-components (or the nearest existing component stands in, marked \"vorläufig\"), logic belongs into the program or the modules through the contract. Until the frontend is a description (manifest / forms kit, read at run time) the plug-together code is a transition. Opus reads only the crate and writes the findings; it changes nothing."
  - frontend-nur-komponenten-weiche:
      switch:
        - runden:
            when: '${ $context.komponenten.befunde != null and ($context.komponenten.befunde | length) > 0 and ($context.komponenten.runde // 0) >= 3 }'
            then: umbau-eskalation
        - befund:
            when: '${ $context.komponenten.befunde != null and ($context.komponenten.befunde | length) > 0 }'
            then: frontend-befund-talk
        - sauber:
            when: '${ $context.komponenten.befunde != null and ($context.komponenten.befunde | length) == 0 }'
            then: release
        - ohne-ergebnis:
            then: umbau-eskalation
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Control flow - a finding goes to the conversation `frontend-befund-talk` (at most two repeats, then the escalation); only an empty list (not a missing result) goes on; a missing result goes to the escalation, never on."
  - frontend-befund-talk:
      call: talk:0.0.10@fs
      with:
        frontend_crate: ${ .input.frontend_crate }
        befunde: ${ $context.komponenten.befunde }
      then: frontend-nur-komponenten
      metadata:
        freesynergy.net:actor: human
        freesynergy.net:actor-type: Person
        freesynergy.net:gate: human
        freesynergy.net:kind: subjective
        freesynergy.net:summary: "Conversation of the user and Opus about every finding (logic or widget in the frontend crate): move it into fs-components or into the program, or decide otherwise; the protocol `talk-<programm>-frontend-<datum>.md` holds the decision. No agent decides it alone. Then the check runs again."
  - release:
      then: end
      run:
        workflow:
          namespace: freesynergy.net
          name: release-flow
          version: 0.0.10
        input:
          repo: ${ .input.repo }
          tag: ${ .input.tag }
          prerelease: true
          delta: ${ .input.delta }
          docs: ${ .input.docs }
          docs_base: ${ .input.docs_base }
          old: ${ .input.old }
          new: ${ .input.new }
          allow: ${ .input.allow }
      metadata:
        freesynergy.net:actor: human
        freesynergy.net:actor-type: Person
        freesynergy.net:gate: human
        freesynergy.net:kind: objective
        freesynergy.net:summary: release-flow.yaml holds the one Opus review of this head (opus-ja; NEIN goes back to convert with the findings as the order), then CI; the person merges and releases, agents never do. There is no second review here.
  - umbau-eskalation:
      set:
        todo: umbau-eskalation
      then: end
      metadata:
        freesynergy.net:actor: human
        freesynergy.net:actor-type: Person
        freesynergy.net:gate: human
        freesynergy.net:kind: subjective
        freesynergy.net:summary: The completeness check or the two-style gate was red three times (`runde` >= 3); the person decides what is wrong, the contract, the styles or the adapter. This flow ends.
