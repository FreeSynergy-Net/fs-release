# One round on a Frontend: dossier, gap list, images, the user's verdict, build, acceptance by clicking through the working flows, release.
# Fixed order for every Frontend (wave 1 included): (1) BLOCK ANALYSIS - every area of the model is assigned to a block family and id, existing blocks first
# (dossier, bausteine.md, check baustein-zuordnung; source order family block, Blinc widget through an adapter, new block with reason); (2) LOOK - style analysis, tokens and style rules per block (ADR 0074; step stil-analyse);
# (3) COMPOSITION - the arrangement in the Frontend (step build). Agents never push, tag or merge. FS profile: see README.md.
# Input: frontend_crate (the frontend crate, for the review template frontend), contract (the theme contract file), tag (the release tag for release-flow), vorbild (the model program the dossier is about), frontend (OUR program that is built; gap list, style analysis, images and build are about it), bestand (family inventory), blinc (Blinc widget inventory), dossier (folder of the dossier), model (pictures of the model), dump, exceptions,
# repo, branch, head, delta, release (true or missing = the flow ends with release-flow; `false` = no release here, the caller releases later, e.g. programm-neu).
# Inputs docs, docs_base, old, new, allow, delta are passed on to release-flow (step `doku`, rule doku-mitziehen).
# Review template frontend: step `frontend-nur-komponenten` (input `frontend_crate`) before the picture acceptance: only component calls; logic or a widget is a finding (conversation `frontend-befund-talk`).
document:
  dsl: 1.0.3
  namespace: freesynergy.net
  name: frontend-round
  version: 0.0.18
  title: A Frontend round from the research dossier to the release
do:
  - dossier:
      run:
        workflow:
          namespace: freesynergy.net
          name: dossier
          version: 0.0.18
        input:
          vorbild: ${ .input.vorbild }
          bestand: ${ .input.bestand }
          blinc: ${ .input.blinc }
          dossier: ${ .input.dossier }
          repo: ${ .input.repo }
          branch: ${ .input.branch }
      metadata:
        freesynergy.net:actor: human
        freesynergy.net:actor-type: Person
        freesynergy.net:gate: human
        freesynergy.net:kind: objective
        freesynergy.net:summary: The research dossier of the Frontend exists and passes check-docs (sub-workflow dossier.yaml, research by the agent, check-docs by the machine); repeat until it does. The sub-workflow holds block analysis (bausteine.md, objective check baustein-zuordnung with the share of new blocks, red goes back to research). It ends with the human publish into the docs main branch, so the step carries that gate.
  - gap-list:
      call: gap-list:0.0.18@fs
      with:
        frontend: ${ .input.frontend }
        dossier: ${ .input.dossier }
      metadata:
        freesynergy.net:actor: ai
        freesynergy.net:actor-type: Service
        freesynergy.net:bot-seat: frontend-round.gap-list
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: Compares dossier (states, dialogs, menus, shortcuts, workflows, gaps) with our Frontend and writes the list of what is missing.
  - stil-analyse:
      call: stil-analyse:0.0.18@fs
      with:
        frontend: ${ .input.frontend }
        dossier: ${ .input.dossier }
      metadata:
        freesynergy.net:actor: ai
        freesynergy.net:actor-type: Service
        freesynergy.net:bot-seat: frontend-round.stil-analyse
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: Step 2 of the fixed order (after the block analysis of the dossier, before the composition) - the style analysis of the model gives tokens and style rules per block id of bausteine.md (ADR 0074, DTCG tokens, rules per named part and state); no fixed colours or spaces in the block or the Frontend; repeat until every block id of the table has its rules.
  - stil-check:
      call: style-check:0.0.18@fs
      with:
        dossier: ${ .input.dossier }
      export:
        as: '${ $context + { stil: . } }'
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: Script (no network, no AI) - every block id of the `## Baustein-Zuordnung` table of bausteine.md has style rules and tokens (a rule per named part and state, DTCG tokens, ADR 0074) in the style files; no fixed colour or space in a rule. The result carries `red` (true = back) and `runde`; the red rounds are counted by the script, from the third one the flow ends in `stil-eskalation`.
  - stil-again:
      switch:
        - runden:
            when: '${ $context.stil.red and ($context.stil.runde // 0) >= 3 }'
            then: stil-eskalation
        - red:
            when: '${ $context.stil.red }'
            then: stil-analyse
        - green:
            then: continue
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: Control flow - a block id without rules goes back to stil-analyse (from the third red round to the person), green goes on to the images.
  - stil-sichern:
      call: style-save-ai:0.0.18@fs
      with:
        frontend: ${ .input.frontend }
        dossier: ${ .input.dossier }
      metadata:
        freesynergy.net:actor: ai
        freesynergy.net:actor-type: Service
        freesynergy.net:bot-seat: frontend-round.stil-sichern
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: Every model that is rebuilt yields a style, saved as a style file (DTCG tokens plus the rule entries of the theme contract) when it does not exist yet, English name (Calm, Office, Craft ...), fair reference to the model named in the description (what it is based on), source and licence of the reference named, nothing copied (ADR 0013, ADR 0074 section 3). Own worktree, local commits, no push, no tag. Whenever a style exists or is added it styles EVERY block of the theme contract with all parts and states (an explicit entry each, no silent gaps).
  - stil-sichern-check:
      call: style-save-check:0.0.18@fs
      with:
        frontend: ${ .input.frontend }
      export:
        as: '${ $context + { gesichert: . } }'
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: Script (no network, no AI) - the style file of the model exists (or the style already existed), the name is English, source and licence of the reference are named; result `red` and `runde`.
  - stil-vollstaendigkeit:
      call: stil-vollstaendigkeit:0.0.18@fs
      with:
        contract: ${ .input.contract }
      export:
        as: '${ $context + { vollstaendig: . } }'
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: scripts/stil-vollstaendigkeit (no network, no AI; self test with counter-checks like baustein-zuordnung) - theme contract times ALL styles - every style has an explicit entry for every block, part and state of the contract; a missing entry is `red`, no release (mandatory rule, draft of the addendum to ADR 0074, not yet in the ADR). Result `red` and `runde`. Order - contract, completeness, then zwei-stile.
  - stil-sichern-again:
      switch:
        - runden:
            when: '${ ($context.gesichert.red or $context.vollstaendig.red) and (($context.vollstaendig.runde // 0) >= 3 or ($context.gesichert.runde // 0) >= 3) }'
            then: stil-eskalation
        - red:
            when: '${ $context.gesichert.red or $context.vollstaendig.red }'
            then: stil-sichern
        - green:
            then: continue
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: Control flow - a missing style file, an unnamed reference or a missing contract entry goes back to stil-sichern (from the third red round to the person), green goes on to the images.
  - images:
      call: render-images:0.0.18@fs
      with:
        frontend: ${ .input.frontend }
      export:
        as: '${ $context + { images: . } }'
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: subjective
        freesynergy.net:summary: Renders the images of the gap list (old and new state) and shows them; whatever they look like, the state changes to shown.
  - images-waechter:
      call: theme-waechter-check:0.0.18@fs
      with:
        images: ${ $context.images }
      export:
        as: '${ $context + { waechter: . } }'
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: subjective
        freesynergy.net:summary: "SPECIFICATION, NOT RUNNABLE (no script yet). Theme guard of the pictures (rule [THEME-WAECHTER] in testlauf): the result `waechter` goes to the picture acceptance; pictures without a green guard (`red == false`) do not count as evidence there, whatever they look like."
  - picture-verdict:
      run:
        workflow:
          namespace: freesynergy.net
          name: picture-acceptance
          version: 0.0.18
        input:
          programm: ${ .input.frontend }
          dossier: ${ .input.dossier }
          model: ${ .input.model }
          ours: ${ $context.images }
          waechter: ${ $context.waechter }
          installiert: false
      export:
        as: '${ $context + { verdict: . } }'
      metadata:
        freesynergy.net:actor: human
        freesynergy.net:actor-type: Person
        freesynergy.net:gate: human
        freesynergy.net:kind: subjective
        freesynergy.net:summary: The user's verdict on the images (picture-acceptance.yaml) is taken as it is; the result is `accepted` or not.
  - picture-again:
      switch:
        - accepted:
            when: '${ $context.verdict.accepted == true }'
            then: continue
        - not-accepted:
            when: '${ $context.verdict.accepted == false }'
            then: gap-list
        - no-verdict:
            then: bild-eskalation
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: Control flow - only `accepted == true` goes on (to build); `accepted == false` goes back to gap-list with the user's words as the order (the images are rendered from the gap list); anything else (no verdict, e.g. picture-acceptance ended in `dossier-menue-fehlt` or `menue-bild-fehlt`) goes to `bild-eskalation`. Never to build without `accepted == true`.
  - build:
      call: build-ai:0.0.18@fs
      with:
        repo: ${ .input.repo }
        branch: ${ .input.branch }
        head: ${ .input.head }
        delta: ${ .input.delta }
      metadata:
        freesynergy.net:actor: ai
        freesynergy.net:actor-type: Service
        freesynergy.net:bot-seat: frontend-round.build
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: Step 3 of the fixed order (composition) - the agent builds the gaps in its own worktree, composing only from the block ids of bausteine.md (a new block first, in the crate of its family, with the reason of the table; one block with modules instead of a second copy, ADR 0084 pattern) and the rules of stil-analyse; and commits locally ([COMMIT]); repeat until the gates are green ([GATES], commands one at a time per [BASH]), no push, no tag; report per [BERICHT]. Order - `Workflow frontend-round, step build, parameters repo, branch, head, delta, frontend` (docs/prompt-template.md).
  - gates:
      call: gates:0.0.18@fs
      export:
        as: '${ $context + { gates: . } }'
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: scripts/gates.sh, the one definition of the checks; the result is `red` or not.
  - gates-again:
      switch:
        - red:
            when: '${ $context.gates.red }'
            then: build
        - green:
            then: continue
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: Control flow - red gates go back to build, green ones go on to the acceptance.
  - menue-vergleich:
      call: menue-vergleich:0.0.18@fs
      with:
        dossier: ${ .input.dossier }
        dump: ${ .input.dump }
        exceptions: ${ .input.exceptions }
      export:
        as: '${ $context + { menus: . } }'
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: scripts/menue-vergleich (no network, no AI) compares the menu tree and the dialog list of the Frontend (dump of the program, schema fs-menu-dump/1) with the lists in the dossier (menus.md, dialogs.md; R2 - menus, dialogs and flows equal or similar to the model, extensions later). Deviations are listed as fehlt, zusaetzlich, anders-benannt, kuerzel; each is allowed only with a reason in the exception list of the Frontend, without it the result is `red` (rc 1; rc 2 = bad input). Applies to every Frontend of wave 1 (store, tasks, wiki, files, people, calendar, maps, groups). Format and dump - docs/menue-vergleich.md.
  - menue-vergleich-again:
      switch:
        - red:
            when: '${ $context.menus.red }'
            then: build
        - green:
            then: continue
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: Control flow - a deviation without a reason goes back to build (the step that builds the Frontend; the agent either builds the missing entry or writes the reason into the exception list), otherwise on to the acceptance.
  - frontend-nur-komponenten:
      call: frontend-nur-komponenten:0.0.18@fs
      with:
        frontend_crate: ${ .input.frontend_crate }
      export:
        as: '${ $context + { komponenten: . } }'
      metadata:
        freesynergy.net:actor: ai
        freesynergy.net:actor-type: Service
        freesynergy.net:bot-seat: frontend-round.frontend-nur-komponenten
        freesynergy.net:gate: opus-ja
        freesynergy.net:kind: subjective
        freesynergy.net:summary: "Review template frontend (rule of the user, lane 3): the frontend crate (input `frontend_crate`) contains ONLY the plugging together of components from fs-components plus theme, style, menu tree and texts: no logic, no own widgets, no data conversion. A new widget or logic is a FINDING (result `befunde`, each with file and line): a missing component is built in fs-components (or the nearest existing component stands in, marked \"vorläufig\"), logic belongs into the program or the modules through the contract. Until the frontend is a description (manifest / forms kit, read at run time) the plug-together code is a transition. Opus reads only the crate and writes the findings; it changes nothing."
  - frontend-nur-komponenten-weiche:
      switch:
        - runden:
            when: '${ $context.komponenten.befunde != null and ($context.komponenten.befunde | length) > 0 and ($context.komponenten.runde // 0) >= 3 }'
            then: bild-eskalation
        - befund:
            when: '${ $context.komponenten.befunde != null and ($context.komponenten.befunde | length) > 0 }'
            then: frontend-befund-talk
        - sauber:
            when: '${ $context.komponenten.befunde != null and ($context.komponenten.befunde | length) == 0 }'
            then: acceptance
        - ohne-ergebnis:
            then: bild-eskalation
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Control flow - a finding goes to the conversation `frontend-befund-talk` (at most two repeats, then the escalation); only an empty list (not a missing result) goes on; a missing result goes to the escalation, never on."
  - frontend-befund-talk:
      call: talk:0.0.18@fs
      with:
        frontend_crate: ${ .input.frontend_crate }
        befunde: ${ $context.komponenten.befunde }
      then: frontend-nur-komponenten
      metadata:
        freesynergy.net:actor: human
        freesynergy.net:actor-type: Person
        freesynergy.net:gate: human
        freesynergy.net:kind: subjective
        freesynergy.net:summary: "Conversation of the user and Opus about every finding (logic or widget in the frontend crate): move it into fs-components or into the program, or decide otherwise; the protocol `talk-<programm>-frontend-<datum>.md` holds the decision. No agent decides it alone. Then the check runs again."
  - acceptance:
      call: click-through:0.0.18@fs
      with:
        file: ${ .input.dossier }/acceptance.md
      export:
        as: '${ $context + { acceptance: . } }'
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: Script - reads acceptance.md of the dossier and clicks through every working flow listed there in the running Frontend (virtual session); the result is `red` when a flow fails.
  - acceptance-red:
      call: explain-red:0.0.18@fs
      if: ${ $context.acceptance.red }
      metadata:
        freesynergy.net:actor: ai
        freesynergy.net:actor-type: Service
        freesynergy.net:bot-seat: frontend-round.acceptance-red
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: Only when a flow failed - the agent finds the cause and writes the order for build; the script decides green or red, not the agent.
  - acceptance-again:
      switch:
        - red:
            when: '${ $context.acceptance.red }'
            then: build
        - green:
            then: continue
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: Control flow - a failed flow goes back to build with the order of acceptance-red, otherwise on to the release.
  - release-weiche:
      switch:
        - kein-release:
            when: '${ .input.release == false }'
            then: end
        - weiter:
            then: continue
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: Control flow - with the input `release` false this flow ends here (the caller releases after its later steps), otherwise it goes on to the release. A `switch` and not an `if` on the release step, because a skipped step would fall through to the next step (`stil-eskalation`) in Serverless Workflow 1.0.
  - release:
      then: end
      run:
        workflow:
          namespace: freesynergy.net
          name: release-flow
          version: 0.0.18
        input:
          repo: ${ .input.repo }
          tag: ${ .input.tag }
          prerelease: true
          delta: ${ .input.delta }
          docs: ${ .input.docs }
          docs_base: ${ .input.docs_base }
          old: ${ .input.old }
          new: ${ .input.new }
          allow: ${ .input.allow }
      metadata:
        freesynergy.net:actor: human
        freesynergy.net:actor-type: Person
        freesynergy.net:gate: human
        freesynergy.net:kind: objective
        freesynergy.net:summary: release-flow.yaml holds the one Opus review of this head (opus-ja), then CI, then the human or the coordinator merges and releases; there is no second review here, agents never merge. Not reached when the input `release` is false (see `release-weiche`).
  - stil-eskalation:
      set:
        todo: stil-eskalation
      then: end
      metadata:
        freesynergy.net:actor: human
        freesynergy.net:actor-type: Person
        freesynergy.net:gate: human
        freesynergy.net:kind: subjective
        freesynergy.net:summary: The style analysis was red three times (`runde` >= 3); the person decides what is wrong, the table or the rules. This flow ends.
  - bild-eskalation:
      set:
        todo: bild-eskalation
      then: end
      metadata:
        freesynergy.net:actor: human
        freesynergy.net:actor-type: Person
        freesynergy.net:gate: human
        freesynergy.net:kind: subjective
        freesynergy.net:summary: "picture-acceptance ended without a verdict (`todo: dossier-menue-fehlt` or `menue-bild-fehlt`): the person first completes the dossier (menu tree) or the missing picture pairs; nothing is built. This flow ends."
