# One round of the coordinator session (the short-lived coordinator the strategy starts). FS profile: see README.md.
# Start: the handoffs (fs-documentation todo/handoff-*.md) and the inbox are read, strands and priorities are taken over.
# Work: ONE agent per work step, in the background (Sonnet builds and tests, Opus reviews, Haiku searches and never codes);
# the messages of the agents go to the COORDINATOR, not to the strategy. The results are collected, the gates are checked, and
# the strategy gets ONE bundled report (only final states, red, approval gates). End: secure what is running (WIP commit, push
# unreviewed/*), handoff-update, one report. Rule check (RED on a breach): the coordinator does not build or test itself, does not
# wait in loops (sleep, pgrep) and does not read big logs. Calls `doku-mitziehen`. Agents never push, tag or merge; no main, no tag.
# Input: repo, branch, head, delta, docs, docs_base, old, new, allow (as for doku-mitziehen), handoffs (folder, default todo/), inbox.
document:
  dsl: 1.0.3
  namespace: freesynergy.net
  name: koordinator-runde
  version: 0.0.6
  title: "One working round of the coordinator: read the handoffs, one background agent per step, collect, gates, one bundled report"
do:
  - handoffs-lesen:
      call: read-handoffs:0.0.6@fs
      with:
        docs: ${ .input.docs }
        pattern: todo/handoff-*.md
      export:
        as: '${ $context + { handoffs: . } }'
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: subjective
        freesynergy.net:summary: "Reads todo/handoff-*.md of fs-documentation (origin/main) and lists them; the state changes to read, whatever they say. No build, no test."
  - posteingang-lesen:
      call: read-inbox:0.0.6@fs
      with:
        inbox: ${ .input.inbox }
      export:
        as: '${ $context + { inbox: . } }'
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: subjective
        freesynergy.net:summary: "Reads the inbox (new reports of agents, red notices, orders of the strategy); only the headlines, no big logs. The state changes to read."
  - rot-pruefen:
      call: red-check:0.0.6@fs
      export:
        as: '${ $context + { rot: . } }'
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "One query - gh search issues --owner FreeSynergy --label rot --state open. Empty = silence. Red = bugfix or agent-run for exactly this run; a gate is never bypassed."
  - straenge:
      call: take-over-strands:0.0.6@fs
      with:
        handoffs: ${ $context.handoffs }
        inbox: ${ $context.inbox }
      export:
        as: '${ $context + { plan: . } }'
      metadata:
        freesynergy.net:actor: ai
        freesynergy.net:actor-type: Application
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Takes over the strands and priorities of the handoffs and the inbox into one work list: one entry per work step with the role (build = Sonnet, review = Opus, search = Haiku), the files to read and the target. Haiku gets only search and read orders, never code."
  - agenten-starten:
      for:
        each: schritt
        in: ${ $context.plan.schritte }
      do:
        - agent:
            run:
              workflow:
                namespace: freesynergy.net
                name: agent-run
                version: 0.0.6
              input:
                repo: ${ $schritt.repo }
                branch: ${ $schritt.branch }
                head: ${ $schritt.head }
                delta: ${ $schritt.delta }
                task: ${ $schritt.task }
                model: ${ $schritt.model }
                background: true
                report_to: coordinator
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Starts ONE agent per work step, each in the background (model by role: Sonnet builds and tests, Opus reviews, Haiku searches and never writes code). The messages of every agent go to the coordinator (report_to: coordinator), never to the strategy. The coordinator starts them and does not do the step itself."
  - einsammeln:
      call: collect-agent-reports:0.0.6@fs
      export:
        as: '${ $context + { berichte: . } }'
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Collects the finished reports by the notifications of the agents (event driven; no sleep, no pgrep, no polling loop) and reads only the report and the commit list of each run, never a big log."
  - auswerten:
      call: read-run-result:0.0.6@fs
      with:
        berichte: ${ $context.berichte }
      export:
        as: '${ $context + { ergebnis: . } }'
      metadata:
        freesynergy.net:actor: ai
        freesynergy.net:actor-type: Application
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Evaluates every finished run - its report, its commits, what is proven and what is not."
  - gates-pruefen:
      run:
        workflow:
          namespace: freesynergy.net
          name: testlauf
          version: 0.0.6
        input:
          repo: ${ .input.repo }
          branch: ${ .input.branch }
          head: ${ .input.head }
          delta: ${ .input.delta }
          scope: gezielt
      export:
        as: '${ $context + { gates: . } }'
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Checks the gates of every finished head through the flow testlauf (targeted tests of the changed parts; the full workspace run is only an end gate). The coordinator builds and tests nothing itself; the result carries red and runde."
  - gates-again:
      switch:
        - runden:
            when: '${ ($context.gates.red and ($context.gates.runde // 0) >= 3) }'
            then: eskalation
        - red:
            when: '${ $context.gates.red }'
            then: korrektur
        - green:
            then: continue
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Control flow - red goes to korrektur, from the third red round the round ends in eskalation. No way past a red gate."
  - korrektur:
      run:
        workflow:
          namespace: freesynergy.net
          name: bugfix
          version: 0.0.6
        input:
          repo: ${ .input.repo }
          branch: ${ .input.branch }
          head: ${ .input.head }
          delta: ${ .input.delta }
          finding: ${ $context.gates }
          docs: ${ .input.docs }
          docs_base: ${ .input.docs_base }
          old: ${ .input.old }
          new: ${ .input.new }
          allow: ${ .input.allow }
          tag: ${ .input.tag }
      then: gates-pruefen
      metadata:
        freesynergy.net:actor: ai
        freesynergy.net:actor-type: Application
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "A red gate is fixed by an agent through bugfix.yaml for exactly this run (never by the coordinator), then the gates run again."
  - doku:
      run:
        workflow:
          namespace: freesynergy.net
          name: doku-mitziehen
          version: 0.0.6
        input:
          repo: ${ .input.repo }
          delta: ${ .input.delta }
          docs: ${ .input.docs }
          docs_base: ${ .input.docs_base }
          old: ${ .input.old }
          new: ${ .input.new }
          allow: ${ .input.allow }
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Mandatory step (rule doku-mitziehen): the documentation moves with every change of the round; without a matching docs change the gate is RED."
  - pruefung:
      run:
        workflow:
          namespace: freesynergy.net
          name: review
          version: 0.0.6
        input:
          head: ${ .input.head }
      metadata:
        freesynergy.net:actor: ai
        freesynergy.net:actor-type: Application
        freesynergy.net:gate: opus-ja
        freesynergy.net:kind: subjective
        freesynergy.net:summary: "Opus reviews the finished heads (the delta and the file list of the order only). One review per head."
  - regel-check:
      call: coordinator-rule-check:0.0.6@fs
      export:
        as: '${ $context + { regel: . } }'
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Rule check of the round, RED on a breach - the coordinator built or tested itself (cargo, build-slot.sh in its own process list), waited in loops (sleep, pgrep) or read big logs. Reads the command log of the round; the verdict is a script, not the coordinator's word."
  - regel-weiche:
      switch:
        - rot:
            when: '${ $context.regel.red }'
            then: regel-rot
        - gruen:
            then: continue
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Control flow - a breach of the rules turns the one report red; it does not stop the securing."
  - regel-rot:
      set:
        todo: regel-verstoss
      then: sichern
      metadata:
        freesynergy.net:actor: human
        freesynergy.net:actor-type: Person
        freesynergy.net:gate: human
        freesynergy.net:kind: subjective
        freesynergy.net:summary: "The round broke a coordinator rule: the strategy sees it at the top of the report (RED) and decides; the securing of the running work goes on."
  - sichern:
      call: wip-save:0.0.6@fs
      export:
        as: '${ $context + { gesichert: . } }'
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Secures what is running: a WIP commit in every agent worktree (wip-continue), nothing is lost on a stop."
  - push-unreviewed:
      call: push-unreviewed:0.0.6@fs
      with:
        branches: unreviewed/*
      metadata:
        freesynergy.net:actor: human
        freesynergy.net:actor-type: Person
        freesynergy.net:gate: human
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Push only of unreviewed/* by the person (the coordinator); never main, never a tag, never an agent."
  - handoff:
      run:
        workflow:
          namespace: freesynergy.net
          name: handoff-update
          version: 0.0.6
      metadata:
        freesynergy.net:actor: ai
        freesynergy.net:actor-type: Application
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "Brings the handoff file and the memory up to date with the state of the round."
  - bericht:
      run:
        workflow:
          namespace: freesynergy.net
          name: report-to-strategy
          version: 0.0.6
        input:
          workflow: koordinator-runde
          run: ${ .input.head }
      metadata:
        freesynergy.net:actor: ai
        freesynergy.net:actor-type: Application
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: "ONE bundled report to the strategy per round: only final states, red and approval gates; questions at the very end after a marker."
  - eskalation:
      set:
        todo: runde-eskalation
      then: end
      metadata:
        freesynergy.net:actor: human
        freesynergy.net:actor-type: Person
        freesynergy.net:gate: human
        freesynergy.net:kind: subjective
        freesynergy.net:summary: "The gates were red for the third time: the round stops and the person decides. The report names the last red lines. This flow ends."
