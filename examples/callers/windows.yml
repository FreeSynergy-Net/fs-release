# Copy to <repo>/.github/workflows/windows.yml - fmt, clippy (pedantic) and tests on windows-2022 on every push, on every branch.
# Pin to a fs-release TAG that contains _windows-check.yml (v0.0.11 = first tag after the Opus look; never @main); `scripts/pin-refs.sh --dir <repo> <tag>` raises it. No secrets, so no `secrets: inherit`.
name: windows
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    uses: FreeSynergy/fs-release/.github/workflows/_windows-check.yml@v0.0.11
    # with:
    #   runner: windows-2022          # explicit, never *-latest
    #   packages: "fs-types fs-foo"   # -p each; default: --workspace
    #   features: "--all-features"    # default
    #   clippy-extra: "-W clippy::pedantic"
    #   no-fail-fast: true
