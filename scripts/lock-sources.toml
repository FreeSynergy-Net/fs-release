# Configuration of scripts/check_lock_sources.py (rule: one source per library in every Cargo.lock; ADR 0092 rule 2, ADR 0093).
# Easy to extend: add a name to `libraries`. A repo can override the two switches in its own `.fs-lock-sources.toml` (same keys).

# Libraries that may appear in a Cargo.lock in exactly ONE source (git URL + tag/commit).
libraries = ["fs-types", "fs-objects", "fs-interfaces", "fs-rpc", "fs-jscalendar"]

# Introduction "warning first, error later": false = scripts/gates.sh prints the violation as a WARNING and stays green;
# true = the violation is a red gate. Switch a repo to true (in its .fs-lock-sources.toml) when it has been lifted to V1+.
strict = false

# V1+ addition: `fs-types` may come ONLY from the registry `freesynergy` (git index repo FreeSynergy-Net/fs-crates; ENTSCHEID-kaskade B2, K-3): the index URL, as in
# `registry+<URL>` of the lock. TRANSITION until the wave K-5 is done: the git repo FreeSynergy-Net/fs-types is still allowed (lift and `lock-gleich` of the running cascade
# check against it); K-5 DELETES that second entry, then a git fs-types is red (self test: scripts/test_check_lock_sources.sh, config with the index URL only).
# OFF until then, so today's repos do not turn red. Env: FS_LOCK_ONLY_FROM=1.
only_from_enabled = false

[only_from]
fs-types = ["https://github.com/FreeSynergy-Net/fs-crates", "https://github.com/FreeSynergy-Net/fs-types"]
